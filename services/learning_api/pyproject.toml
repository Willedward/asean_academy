[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "asean-academy-learning-api"
version = "0.1.0"
description = "Versioned HTTP API for ASEAN Academy course and practice services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asean-academy-question-bank",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
asean-academy-question-bank = { path = "../../question_bank", editable = true }

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/learning_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL with migrations and authored imports"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
