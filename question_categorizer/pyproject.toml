[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "asean-academy-question-categorizer"
version = "0.1.0"
description = "Local, reviewable mapping of extracted questions to the fixed mathematics syllabus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[project.scripts]
question-categorize = "question_categorizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/question_categorizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Regex rules and official syllabus descriptions are intentionally intact.
