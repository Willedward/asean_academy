<line data-segment="AB" x1="110.86" y1="338" x2="489.14" y2="338" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="489.14" y1="338" x2="371.97" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="110.86" y1="338" x2="371.97" y2="48" stroke="#124e52" stroke-width="5"/>
