<svg xmlns="http://www.w3.org/2000/svg" width="600" height="422" viewBox="0 0 600 422" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Locating C with two compass arcs</title><desc id="desc">Segment AB marked 5 cm. A compass arc centred at A and a compass arc centred at B meet at C. The dashed line from B to C is marked 7 cm and the dashed radius from A to C is marked r. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="422" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="AB" x1="172.42" y1="348" x2="427.58" y2="348" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="172.42" y1="348" x2="233.66" y2="48" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="BC" x1="427.58" y1="348" x2="233.66" y2="48" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-arc="arc-a-1" d="M159.26 42.1 A306.19 306.19 0 0 1 304.42 71.73" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-b-1" d="M166.84 103.82 A357.22 357.22 0 0 1 312 10" fill="none" stroke="#7d9799" stroke-width="3"/>
<circle data-point="C" cx="233.66" cy="48" r="4" fill="#124e52"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="402" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="point:A" x="154.23" y="374.6" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">A</text>
<text data-label-for="point:B" x="448.04" y="371.03" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">B</text>
<text data-label-for="point:C" x="227.44" y="29.22" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">C</text>
<text data-label-for="segment:AB" x="279.59" y="378.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
<text data-label-for="segment:BC" x="369.81" y="182.02" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">7 cm</text>
<text data-label-for="segment:AC" x="184.25" y="203.52" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">r</text>
</g>
</svg>
