<svg xmlns="http://www.w3.org/2000/svg" width="600" height="384" viewBox="0 0 600 384" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Equal-radius arcs on a ray</title><desc id="desc">A ray from endpoint A passes through B. Compass arcs of equal radius centred at A and B meet at C. The sides AB, BC and CA of the triangle have the same tick mark. The angle at A between the ray and AC is marked x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="384" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="85,310.25 387.82,310.25 236.41,48" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="85" y1="310.25" x2="387.82" y2="310.25" stroke="#124e52" stroke-width="5"/>
<line data-segment="BE" x1="387.82" y1="310.25" x2="515" y2="310.25" stroke="#124e52" stroke-width="3"/>
<line data-segment="BC" x1="387.82" y1="310.25" x2="236.41" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="85" y1="310.25" x2="236.41" y2="48" stroke="#124e52" stroke-width="5"/>
<path data-tick-mark="AB" data-ticks="1" d="M236.41 320.25 L236.41 300.25" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="BC" data-ticks="1" d="M320.78 174.13 L303.45 184.12" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="AC" data-ticks="1" d="M169.37 184.12 L152.04 174.13" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-arc="arc-a-1" d="M168.47 19.16 A302.82 302.82 0 0 1 295.36 92.42" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-b-1" d="M177.46 92.42 A302.82 302.82 0 0 1 304.35 19.16" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-angle-marker="angle-x" d="M131 310.25 A46 46 0 0 0 108 270.41" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="364" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-x" x="146.49" y="284.11" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">x</text>
<text data-label-for="point:A" x="63.81" y="331.84" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">A</text>
<text data-label-for="point:B" x="411.48" y="299.76" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">B</text>
<text data-label-for="point:C" x="236.41" y="30.44" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">C</text>
</g>
</svg>
