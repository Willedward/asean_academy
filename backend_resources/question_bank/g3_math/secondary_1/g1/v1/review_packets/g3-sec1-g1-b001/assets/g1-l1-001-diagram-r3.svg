<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="title desc">
<title id="title">Classifying a 35-degree angle</title><desc id="desc">Schematic for Classifying a 35-degree angle. Not drawn to scale. Stated measures include 35°.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs>
<rect width="940" height="390" rx="24" fill="#f8fafc"/><text x="36" y="38" class="heading">Classifying a 35-degree angle</text>
<g fill="none" stroke="#0f3d40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><g data-angle-kind="acute" data-angle-degrees="60"><line x1="100" y1="230" x2="100" y2="105"/><line x1="100" y1="230" x2="208.25" y2="167.5"/><path class="arc" d="M100 190 A40 40 0 0 1 134.64 210"/><text x="120" y="183" class="degree">60°</text><text x="73" y="305">acute</text></g><g data-angle-kind="right" data-angle-degrees="90"><line x1="310" y1="230" x2="310" y2="105"/><line x1="310" y1="230" x2="435" y2="230"/><path class="arc" d="M310 190 A40 40 0 0 1 350 230"/><text x="329" y="188" class="degree">90°</text><text x="280" y="305">right</text></g><g data-angle-kind="obtuse" data-angle-degrees="120"><line x1="520" y1="230" x2="520" y2="105"/><line x1="520" y1="230" x2="628.25" y2="292.5"/><path class="arc" d="M520 190 A40 40 0 0 1 554.64 250"/><text x="548" y="207" class="degree">120°</text><text x="486" y="325">obtuse</text></g><g data-angle-kind="reflex" data-angle-degrees="240"><line x1="730" y1="230" x2="730" y2="105"/><line x1="730" y1="230" x2="838.25" y2="292.5"/><path class="arc" d="M730 180 A50 50 0 1 0 773.3 255"/><text x="675" y="270" class="degree">240°</text><text x="708" y="325">reflex</text></g></g>
<text x="904" y="374" text-anchor="end" class="note">Use stated measurements · not drawn to scale</text>
<style>.heading{font:700 22px system-ui;fill:#0f3d40} text{font:600 17px system-ui;fill:#334155;stroke:none} .note{font:500 13px system-ui;fill:#64748b} .arc{stroke:#c87a1e} .mark{stroke:#c87a1e} .faint{stroke:#94a3b8;stroke-width:2} .dash{stroke:#c87a1e;stroke-dasharray:8 8} .arrow{stroke:#0f766e;marker-end:url(#arrow)} .grid{stroke:#dbe4e6;stroke-width:1}</style>
</svg>