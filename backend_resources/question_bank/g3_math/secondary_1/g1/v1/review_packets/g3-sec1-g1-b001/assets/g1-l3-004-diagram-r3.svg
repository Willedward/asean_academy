<rect data-role="background" width="600" height="382" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="70,308.02 530,308.02 220.12,48" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="70" y1="308.02" x2="530" y2="308.02" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="530" y1="308.02" x2="220.12" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="70" y1="308.02" x2="220.12" y2="48" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-2" d="M126 308.02 A56 56 0 0 0 98 259.52" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-1" d="M479.44 265.6 A66 66 0 0 0 464 308.02" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-3" d="M185.12 108.62 A70 70 0 0 0 273.74 93" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="362" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-2" x="201.99" y="238.83" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">(x + 20)°</text>
<text data-label-for="angle:angle-1" x="437.81" y="283.83" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">x°</text>
<text data-label-for="angle:angle-3" x="241.83" y="178.17" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">(x + 40)°</text>
