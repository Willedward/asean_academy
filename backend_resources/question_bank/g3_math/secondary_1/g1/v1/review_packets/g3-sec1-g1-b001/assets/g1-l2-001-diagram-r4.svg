<svg xmlns="http://www.w3.org/2000/svg" width="600" height="402" viewBox="0 0 600 402" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">A right angle split into two angles</title><desc id="desc">A right angle, shown with a corner mark, split in two by a ray. One part is marked 38° and the other part is marked x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="402" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="VA" x1="160" y1="328" x2="440" y2="328" stroke="#124e52" stroke-width="5"/>
<line data-segment="VB" x1="160" y1="328" x2="160" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="VR" x1="160" y1="328" x2="380.64" y2="155.61" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="V" d="M180 328 L180 308 L160 308" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-given" d="M230 328 A70 70 0 0 0 215.16 284.9" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-x" d="M202.55 294.75 A54 54 0 0 0 160 274" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="382" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-given" x="265.42" y="301.06" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">38°</text>
<text data-label-for="angle:angle-x" x="194.91" y="265.79" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">x</text>
</g>
</svg>
