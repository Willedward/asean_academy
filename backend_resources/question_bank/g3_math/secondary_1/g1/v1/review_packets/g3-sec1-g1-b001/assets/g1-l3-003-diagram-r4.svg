<svg xmlns="http://www.w3.org/2000/svg" width="600" height="392" viewBox="0 0 600 392" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Co-interior angles in a ratio</title><desc id="desc">Two parallel horizontal lines, shown with arrow marks, cut by one transversal. The two angles between the lines on the right of the transversal are marked 4k at the lower line and 5k at the upper line, where k is the size of one ratio part. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="392" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="L1L2" x1="65" y1="86.2" x2="535" y2="86.2" stroke="#124e52" stroke-width="5"/>
<line data-segment="M1M2" x1="65" y1="261.81" x2="535" y2="261.81" stroke="#124e52" stroke-width="5"/>
<line data-segment="T1T2" x1="257.05" y1="318.01" x2="307.83" y2="30" stroke="#124e52" stroke-width="5"/>
<path data-parallel-mark="L1L2" d="M100 95.2 L112 86.2 L100 77.2" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-parallel-mark="M1M2" d="M100 270.81 L112 261.81 L100 252.81" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-angle-marker="angle-first" d="M312.96 261.81 A46 46 0 0 0 274.95 216.51" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-second" d="M289.93 131.5 A46 46 0 0 0 343.92 86.2" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="372" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-first" x="327.52" y="220.35" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">4k</text>
<text data-label-for="angle:angle-second" x="348.15" y="155.42" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">5k</text>
</g>
</svg>
