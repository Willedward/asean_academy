<line data-segment="BC" x1="197.09" y1="348" x2="402.91" y2="348" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="300" y1="154.45" x2="402.91" y2="348" stroke="#124e52" stroke-width="5"/>
<line data-segment="BA" x1="197.09" y1="348" x2="300" y2="154.45" stroke="#124e52" stroke-width="5"/>
<line data-segment="AD" x1="300" y1="154.45" x2="356.6" y2="48" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="BA" data-ticks="1" d="M257.37 255.92 L239.72 246.53" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="AC" data-ticks="1" d="M342.63 255.92 L360.28 246.53" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-angle-marker="angle-exterior" d="M318.78 119.13 A40 40 0 0 1 318.78 189.77" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-x" d="M243.09 348 A46 46 0 0 0 218.69 307.38" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-y" d="M381.31 307.38 A46 46 0 0 0 356.91 348" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
