<title id="title">An isosceles triangle with an exterior angle at its apex</title><desc id="desc">An isosceles triangle with its two equal sides shown by tick marks. One equal side is extended beyond the apex, and the exterior angle between this extension and the other equal side is marked 124°. Each base angle is marked x. Not drawn to scale.</desc>
