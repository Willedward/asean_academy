<svg xmlns="http://www.w3.org/2000/svg" width="600" height="377" viewBox="0 0 600 377" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Co-interior angles in a ratio</title><desc id="desc">Two parallel horizontal lines, shown with arrow marks, cut by one transversal. The two angles between the lines on the right of the transversal are marked 2k at the lower line and 3k at the upper line, where k is the size of one ratio part. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="377" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="L1L2" x1="65" y1="83.24" x2="535" y2="83.24" stroke="#124e52" stroke-width="5"/>
<line data-segment="M1M2" x1="65" y1="249.62" x2="535" y2="249.62" stroke="#124e52" stroke-width="5"/>
<line data-segment="T1T2" x1="239.03" y1="302.86" x2="327.69" y2="30" stroke="#124e52" stroke-width="5"/>
<path data-parallel-mark="L1L2" d="M100 92.24 L112 83.24 L100 74.24" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-parallel-mark="M1M2" d="M100 258.62 L112 249.62 L100 240.62" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-angle-marker="angle-first" d="M302.33 249.62 A46 46 0 0 0 270.54 205.87" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-second" d="M296.18 126.99 A46 46 0 0 0 356.39 83.24" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="357" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-first" x="320.44" y="212.4" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">2k</text>
<text data-label-for="angle:angle-second" x="356.01" y="155.39" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">3k</text>
</g>
</svg>
