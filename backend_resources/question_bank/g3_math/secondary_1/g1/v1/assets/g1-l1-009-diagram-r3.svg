<title id="title">A triangle with two given angles</title><desc id="desc">A triangle with one base angle marked 50°, the other base angle marked 60° and the top angle marked x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="412" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="94.61,338 505.39,338 337.95,48" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="94.61" y1="338" x2="505.39" y2="338" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="505.39" y1="338" x2="337.95" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="94.61" y1="338" x2="337.95" y2="48" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-a" d="M140.61 338 A46 46 0 0 0 124.18 302.76" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-b" d="M482.39 298.16 A46 46 0 0 0 459.39 338" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-x" d="M308.38 83.24 A46 46 0 0 0 360.95 87.84" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
