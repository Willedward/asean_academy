<text data-label-for="angle:angle-a" x="181.14" y="307.01" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">50°</text>
<text data-label-for="angle:angle-b" x="429.86" y="303.75" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">60°</text>
<text data-label-for="angle:angle-x" x="332.4" y="120.76" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">x</text>
