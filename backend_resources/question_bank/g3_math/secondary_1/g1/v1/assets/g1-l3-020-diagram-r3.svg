<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Perpendicular diagonals, one bisected</title><desc id="desc">Only the diagonals of a quadrilateral are shown: two straight line segments crossing at a right angle, shown with a corner mark. The two parts of the horizontal segment have the same tick mark. The two parts of the vertical segment have different lengths. The sides are not drawn. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="420" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="AO" x1="300" y1="76" x2="300" y2="169" stroke="#124e52" stroke-width="5"/>
<circle data-point="A" cx="300" cy="76" r="4" fill="#124e52"/>
<line data-segment="BO" x1="183" y1="169" x2="300" y2="169" stroke="#124e52" stroke-width="5"/>
<circle data-point="B" cx="183" cy="169" r="4" fill="#124e52"/>
<line data-segment="CO" x1="300" y1="346" x2="300" y2="169" stroke="#124e52" stroke-width="5"/>
<circle data-point="C" cx="300" cy="346" r="4" fill="#124e52"/>
<line data-segment="DO" x1="417" y1="169" x2="300" y2="169" stroke="#124e52" stroke-width="5"/>
<circle data-point="D" cx="417" cy="169" r="4" fill="#124e52"/>
<path data-right-angle-marker="O" d="M320 169 L320 189 L300 189" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-tick-mark="BO" data-ticks="1" d="M241.5 179 L241.5 159" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="DO" data-ticks="1" d="M358.5 159 L358.5 179" fill="none" stroke="#124e52" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="400" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text x="300" y="42.48" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">Diagonals only; sides not drawn</text>
</g>
</svg>
