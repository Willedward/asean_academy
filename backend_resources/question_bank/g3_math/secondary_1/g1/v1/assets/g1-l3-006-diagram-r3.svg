<svg xmlns="http://www.w3.org/2000/svg" width="600" height="355" viewBox="0 0 600 355" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Two diagonals that bisect each other</title><desc id="desc">Only the diagonals of a quadrilateral are shown: two straight line segments crossing at a slant. Each of the four parts from the crossing point has the same tick mark, so the segments are equal and bisect each other. The sides are not drawn. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="355" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="AO" x1="115" y1="281.09" x2="300" y2="178.55" stroke="#124e52" stroke-width="5"/>
<circle data-point="A" cx="115" cy="281.09" r="4" fill="#124e52"/>
<line data-segment="BO" x1="115" y1="76" x2="300" y2="178.55" stroke="#124e52" stroke-width="5"/>
<circle data-point="B" cx="115" cy="76" r="4" fill="#124e52"/>
<line data-segment="CO" x1="485" y1="76" x2="300" y2="178.55" stroke="#124e52" stroke-width="5"/>
<circle data-point="C" cx="485" cy="76" r="4" fill="#124e52"/>
<line data-segment="DO" x1="485" y1="281.09" x2="300" y2="178.55" stroke="#124e52" stroke-width="5"/>
<circle data-point="D" cx="485" cy="281.09" r="4" fill="#124e52"/>
<path data-tick-mark="AO" data-ticks="1" d="M212.35 238.57 L202.65 221.07" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="CO" data-ticks="1" d="M387.65 118.53 L397.35 136.02" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="BO" data-ticks="1" d="M202.65 136.02 L212.35 118.53" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="DO" data-ticks="1" d="M397.35 221.07 L387.65 238.57" fill="none" stroke="#124e52" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="335" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text x="300" y="42.48" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">Diagonals only; sides not drawn</text>
</g>
</svg>
