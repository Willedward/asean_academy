<svg xmlns="http://www.w3.org/2000/svg" width="600" height="412" viewBox="0 0 600 412" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Four angles at two crossing lines</title><desc id="desc">Two straight lines crossing at a point, with an arc in each of the four angles. Going round the point, the angles are marked (3x − 5)°, (2x + 15)°, (3x − 5)° and (2x + 15)°. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="412" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="WE" x1="153.91" y1="193" x2="446.09" y2="193" stroke="#124e52" stroke-width="5"/>
<line data-segment="QP" x1="317.8" y1="338" x2="282.2" y2="48" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-1" d="M340 193 A40 40 0 0 0 295.13 153.3" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-2" d="M293.66 141.39 A52 52 0 0 0 248 193" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-3" d="M260 193 A40 40 0 0 0 304.87 232.7" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-4" d="M306.34 244.61 A52 52 0 0 0 352 193" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="392" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-1" x="371.35" y="119.38" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">(3x − 5)°</text>
<text data-label-for="angle:angle-2" x="201.52" y="112.89" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">(2x + 15)°</text>
<text data-label-for="angle:angle-3" x="228.65" y="280.66" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">(3x − 5)°</text>
<text data-label-for="angle:angle-4" x="398.48" y="287.15" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">(2x + 15)°</text>
</g>
</svg>
