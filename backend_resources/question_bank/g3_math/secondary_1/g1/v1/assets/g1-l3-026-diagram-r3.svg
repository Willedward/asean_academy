<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Perpendicular transversals across parallel lines</title><desc id="desc">Two parallel horizontal lines, shown with arrow marks, and two transversals that cross between them at a right angle, shown with a corner mark. At the lower line, one transversal makes an angle marked 37° and the other makes an angle marked x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="L1L2" x1="65" y1="30" x2="535" y2="30" stroke="#124e52" stroke-width="5"/>
<line data-segment="M1M2" x1="65" y1="219.2" x2="535" y2="219.2" stroke="#124e52" stroke-width="5"/>
<line data-segment="AE" x1="144.47" y1="219.2" x2="395.55" y2="30" stroke="#124e52" stroke-width="5"/>
<line data-segment="BF" x1="372.79" y1="219.2" x2="230.21" y2="30" stroke="#124e52" stroke-width="5"/>
<path data-parallel-mark="L1L2" d="M85.9 39 L97.9 30 L85.9 21" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-parallel-mark="M1M2" d="M85.9 228.2 L97.9 219.2 L85.9 210.2" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-right-angle-marker="P" d="M274.12 121.51 L286.15 137.48 L302.13 125.44" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-given" d="M202.47 219.2 A58 58 0 0 0 190.79 184.3" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-x" d="M326.79 219.2 A46 46 0 0 1 345.1 182.46" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-given" x="255.88" y="191.28" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">37°</text>
<text data-label-for="angle:angle-x" x="309.55" y="197.03" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">x</text>
</g>
</svg>
