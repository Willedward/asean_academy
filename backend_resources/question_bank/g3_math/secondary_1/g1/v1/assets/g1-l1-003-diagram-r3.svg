<svg xmlns="http://www.w3.org/2000/svg" width="600" height="362" viewBox="0 0 600 362" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Corresponding angles at parallel lines</title><desc id="desc">Two parallel horizontal lines, shown with arrow marks, cut by one transversal. At the upper line, the angle above the line and to the right of the transversal is marked 64°. At the lower line, the angle in the same position is marked x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="362" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="L1L2" x1="65" y1="80.34" x2="535" y2="80.34" stroke="#124e52" stroke-width="5"/>
<line data-segment="M1M2" x1="65" y1="237.65" x2="535" y2="237.65" stroke="#124e52" stroke-width="5"/>
<line data-segment="T1T2" x1="221.35" y1="287.99" x2="347.18" y2="30" stroke="#124e52" stroke-width="5"/>
<path data-parallel-mark="L1L2" d="M100 89.34 L112 80.34 L100 71.34" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-parallel-mark="M1M2" d="M100 246.65 L112 237.65 L100 228.65" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-angle-marker="angle-given" d="M368.63 80.34 A46 46 0 0 0 342.79 38.99" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-x" d="M291.91 237.65 A46 46 0 0 0 266.07 196.3" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="342" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-given" x="396.45" y="43.57" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">64°</text>
<text data-label-for="angle:angle-x" x="306.27" y="209.29" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">x</text>
</g>
</svg>
