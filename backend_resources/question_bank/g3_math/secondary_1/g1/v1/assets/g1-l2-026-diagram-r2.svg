<rect data-role="background" width="600" height="412" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="WE" x1="115.99" y1="193" x2="484.01" y2="193" stroke="#124e52" stroke-width="5"/>
<line data-segment="QP" x1="186.71" y1="338" x2="413.29" y2="48" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-a" d="M352 193 A52 52 0 0 0 332.02 152.02" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-1" d="M322.16 164.63 A36 36 0 0 0 264 193" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-b" d="M248 193 A52 52 0 0 0 267.98 233.98" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-2" d="M277.84 221.37 A36 36 0 0 0 336 193" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="392" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-a" x="369.18" y="168.62" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">a</text>
<text data-label-for="angle:angle-1" x="270.22" y="141.29" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">128°</text>
<text data-label-for="angle:angle-b" x="230.4" y="236.3" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">b</text>
<text data-label-for="angle:angle-2" x="329.78" y="263.43" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">128°</text>
</g>
