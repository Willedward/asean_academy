<svg xmlns="http://www.w3.org/2000/svg" width="600" height="319" viewBox="0 0 600 319" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Two adjacent angles on a straight line</title><desc id="desc">A straight line with one ray from a point on it. The angle to the right of the ray is marked 68° and the adjacent angle to its left is marked x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="319" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="LR" x1="60" y1="245.41" x2="540" y2="245.41" stroke="#124e52" stroke-width="5"/>
<line data-segment="OT" x1="300" y1="245.41" x2="382.99" y2="40" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-given" d="M356 245.41 A56 56 0 0 0 320.98 193.49" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-x" d="M314.98 208.32 A40 40 0 0 0 260 245.41" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="299" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-given" x="380.29" y="200.61" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">68°</text>
<text data-label-for="angle:angle-x" x="263.14" y="200.12" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">x</text>
</g>
</svg>
