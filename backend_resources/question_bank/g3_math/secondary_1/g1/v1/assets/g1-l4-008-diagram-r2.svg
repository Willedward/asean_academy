<title id="title">Compass arcs meeting on both sides of a segment</title><desc id="desc">Segment AB marked 5 cm. Compass arcs centred at A and B meet at C above the segment and at C′ below it. Triangle ABC has AC marked 6 cm and BC marked 7 cm. Triangle ABC′, the mirror image in AB, is dashed. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="462" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="227.71,218 372.29,218 262.41,48" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="227.71" y1="218" x2="372.29" y2="218" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="227.71" y1="218" x2="262.41" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="372.29" y1="218" x2="262.41" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="AD" x1="227.71" y1="218" x2="262.41" y2="388" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="BD" x1="372.29" y1="218" x2="262.41" y2="388" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-arc="arc-a-1" d="M220.25 44.66 A173.51 173.51 0 0 1 302.51 61.44" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-a-2" d="M302.51 374.56 A173.51 173.51 0 0 1 220.25 391.34" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-b-1" d="M224.55 79.63 A202.42 202.42 0 0 1 306.8 26.47" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-b-2" d="M306.8 409.53 A202.42 202.42 0 0 1 224.55 356.37" fill="none" stroke="#7d9799" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="442" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
