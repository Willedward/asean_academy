<svg xmlns="http://www.w3.org/2000/svg" width="600" height="422" viewBox="0 0 600 422" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Equal-radius arcs from the ends of a segment</title><desc id="desc">Segment AB marked 10 cm. Compass arcs of equal radius centred at A and B meet at two points, one above and one below the segment. A dashed radius from each of A and B to the upper point is marked r. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="422" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="AB" x1="174.72" y1="198" x2="425.28" y2="198" stroke="#124e52" stroke-width="5"/>
<line data-segment="AP" x1="174.72" y1="198" x2="300" y2="48" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="BP" x1="425.28" y1="198" x2="300" y2="48" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-arc="arc-a-1" d="M259.99 22.15 A195.44 195.44 0 0 1 332.57 82.76" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-a-2" d="M332.57 313.24 A195.44 195.44 0 0 1 259.99 373.85" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-b-1" d="M267.43 82.76 A195.44 195.44 0 0 1 340.01 22.15" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-b-2" d="M340.01 373.85 A195.44 195.44 0 0 1 267.43 313.24" fill="none" stroke="#7d9799" stroke-width="3"/>
<circle data-point="P" cx="300" cy="48" r="4" fill="#124e52"/>
<circle data-point="Q" cx="300" cy="348" r="4" fill="#124e52"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="402" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="point:A" x="154.32" y="207.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">A</text>
<text data-label-for="point:B" x="445.55" y="207.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">B</text>
<text data-label-for="segment:AB" x="300" y="228.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">10 cm</text>
<text data-label-for="segment:AP" x="220.02" y="117.88" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">r</text>
<text data-label-for="segment:BP" x="379.98" y="117.88" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">r</text>
</g>
</svg>
