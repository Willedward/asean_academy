<svg xmlns="http://www.w3.org/2000/svg" width="600" height="354" viewBox="0 0 600 354" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Two transversals meeting between parallel lines</title><desc id="desc">Two parallel horizontal lines, shown with arrow marks, and two transversals that cross at point P between them. Going up from P, one transversal reaches the upper line to the left, making an angle marked 38° with it, and the other reaches it to the right, making an angle marked 67°. The angle at P between the two upward rays is marked x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="354" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="L1L2" x1="65" y1="30" x2="535" y2="30" stroke="#124e52" stroke-width="5"/>
<line data-segment="M1M2" x1="65" y1="280.01" x2="535" y2="280.01" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="140" y1="30" x2="460" y2="280.01" stroke="#124e52" stroke-width="5"/>
<line data-segment="BD" x1="429.76" y1="30" x2="323.64" y2="280.01" stroke="#124e52" stroke-width="5"/>
<path data-parallel-mark="L1L2" d="M85.9 39 L97.9 30 L85.9 21" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-parallel-mark="M1M2" d="M85.9 289.01 L97.9 280.01 L85.9 271.01" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-angle-marker="angle-left" d="M192 30 A52 52 0 0 1 180.98 62.01" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-right" d="M389.76 30 A40 40 0 0 0 414.13 66.82" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-x" d="M330.81 179.08 A34 34 0 0 1 370.88 168.71" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<circle data-point="P" cx="357.6" cy="200.01" r="5" fill="#124e52"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="334" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-left" x="245.42" y="75.66" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">38°</text>
<text data-label-for="angle:angle-right" x="362.3" y="84.01" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">67°</text>
<text data-label-for="angle:angle-x" x="344.39" y="158.3" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">x</text>
<text data-label-for="point:P" x="325.23" y="229.6" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">P</text>
</g>
</svg>
