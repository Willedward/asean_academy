<svg xmlns="http://www.w3.org/2000/svg" width="600" height="325" viewBox="0 0 600 325" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Two adjacent angles in a ratio on a straight line</title><desc id="desc">A straight line with one ray from a point on it. The two adjacent angles are marked 2k and 3k, where k is the size of one ratio part. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="325" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="LR" x1="60" y1="250.7" x2="540" y2="250.7" stroke="#124e52" stroke-width="5"/>
<line data-segment="OT" x1="300" y1="250.7" x2="368.46" y2="40" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-first" d="M356 250.7 A56 56 0 0 0 317.3 197.44" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-second" d="M312.36 212.66 A40 40 0 0 0 260 250.7" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="305" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-first" x="372.2" y="207.6" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">2k</text>
<text data-label-for="angle:angle-second" x="257.91" y="202.13" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">3k</text>
</g>
</svg>
