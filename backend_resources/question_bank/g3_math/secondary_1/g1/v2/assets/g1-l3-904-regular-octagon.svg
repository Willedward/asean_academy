<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
  <title id="title">Central triangle in a regular octagon</title>
  <desc id="desc">A regular octagon has centre O. Adjacent vertices A and B are joined to O, forming isosceles triangle AOB. The diagram is not drawn to scale.</desc>
  <rect width="940" height="520" rx="24" fill="#f8fafc"/>
  <text x="36" y="44" class="heading">Central triangle in a regular octagon</text>
  <g fill="none" stroke="#0f3d40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="618,214 531,127 409,127 322,214 322,336 409,423 531,423 618,336"/>
    <line x1="470" y1="275" x2="409" y2="127"/>
    <line x1="470" y1="275" x2="531" y2="127"/>
    <circle cx="470" cy="275" r="6" fill="#0f3d40" stroke="none"/>
    <path class="arc" d="M453 233 A45 45 0 0 1 487 233"/>
    <path class="tick" d="M431 199 l13 -6 M496 193 l13 6"/>
  </g>
  <text x="389" y="113">A</text>
  <text x="535" y="113">B</text>
  <text x="445" y="302">O</text>
  <text x="458" y="219" class="angle-label">45°</text>
  <text x="904" y="498" text-anchor="end" class="note">Regular octagon · not drawn to scale</text>
  <style>
    .heading{font:700 23px system-ui,sans-serif;fill:#0f3d40}
    text{font:600 19px system-ui,sans-serif;fill:#334155}
    .angle-label{font:700 19px system-ui,sans-serif;fill:#9a5b13}
    .note{font:500 14px system-ui,sans-serif;fill:#64748b}
    .arc,.tick{stroke:#c87a1e;stroke-width:5}
  </style>
</svg>
