<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Adjacent and vertically opposite angles</title>
  <desc id="desc">Two straight lines intersect at O. The top angle is labelled 5x minus 8 degrees, the right angle is labelled 3x plus 12 degrees, and the bottom vertically opposite angle is labelled y degrees. The diagram is not drawn to scale.</desc>
  <rect width="940" height="500" rx="24" fill="#f8fafc"/>
  <text x="36" y="44" class="heading">Adjacent and vertically opposite angles</text>
  <g fill="none" stroke="#0f3d40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="299" y1="439" x2="641" y2="161"/>
    <line x1="299" y1="161" x2="641" y2="439"/>
    <circle cx="470" cy="300" r="6" fill="#0f3d40" stroke="none"/>
    <path class="arc" d="M532 250 A80 80 0 0 0 408 250"/>
    <path class="arc" d="M532 250 A80 80 0 0 1 532 350"/>
    <path class="arc" d="M408 350 A80 80 0 0 0 532 350"/>
  </g>
  <text x="448" y="326">O</text>
  <text x="426" y="205" class="angle-label">(5x − 8)°</text>
  <text x="560" y="306" class="angle-label">(3x + 12)°</text>
  <text x="457" y="404" class="angle-label">y°</text>
  <text x="904" y="478" text-anchor="end" class="note">Not drawn to scale</text>
  <style>
    .heading{font:700 23px system-ui,sans-serif;fill:#0f3d40}
    text{font:600 19px system-ui,sans-serif;fill:#334155}
    .angle-label{font:700 19px system-ui,sans-serif;fill:#9a5b13}
    .note{font:500 14px system-ui,sans-serif;fill:#64748b}
    .arc{stroke:#c87a1e;stroke-width:5}
  </style>
</svg>
