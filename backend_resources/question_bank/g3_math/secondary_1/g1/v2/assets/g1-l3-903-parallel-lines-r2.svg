<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
  <title id="title">Parallel lines cut by a transversal</title>
  <desc id="desc">Parallel horizontal lines AB and CD are cut by a steep transversal. Two co-interior angles are labelled 5x minus 11 degrees and 3x plus 15 degrees. The angle vertically opposite the latter is labelled y degrees. The diagram is not drawn to scale.</desc>
  <rect width="940" height="520" rx="24" fill="#f8fafc"/>
  <text x="36" y="44" class="heading">Parallel lines and a transversal</text>
  <g fill="none" stroke="#0f3d40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="160" y1="170" x2="790" y2="170"/>
    <line x1="160" y1="370" x2="790" y2="370"/>
    <line x1="472" y1="455" x2="545" y2="70"/>
    <path class="parallel" d="M245 156 l18 14 -18 14 M275 156 l18 14 -18 14"/>
    <path class="parallel" d="M245 356 l18 14 -18 14 M275 356 l18 14 -18 14"/>
    <path data-angle-marker="upper-co-interior" class="arc" d="M 581.04 170 A 55 55 0 0 1 515.79 224.04"/>
    <path data-angle-marker="lower-co-interior" class="arc" d="M 498.36 315.96 A 55 55 0 0 1 543.12 370"/>
    <path data-angle-marker="vertical-opposite" class="arc" d="M 477.87 424.04 A 55 55 0 0 1 433.12 370"/>
  </g>
  <text x="135" y="160">A</text>
  <text x="802" y="178">B</text>
  <text x="135" y="360">C</text>
  <text x="802" y="378">D</text>
  <text x="586" y="234" class="angle-label">(5x − 11)°</text>
  <text x="560" y="316" class="angle-label">(3x + 15)°</text>
  <text x="407" y="442" text-anchor="end" class="angle-label">y°</text>
  <text x="904" y="498" text-anchor="end" class="note">AB ∥ CD · not drawn to scale</text>
  <style>
    .heading{font:700 23px system-ui,sans-serif;fill:#0f3d40}
    text{font:600 19px system-ui,sans-serif;fill:#334155}
    .angle-label{font:700 18px system-ui,sans-serif;fill:#9a5b13}
    .note{font:500 14px system-ui,sans-serif;fill:#64748b}
    .arc,.parallel{stroke:#c87a1e;stroke-width:5}
  </style>
</svg>
