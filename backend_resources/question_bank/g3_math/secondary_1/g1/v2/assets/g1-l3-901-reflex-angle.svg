<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Smaller and reflex angles around a point</title>
  <desc id="desc">Two rays OA and OB form a smaller angle labelled x degrees and a reflex angle labelled 2x plus 60 degrees. The diagram is not drawn to scale.</desc>
  <rect width="940" height="500" rx="24" fill="#f8fafc"/>
  <text x="36" y="44" class="heading">Smaller and reflex angles around a point</text>
  <g fill="none" stroke="#0f3d40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="470" y1="285" x2="735" y2="285"/>
    <line x1="470" y1="285" x2="433" y2="75"/>
    <circle cx="470" cy="285" r="6" fill="#0f3d40" stroke="none"/>
    <path class="arc" d="M555 285 A85 85 0 0 0 455 201"/>
    <path class="arc" d="M449 167 A120 120 0 1 0 590 285"/>
  </g>
  <text x="745" y="293">A</text>
  <text x="414" y="68">B</text>
  <text x="447" y="315">O</text>
  <text x="508" y="207" class="angle-label">x°</text>
  <text x="334" y="402" class="angle-label">(2x + 60)°</text>
  <text x="904" y="478" text-anchor="end" class="note">Not drawn to scale</text>
  <style>
    .heading{font:700 23px system-ui,sans-serif;fill:#0f3d40}
    text{font:600 19px system-ui,sans-serif;fill:#334155}
    .angle-label{font:700 20px system-ui,sans-serif;fill:#9a5b13}
    .note{font:500 14px system-ui,sans-serif;fill:#64748b}
    .arc{stroke:#c87a1e;stroke-width:5}
  </style>
</svg>
