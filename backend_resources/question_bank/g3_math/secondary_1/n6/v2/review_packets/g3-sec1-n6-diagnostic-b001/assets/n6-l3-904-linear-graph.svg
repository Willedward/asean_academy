<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Straight-line graph with two marked intercepts</title>
  <desc id="desc">A decreasing straight line crosses the y-axis at 6 and the x-axis at 3.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0f3d40"/></marker></defs>
  <rect width="720" height="520" rx="20" fill="#f8fafc"/>
  <text x="32" y="38" class="heading">Graph of a linear function</text>
  <g transform="translate(0 40)">
  <g class="grid">
    <path d="M80 40V460 M130 40V460 M180 40V460 M230 40V460 M280 40V460 M330 40V460 M380 40V460 M430 40V460 M480 40V460 M530 40V460 M580 40V460"/>
    <path d="M80 40H580 M80 70H580 M80 100H580 M80 130H580 M80 160H580 M80 190H580 M80 220H580 M80 250H580 M80 280H580 M80 310H580 M80 340H580 M80 370H580 M80 400H580 M80 430H580 M80 460H580"/>
  </g>
  <g class="axis"><path d="M75 340H610" marker-end="url(#arrow)"/><path d="M280 465V35" marker-end="url(#arrow)"/></g>
  <path d="M180 40L530 460" class="line"/>
  <g class="points"><circle cx="280" cy="160" r="6"/><circle cx="430" cy="340" r="6"/></g>
  <g class="ticks">
    <text x="176" y="358">−2</text><text x="226" y="358">−1</text><text x="276" y="358">0</text><text x="326" y="358">1</text><text x="376" y="358">2</text><text x="426" y="358">3</text><text x="476" y="358">4</text><text x="526" y="358">5</text>
    <text x="257" y="435">−3</text><text x="257" y="375">−1</text><text x="261" y="315">1</text><text x="261" y="255">3</text><text x="261" y="195">5</text><text x="261" y="165">6</text><text x="261" y="105">8</text><text x="255" y="45">10</text>
    <text x="618" y="348" class="label">x</text><text x="288" y="34" class="label">y</text>
  </g>
  <text x="292" y="150" class="point-label">(0, 6)</text><text x="440" y="330" class="point-label">(3, 0)</text>
  </g>
  <style>
    .heading{font:700 22px system-ui;fill:#0f3d40}.grid{fill:none;stroke:#dbe4e6;stroke-width:1}.axis{fill:none;stroke:#0f3d40;stroke-width:2.5}.line{fill:none;stroke:#0f766e;stroke-width:4}.points{fill:#c87a1e}.ticks text{font:500 12px system-ui;fill:#64748b}.ticks .label{font:700 16px system-ui;fill:#0f3d40}.point-label{font:700 15px system-ui;fill:#0f3d40}
  </style>
</svg>
