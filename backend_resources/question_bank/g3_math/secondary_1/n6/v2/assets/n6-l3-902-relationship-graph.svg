<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Graph of an ordered-pair relationship</title>
  <desc id="desc">A straight line passes through the plotted points negative 2 comma 8, 0 comma 4, 2 comma 0 and 4 comma negative 4.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0f3d40"/></marker></defs>
  <rect width="720" height="520" rx="20" fill="#f8fafc"/>
  <text x="32" y="38" class="heading">Relationship between x and y</text>
  <g class="grid">
    <path d="M80 60V460 M120 60V460 M160 60V460 M200 60V460 M240 60V460 M280 60V460 M320 60V460 M360 60V460 M400 60V460 M440 60V460 M480 60V460 M520 60V460 M560 60V460 M600 60V460"/>
    <path d="M80 60H600 M80 100H600 M80 140H600 M80 180H600 M80 220H600 M80 260H600 M80 300H600 M80 340H600 M80 380H600 M80 420H600 M80 460H600"/>
  </g>
  <g class="axis"><path d="M75 220H630" marker-end="url(#arrow)"/><path d="M280 465V50" marker-end="url(#arrow)"/></g>
  <path d="M120 60L560 500" class="line"/>
  <g class="points"><circle cx="200" cy="60" r="6"/><circle cx="280" cy="140" r="6"/><circle cx="360" cy="220" r="6"/><circle cx="440" cy="300" r="6"/></g>
  <g class="ticks">
    <text x="194" y="238">−2</text><text x="274" y="238">0</text><text x="356" y="238">2</text><text x="436" y="238">4</text><text x="516" y="238">6</text>
    <text x="254" y="65">8</text><text x="254" y="145">4</text><text x="250" y="305">−4</text><text x="250" y="385">−8</text><text x="244" y="465">−12</text>
    <text x="638" y="228" class="label">x</text><text x="288" y="50" class="label">y</text>
  </g>
  <style>
    .heading{font:700 22px system-ui;fill:#0f3d40}.grid{fill:none;stroke:#dbe4e6;stroke-width:1}.axis{fill:none;stroke:#0f3d40;stroke-width:2.5}.line{fill:none;stroke:#0f766e;stroke-width:4}.points{fill:#c87a1e}.ticks text{font:500 12px system-ui;fill:#64748b}.ticks .label{font:700 16px system-ui;fill:#0f3d40}
  </style>
</svg>
