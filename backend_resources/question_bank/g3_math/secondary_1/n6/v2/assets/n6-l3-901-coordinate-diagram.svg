<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Points A and B on a Cartesian grid</title>
  <desc id="desc">A coordinate grid from negative 6 to positive 8 on the x-axis and negative 5 to positive 6 on the y-axis. Point A is at negative 5 comma 4 and point B is at 3 comma negative 2.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0f3d40"/></marker>
  </defs>
  <rect width="720" height="520" rx="20" fill="#f8fafc"/>
  <text x="32" y="38" class="heading">Points A and B</text>
  <g class="grid">
    <path d="M60 60V460 M100 60V460 M140 60V460 M180 60V460 M220 60V460 M260 60V460 M300 60V460 M340 60V460 M380 60V460 M420 60V460 M460 60V460 M500 60V460 M540 60V460 M580 60V460 M620 60V460"/>
    <path d="M60 60H620 M60 100H620 M60 140H620 M60 180H620 M60 220H620 M60 260H620 M60 300H620 M60 340H620 M60 380H620 M60 420H620 M60 460H620"/>
  </g>
  <g class="axis">
    <path d="M55 260H650" marker-end="url(#arrow)"/><path d="M300 465V50" marker-end="url(#arrow)"/>
  </g>
  <g class="ticks">
    <text x="58" y="282">−6</text><text x="98" y="282">−5</text><text x="138" y="282">−4</text><text x="178" y="282">−3</text><text x="218" y="282">−2</text><text x="258" y="282">−1</text>
    <text x="336" y="282">1</text><text x="376" y="282">2</text><text x="416" y="282">3</text><text x="456" y="282">4</text><text x="496" y="282">5</text><text x="536" y="282">6</text><text x="576" y="282">7</text><text x="616" y="282">8</text>
    <text x="278" y="465">−5</text><text x="278" y="425">−4</text><text x="278" y="385">−3</text><text x="278" y="345">−2</text><text x="278" y="305">−1</text>
    <text x="282" y="225">1</text><text x="282" y="185">2</text><text x="282" y="145">3</text><text x="282" y="105">4</text><text x="282" y="65">5</text>
    <text x="656" y="268" class="label">x</text><text x="308" y="50" class="label">y</text><text x="286" y="280">0</text>
  </g>
  <g class="points">
    <circle cx="100" cy="100" r="6"/><circle cx="420" cy="340" r="6"/>
    <text x="76" y="88" class="point-label">A</text><text x="430" y="362" class="point-label">B</text>
  </g>
  <style>
    .heading{font:700 22px system-ui;fill:#0f3d40}.grid{fill:none;stroke:#dbe4e6;stroke-width:1}.axis{fill:none;stroke:#0f3d40;stroke-width:2.5}.ticks text{font:500 12px system-ui;fill:#64748b}.ticks .label{font:700 16px system-ui;fill:#0f3d40}.points{fill:#c87a1e}.point-label{font:700 18px system-ui;fill:#0f3d40}
  </style>
</svg>
