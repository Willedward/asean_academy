<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title description">
  <title id="title">Number line with points P, Q, R and S</title>
  <desc id="description">A number line from negative three to three in intervals of one half. P is at negative two point five, Q is at negative zero point five, R is at one, and S is at two point five.</desc>
  <rect width="760" height="180" rx="16" fill="#f8fbff"/>
  <line x1="70" y1="100" x2="690" y2="100" stroke="#243b53" stroke-width="3"/>
  <path d="M690 100l-12-7v14z" fill="#243b53"/>
  <g stroke="#486581" stroke-width="2">
    <path d="M80 88v24M130 92v16M180 88v24M230 92v16M280 88v24M330 92v16M380 88v24M430 92v16M480 88v24M530 92v16M580 88v24M630 92v16M680 88v24"/>
  </g>
  <g fill="#243b53" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="80" y="136">−3</text><text x="180" y="136">−2</text><text x="280" y="136">−1</text>
    <text x="380" y="136">0</text><text x="480" y="136">1</text><text x="580" y="136">2</text><text x="680" y="136">3</text>
  </g>
  <g fill="#087f8c" stroke="#fff" stroke-width="3">
    <circle cx="130" cy="100" r="8"/><circle cx="330" cy="100" r="8"/><circle cx="480" cy="100" r="8"/><circle cx="630" cy="100" r="8"/>
  </g>
  <g fill="#087f8c" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="130" y="72">P</text><text x="330" y="72">Q</text><text x="480" y="72">R</text><text x="630" y="72">S</text>
  </g>
</svg>
