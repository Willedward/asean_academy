<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Mosaic made from 24 equal tiles</title>
  <desc id="desc">A six by four grid represents 24 equal tiles. Each tile has area 250 square centimetres.</desc>
  <rect width="940" height="500" rx="24" fill="#f8fafc"/>
  <text x="36" y="48" class="heading">Mosaic tile layout</text>
  <g transform="translate(205 105)" stroke="#0f3d40" stroke-width="3">
    <rect width="528" height="264" fill="#dff3ef" stroke-width="5"/>
    <path d="M88 0V264 M176 0V264 M264 0V264 M352 0V264 M440 0V264 M0 66H528 M0 132H528 M0 198H528"/>
    <rect x="0" y="0" width="88" height="66" fill="#fff7ed" stroke="#c87a1e" stroke-width="4"/>
  </g>
  <text x="469" y="408" text-anchor="middle" class="measure">24 equal tiles</text>
  <path d="M185 105 C195 120 210 132 238 139" fill="none" stroke="#c87a1e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="116" y="78" class="label">one tile:</text>
  <text x="116" y="102" class="label">250 cm²</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c87a1e"/>
    </marker>
  </defs>
  <style>
    .heading{font:700 23px system-ui,sans-serif;fill:#0f3d40}
    .measure{font:700 20px system-ui,sans-serif;fill:#9a5b13}
    .label{font:700 17px system-ui,sans-serif;fill:#9a5b13}
  </style>
</svg>
