<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Trapezium divided into two equal-area pieces</title>
  <desc id="desc">A trapezium has parallel sides of 9 centimetres and 17 centimetres and perpendicular height 8 centimetres. The diagram is not drawn to scale.</desc>
  <rect width="940" height="500" rx="24" fill="#f8fafc"/>
  <text x="36" y="48" class="heading">Trapezium dimensions</text>
  <polygon points="300,130 610,130 745,365 170,365" fill="#dff3ef" stroke="#0f3d40" stroke-width="5" stroke-linejoin="round"/>
  <line x1="300" y1="130" x2="300" y2="365" class="height"/>
  <path d="M300 337 L328 337 L328 365" fill="none" stroke="#0f3d40" stroke-width="4"/>
  <text x="455" y="108" text-anchor="middle" class="measure">9 cm</text>
  <text x="457" y="407" text-anchor="middle" class="measure">17 cm</text>
  <text x="276" y="255" text-anchor="middle" class="measure" transform="rotate(-90 276 255)">8 cm</text>
  <text x="455" y="265" text-anchor="middle" class="inside">divided into two pieces</text>
  <text x="455" y="294" text-anchor="middle" class="inside">of equal area</text>
  <text x="904" y="478" text-anchor="end" class="note">Not drawn to scale</text>
  <style>
    .heading{font:700 23px system-ui,sans-serif;fill:#0f3d40}
    .measure{font:700 20px system-ui,sans-serif;fill:#9a5b13}
    .inside{font:600 18px system-ui,sans-serif;fill:#334155}
    .height{stroke:#c87a1e;stroke-width:4;stroke-dasharray:10 8}
    .note{font:500 14px system-ui,sans-serif;fill:#64748b}
  </style>
</svg>
