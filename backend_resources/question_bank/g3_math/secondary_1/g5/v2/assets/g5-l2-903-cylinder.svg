<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Closed cylindrical container</title>
  <desc id="desc">A cylinder has diameter 14 centimetres and height 9 centimetres. The diagram is not drawn to scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c87a1e"/>
    </marker>
  </defs>
  <rect width="940" height="500" rx="24" fill="#f8fafc"/>
  <text x="36" y="48" class="heading">Cylindrical container</text>
  <ellipse cx="445" cy="140" rx="170" ry="55" fill="#dff3ef" stroke="#0f3d40" stroke-width="5"/>
  <path d="M275 140 L275 360 M615 140 L615 360" fill="none" stroke="#0f3d40" stroke-width="5"/>
  <ellipse cx="445" cy="360" rx="170" ry="55" fill="#dff3ef" stroke="#0f3d40" stroke-width="5"/>
  <path d="M275 360 A170 55 0 0 0 615 360" fill="none" stroke="#0f3d40" stroke-width="5"/>
  <line x1="282" y1="140" x2="608" y2="140" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="445" y="120" text-anchor="middle" class="measure">diameter 14 cm</text>
  <line x1="675" y1="150" x2="675" y2="350" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="708" y="258" text-anchor="middle" class="measure" transform="rotate(-90 708 258)">9 cm</text>
  <text x="904" y="478" text-anchor="end" class="note">Not drawn to scale</text>
  <style>
    .heading{font:700 23px system-ui,sans-serif;fill:#0f3d40}
    .measure{font:700 19px system-ui,sans-serif;fill:#9a5b13}
    .dimension{stroke:#c87a1e;stroke-width:3}
    .note{font:500 14px system-ui,sans-serif;fill:#64748b}
  </style>
</svg>
