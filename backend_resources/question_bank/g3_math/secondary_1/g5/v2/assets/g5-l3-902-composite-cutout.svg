<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Rectangular sign with a trapezium cut-out</title>
  <desc id="desc">A rectangle measuring 22 centimetres by 14 centimetres contains a trapezium cut-out with parallel sides 6 centimetres and 10 centimetres and perpendicular height 4 centimetres. The diagram is not drawn to scale.</desc>
  <rect width="940" height="500" rx="24" fill="#f8fafc"/>
  <text x="36" y="48" class="heading">Composite sign</text>
  <rect x="155" y="105" width="630" height="300" rx="4" fill="#dff3ef" stroke="#0f3d40" stroke-width="5"/>
  <polygon points="390,185 550,185 600,315 340,315" fill="#fff7ed" stroke="#c87a1e" stroke-width="5" stroke-linejoin="round"/>
  <line x1="550" y1="185" x2="550" y2="315" class="height"/>
  <path d="M550 289 L576 289 L576 315" fill="none" stroke="#0f3d40" stroke-width="4"/>
  <text x="470" y="164" text-anchor="middle" class="measure">6 cm</text>
  <text x="470" y="350" text-anchor="middle" class="measure">10 cm</text>
  <text x="530" y="256" text-anchor="middle" class="measure" transform="rotate(-90 530 256)">4 cm</text>
  <text x="470" y="258" text-anchor="middle" class="inside">cut-out</text>
  <text x="470" y="438" text-anchor="middle" class="measure">22 cm</text>
  <text x="815" y="260" text-anchor="middle" class="measure" transform="rotate(-90 815 260)">14 cm</text>
  <text x="904" y="478" text-anchor="end" class="note">Not drawn to scale</text>
  <style>
    .heading{font:700 23px system-ui,sans-serif;fill:#0f3d40}
    .measure{font:700 19px system-ui,sans-serif;fill:#9a5b13}
    .inside{font:700 18px system-ui,sans-serif;fill:#9a5b13}
    .height{stroke:#0f3d40;stroke-width:3;stroke-dasharray:8 7}
    .note{font:500 14px system-ui,sans-serif;fill:#64748b}
  </style>
</svg>
