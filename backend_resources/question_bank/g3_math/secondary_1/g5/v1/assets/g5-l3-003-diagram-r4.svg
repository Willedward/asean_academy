<svg xmlns="http://www.w3.org/2000/svg" width="600" height="398" viewBox="0 0 600 398" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">An L-shape left after a corner is removed</title><desc id="desc">An L-shape. The full bottom edge is 16 m and the full left edge is 12 m. The removed top-right corner has edges 6 m and 5 m. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="398" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="l-shape" data-points="A B C D E F" points="120,310 480,310 480,152.5 345,152.5 345,40 120,40" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="120" y1="310" x2="480" y2="310" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="480" y1="310" x2="480" y2="152.5" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="480" y1="152.5" x2="345" y2="152.5" stroke="#124e52" stroke-width="5"/>
<line data-segment="DE" x1="345" y1="152.5" x2="345" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="EF" x1="345" y1="40" x2="120" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="FA" x1="120" y1="40" x2="120" y2="310" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="378" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="300" y="340.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">16 m</text>
<text data-label-for="segment:FA" x="72.06" y="184.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">12 m</text>
<text data-label-for="segment:CD" x="428.7" y="140.44" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 m</text>
<text data-label-for="segment:DE" x="383.58" y="105.61" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 m</text>
</g>
</svg>
