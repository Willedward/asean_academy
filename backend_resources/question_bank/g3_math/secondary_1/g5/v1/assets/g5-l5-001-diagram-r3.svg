<svg xmlns="http://www.w3.org/2000/svg" width="600" height="318" viewBox="0 0 600 318" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">A trapezium and a parallelogram with algebraic lengths</title><desc id="desc">A trapezium with parallel sides x cm and (x + 4) cm and dashed perpendicular height 10 cm, beside a parallelogram with base (x + 3) cm and dashed perpendicular height 8 cm. A right angle is marked at the foot of each height. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="318" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="Ttrapezium" data-points="TA TB TC TD" points="35,230.23 261.5,230.23 226.65,56 69.85,56" fill="#fdf3e6" stroke="none"/>
<line data-segment="TATB" x1="35" y1="230.23" x2="261.5" y2="230.23" stroke="#124e52" stroke-width="5"/>
<line data-segment="TBTC" x1="261.5" y1="230.23" x2="226.65" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="TCTD" x1="226.65" y1="56" x2="69.85" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="TDTA" x1="69.85" y1="56" x2="35" y2="230.23" stroke="#124e52" stroke-width="5"/>
<line data-segment="TDTF" x1="69.85" y1="56" x2="69.85" y2="230.23" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="TF" d="M87.85 230.23 L87.85 212.23 L69.85 212.23" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<polygon data-shape="Pparallelogram" data-points="PA PB PC PD" points="293.21,230.23 502.28,230.23 565,90.85 355.93,90.85" fill="#e7f2f0" stroke="none"/>
<line data-segment="PAPB" x1="293.21" y1="230.23" x2="502.28" y2="230.23" stroke="#124e52" stroke-width="5"/>
<line data-segment="PBPC" x1="502.28" y1="230.23" x2="565" y2="90.85" stroke="#124e52" stroke-width="5"/>
<line data-segment="PCPD" x1="565" y1="90.85" x2="355.93" y2="90.85" stroke="#124e52" stroke-width="5"/>
<line data-segment="PDPA" x1="355.93" y1="90.85" x2="293.21" y2="230.23" stroke="#124e52" stroke-width="5"/>
<line data-segment="PDPF" x1="355.93" y1="90.85" x2="355.93" y2="230.23" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="PF" d="M373.93 230.23 L373.93 212.23 L355.93 212.23" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="298" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:TATB" x="148.25" y="261.01" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(x + 4) cm</text>
<text data-label-for="segment:TCTD" x="148.25" y="43.94" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">x cm</text>
<text data-label-for="segment:TDTF" x="125.72" y="152.48" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">10 cm</text>
<text data-label-for="segment:PAPB" x="397.75" y="261.01" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(x + 3) cm</text>
<text data-label-for="segment:PDPF" x="402.44" y="169.9" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">8 cm</text>
</g>
</svg>
