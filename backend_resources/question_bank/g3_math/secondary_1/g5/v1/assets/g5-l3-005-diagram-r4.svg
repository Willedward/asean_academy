<svg xmlns="http://www.w3.org/2000/svg" width="600" height="388" viewBox="0 0 600 388" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">A triangular prism with a right-triangle cross-section</title><desc id="desc">A triangular prism. Its front face is a right triangle with perpendicular sides 4 cm and 3 cm and longest side 5 cm, and the right angle is marked. The prism is 10 cm long, and hidden edges are dashed. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="388" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="rear-face" data-points="Ab Bb Cb" points="302.2,168.04 486.26,168.04 302.2,30" fill="#d5e8e4" stroke="none"/>
<polygon data-shape="side-BC" data-points="B C Cb Bb" points="297.8,300 113.74,161.96 302.2,30 486.26,168.04" fill="#f1f8f6" stroke="none"/>
<polygon data-shape="cross-section" data-points="A B C" points="113.74,300 297.8,300 113.74,161.96" fill="#e7f2f0" stroke="none"/>
<line data-segment="AbBb" x1="302.2" y1="168.04" x2="486.26" y2="168.04" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="CbAb" x1="302.2" y1="30" x2="302.2" y2="168.04" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="AAb" x1="113.74" y1="300" x2="302.2" y2="168.04" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="BbCb" x1="486.26" y1="168.04" x2="302.2" y2="30" stroke="#124e52" stroke-width="5"/>
<line data-segment="BBb" x1="297.8" y1="300" x2="486.26" y2="168.04" stroke="#124e52" stroke-width="5"/>
<line data-segment="CCb" x1="113.74" y1="161.96" x2="302.2" y2="30" stroke="#124e52" stroke-width="5"/>
<line data-segment="AB" x1="113.74" y1="300" x2="297.8" y2="300" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="297.8" y1="300" x2="113.74" y2="161.96" stroke="#124e52" stroke-width="5"/>
<line data-segment="CA" x1="113.74" y1="161.96" x2="113.74" y2="300" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M133.74 300 L133.74 280 L113.74 280" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="368" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="205.77" y="330.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">4 cm</text>
<text data-label-for="segment:CA" x="67.23" y="240.34" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">3 cm</text>
<text data-label-for="segment:BBb" x="418.11" y="280.63" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">10 cm</text>
<text data-label-for="segment:BC" x="186.1" y="174.54" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
</g>
