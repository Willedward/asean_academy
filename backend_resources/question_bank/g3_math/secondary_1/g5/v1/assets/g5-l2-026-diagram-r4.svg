<svg xmlns="http://www.w3.org/2000/svg" width="600" height="305" viewBox="0 0 600 305" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">Two rectangles joined along an edge</title><desc id="desc">A rectangle 10 cm by 6 cm joined to a smaller rectangle 4 cm by 3 cm. The whole 3 cm edge of the smaller rectangle lies along a side of the larger one, and that shared edge is dashed. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="305" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="first-rectangle" data-points="A B C D" points="98.02,213.13 386.56,213.13 386.56,40 98.02,40" fill="#e7f2f0" stroke="none"/>
<polygon data-shape="second-rectangle" data-points="B S T J" points="386.56,213.13 501.98,213.13 501.98,126.56 386.56,126.56" fill="#fdf3e6" stroke="none"/>
<line data-segment="BJ" x1="386.56" y1="213.13" x2="386.56" y2="126.56" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="AB" x1="98.02" y1="213.13" x2="386.56" y2="213.13" stroke="#124e52" stroke-width="5"/>
<line data-segment="JC" x1="386.56" y1="126.56" x2="386.56" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="386.56" y1="40" x2="98.02" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="DA" x1="98.02" y1="40" x2="98.02" y2="213.13" stroke="#124e52" stroke-width="5"/>
<line data-segment="BS" x1="386.56" y1="213.13" x2="501.98" y2="213.13" stroke="#124e52" stroke-width="5"/>
<line data-segment="ST" x1="501.98" y1="213.13" x2="501.98" y2="126.56" stroke="#124e52" stroke-width="5"/>
<line data-segment="TJ" x1="501.98" y1="126.56" x2="386.56" y2="126.56" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="285" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text x="158.29" y="282.94" font-size="22" font-weight="600" text-anchor="middle" fill="#153f42">Dashed: shared edge</text>
<text data-label-for="segment:AB" x="242.29" y="243.91" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">10 cm</text>
<text data-label-for="segment:DA" x="51.51" y="135.93" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 cm</text>
<text data-label-for="segment:BS" x="444.27" y="243.91" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">4 cm</text>
<text data-label-for="segment:ST" x="548.49" y="179.21" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">3 cm</text>
</g>
</svg>
