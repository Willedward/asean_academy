<svg xmlns="http://www.w3.org/2000/svg" width="600" height="329" viewBox="0 0 600 329" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">An L-shape with algebraic side lengths</title><desc id="desc">An L-shape. The full bottom edge is (x + 5) cm and the full left edge is (x + 3) cm. The removed top-right corner has edges 5 cm and 3 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="329" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="l-shape" data-points="A B C D E F" points="181.22,241.01 418.78,241.01 418.78,94.82 327.41,94.82 327.41,40 181.22,40" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="181.22" y1="241.01" x2="418.78" y2="241.01" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="418.78" y1="241.01" x2="418.78" y2="94.82" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="418.78" y1="94.82" x2="327.41" y2="94.82" stroke="#124e52" stroke-width="5"/>
<line data-segment="DE" x1="327.41" y1="94.82" x2="327.41" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="EF" x1="327.41" y1="40" x2="181.22" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="FA" x1="181.22" y1="40" x2="181.22" y2="241.01" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="309" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="300" y="271.79" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(x + 5) cm</text>
<text data-label-for="segment:FA" x="93.11" y="147.53" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(x + 3) cm</text>
<text data-label-for="segment:CD" x="373.1" y="125.6" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
<text data-label-for="segment:DE" x="373.92" y="76.77" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">3 cm</text>
</g>
</svg>
