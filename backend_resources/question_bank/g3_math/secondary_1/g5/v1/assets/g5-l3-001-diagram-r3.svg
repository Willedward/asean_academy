<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">A parallelogram beside a trapezium</title><desc id="desc">A parallelogram with base 12 cm and dashed perpendicular height 6 cm, beside a trapezium with parallel sides 8 cm and 14 cm and dashed perpendicular height 6 cm. A right angle is marked at the foot of each height. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="Pparallelogram" data-points="PA PB PC PD" points="35,159.39 241.78,159.39 288.3,56 81.52,56" fill="#e7f2f0" stroke="none"/>
<line data-segment="PAPB" x1="35" y1="159.39" x2="241.78" y2="159.39" stroke="#124e52" stroke-width="5"/>
<line data-segment="PBPC" x1="241.78" y1="159.39" x2="288.3" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="PCPD" x1="288.3" y1="56" x2="81.52" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="PDPA" x1="81.52" y1="56" x2="35" y2="159.39" stroke="#124e52" stroke-width="5"/>
<line data-segment="PDPF" x1="81.52" y1="56" x2="81.52" y2="159.39" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="PF" d="M99.52 159.39 L99.52 141.39 L81.52 141.39" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<polygon data-shape="Ttrapezium" data-points="TA TB TC TD" points="323.76,159.39 565,159.39 513.31,56 375.46,56" fill="#fdf3e6" stroke="none"/>
<line data-segment="TATB" x1="323.76" y1="159.39" x2="565" y2="159.39" stroke="#124e52" stroke-width="5"/>
<line data-segment="TBTC" x1="565" y1="159.39" x2="513.31" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="TCTD" x1="513.31" y1="56" x2="375.46" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="TDTA" x1="375.46" y1="56" x2="323.76" y2="159.39" stroke="#124e52" stroke-width="5"/>
<line data-segment="TDTF" x1="375.46" y1="56" x2="375.46" y2="159.39" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="TF" d="M393.46 159.39 L393.46 141.39 L375.46 141.39" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:PAPB" x="138.39" y="190.17" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">12 cm</text>
<text data-label-for="segment:PDPF" x="128.03" y="117.05" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 cm</text>
<text data-label-for="segment:TATB" x="444.38" y="190.17" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">14 cm</text>
<text data-label-for="segment:TCTD" x="444.38" y="43.94" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">8 cm</text>
<text data-label-for="segment:TDTF" x="421.97" y="117.05" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 cm</text>
</g>
</svg>
