<svg xmlns="http://www.w3.org/2000/svg" width="600" height="366" viewBox="0 0 600 366" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">A rectangular track with algebraic dimensions</title><desc id="desc">A rectangular track shown as a shaded band between two rectangles. The outside rectangle is (x + 4) m by (x + 2) m and the inside rectangle is x m by (x − 2) m. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="366" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="outer-rectangle" data-points="A B C D" points="165.36,277.6 434.64,277.6 434.64,40 165.36,40" fill="#fdf3e6" stroke="none"/>
<polygon data-shape="inner-rectangle" data-points="E F G H" points="197.04,245.92 402.96,245.92 402.96,71.68 197.04,71.68" fill="#f7faf9" stroke="none"/>
<line data-segment="AB" x1="165.36" y1="277.6" x2="434.64" y2="277.6" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="434.64" y1="277.6" x2="434.64" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="434.64" y1="40" x2="165.36" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="DA" x1="165.36" y1="40" x2="165.36" y2="277.6" stroke="#124e52" stroke-width="5"/>
<line data-segment="EF" x1="197.04" y1="245.92" x2="402.96" y2="245.92" stroke="#124e52" stroke-width="5"/>
<line data-segment="FG" x1="402.96" y1="245.92" x2="402.96" y2="71.68" stroke="#124e52" stroke-width="5"/>
<line data-segment="GH" x1="402.96" y1="71.68" x2="197.04" y2="71.68" stroke="#124e52" stroke-width="5"/>
<line data-segment="HE" x1="197.04" y1="71.68" x2="197.04" y2="245.92" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="346" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="300" y="308.38" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(x + 4) m</text>
<text data-label-for="segment:DA" x="85.18" y="165.82" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(x + 2) m</text>
<text data-label-for="segment:EF" x="300" y="233.86" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">x m</text>
<text data-label-for="segment:HE" x="277.22" y="165.82" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(x − 2) m</text>
</g>
</svg>
