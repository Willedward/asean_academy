<svg xmlns="http://www.w3.org/2000/svg" width="600" height="346" viewBox="0 0 600 346" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">An L-shape with algebraic side lengths</title><desc id="desc">An L-shape. The full bottom edge is 12 cm and the full left edge is (x + 3) cm. The removed top-right corner has edges 5 cm and 3 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="346" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="l-shape" data-points="A B C D E F" points="181.22,257.76 418.78,257.76 418.78,99.39 319.8,99.39 319.8,40 181.22,40" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="181.22" y1="257.76" x2="418.78" y2="257.76" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="418.78" y1="257.76" x2="418.78" y2="99.39" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="418.78" y1="99.39" x2="319.8" y2="99.39" stroke="#124e52" stroke-width="5"/>
<line data-segment="DE" x1="319.8" y1="99.39" x2="319.8" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="EF" x1="319.8" y1="40" x2="181.22" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="FA" x1="181.22" y1="40" x2="181.22" y2="257.76" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="326" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="300" y="288.54" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">12 cm</text>
<text data-label-for="segment:FA" x="93.11" y="155.9" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(x + 3) cm</text>
<text data-label-for="segment:CD" x="369.29" y="130.17" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
<text data-label-for="segment:DE" x="366.31" y="79.05" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">3 cm</text>
</g>
</svg>
