<svg xmlns="http://www.w3.org/2000/svg" width="600" height="387" viewBox="0 0 600 387" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">A cylinder that is open at the top</title><desc id="desc">A cylinder that is open at the top, with radius 7 cm and height 8 cm. The inside of the rim is shaded, and the far half of the base is dashed. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="387" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="curved-surface" data-points="A1 A2 C2 C1" points="150,97 450,97 450,268.43 150,268.43" fill="#e7f2f0" stroke="none"/>
<ellipse cx="300" cy="268.43" rx="150" ry="45" fill="#e7f2f0" stroke="none"/>
<path data-ellipse="base" data-half="back" d="M150 268.43 A150 45 0 0 1 450 268.43" fill="none" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<path data-ellipse="base" data-half="front" d="M150 268.43 A150 45 0 0 0 450 268.43" fill="none" stroke="#124e52" stroke-width="5"/>
<ellipse cx="300" cy="97" rx="150" ry="45" fill="#c5dcd8" stroke="none"/>
<path data-ellipse="rim" data-half="back" d="M150 97 A150 45 0 0 1 450 97" fill="none" stroke="#124e52" stroke-width="5"/>
<path data-ellipse="rim" data-half="front" d="M150 97 A150 45 0 0 0 450 97" fill="none" stroke="#124e52" stroke-width="5"/>
<line data-segment="A1C1" x1="150" y1="97" x2="150" y2="268.43" stroke="#124e52" stroke-width="5"/>
<line data-segment="A2C2" x1="450" y1="97" x2="450" y2="268.43" stroke="#124e52" stroke-width="5"/>
<line data-segment="OA2" x1="300" y1="97" x2="450" y2="97" stroke="#124e52" stroke-width="3"/>
<circle data-point="O" cx="300" cy="97" r="4" fill="#124e52"/>
<path data-leader-for="segment:OA2" d="M375 97 L375 167" fill="none" stroke="#153f42" stroke-width="2"/>
<circle data-leader-anchor="segment:OA2" cx="375" cy="97" r="3.5" fill="#153f42"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="367" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:A2C2" x="496.51" y="192.08" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">8 cm</text>
<text data-label-for="segment:OA2" x="375" y="192.28" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">7 cm</text>
<text x="300" y="38.48" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">Open top</text>
</g>
</svg>
