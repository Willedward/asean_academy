<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">Two rectangles with algebraic lengths joined along an edge</title><desc id="desc">A rectangle x cm by 8 cm joined to a rectangle (x − 2) cm by 5 cm. The whole 5 cm edge of the second rectangle lies along a side of the first, and that shared edge is dashed. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="first-rectangle" data-points="A B C D" points="98.02,174.65 316.83,174.65 316.83,40 98.02,40" fill="#e7f2f0" stroke="none"/>
<polygon data-shape="second-rectangle" data-points="B S T J" points="316.83,174.65 501.98,174.65 501.98,90.5 316.83,90.5" fill="#fdf3e6" stroke="none"/>
<line data-segment="BJ" x1="316.83" y1="174.65" x2="316.83" y2="90.5" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="AB" x1="98.02" y1="174.65" x2="316.83" y2="174.65" stroke="#124e52" stroke-width="5"/>
<line data-segment="JC" x1="316.83" y1="90.5" x2="316.83" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="316.83" y1="40" x2="98.02" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="DA" x1="98.02" y1="40" x2="98.02" y2="174.65" stroke="#124e52" stroke-width="5"/>
<line data-segment="BS" x1="316.83" y1="174.65" x2="501.98" y2="174.65" stroke="#124e52" stroke-width="5"/>
<line data-segment="ST" x1="501.98" y1="174.65" x2="501.98" y2="90.5" stroke="#124e52" stroke-width="5"/>
<line data-segment="TJ" x1="501.98" y1="90.5" x2="316.83" y2="90.5" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text x="158.29" y="277.94" font-size="22" font-weight="600" text-anchor="middle" fill="#153f42">Dashed: shared edge</text>
<text data-label-for="segment:AB" x="207.43" y="205.43" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">x cm</text>
<text data-label-for="segment:DA" x="51.51" y="116.69" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">8 cm</text>
<text data-label-for="segment:BS" x="409.4" y="205.43" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(x − 2) cm</text>
<text data-label-for="segment:ST" x="548.49" y="141.94" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
</g>
</svg>
