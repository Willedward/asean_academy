<svg xmlns="http://www.w3.org/2000/svg" width="600" height="321" viewBox="0 0 600 321" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">Two rectangles joined along an edge</title><desc id="desc">A rectangle 9 cm by 7 cm joined to a smaller rectangle 6 cm by 5 cm. The whole 5 cm edge of the smaller rectangle lies along a side of the larger one, and that shared edge is dashed. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="321" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="first-rectangle" data-points="A B C D" points="98.02,228.51 340.4,228.51 340.4,40 98.02,40" fill="#e7f2f0" stroke="none"/>
<polygon data-shape="second-rectangle" data-points="B S T J" points="340.4,228.51 501.98,228.51 501.98,93.86 340.4,93.86" fill="#fdf3e6" stroke="none"/>
<line data-segment="BJ" x1="340.4" y1="228.51" x2="340.4" y2="93.86" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="AB" x1="98.02" y1="228.51" x2="340.4" y2="228.51" stroke="#124e52" stroke-width="5"/>
<line data-segment="JC" x1="340.4" y1="93.86" x2="340.4" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="340.4" y1="40" x2="98.02" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="DA" x1="98.02" y1="40" x2="98.02" y2="228.51" stroke="#124e52" stroke-width="5"/>
<line data-segment="BS" x1="340.4" y1="228.51" x2="501.98" y2="228.51" stroke="#124e52" stroke-width="5"/>
<line data-segment="ST" x1="501.98" y1="228.51" x2="501.98" y2="93.86" stroke="#124e52" stroke-width="5"/>
<line data-segment="TJ" x1="501.98" y1="93.86" x2="340.4" y2="93.86" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="301" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text x="158.29" y="298.94" font-size="22" font-weight="600" text-anchor="middle" fill="#153f42">Dashed: shared edge</text>
<text data-label-for="segment:AB" x="219.21" y="259.29" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">9 cm</text>
<text data-label-for="segment:DA" x="51.51" y="143.62" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">7 cm</text>
<text data-label-for="segment:BS" x="421.19" y="259.29" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 cm</text>
<text data-label-for="segment:ST" x="548.49" y="170.55" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
</g>
</svg>
