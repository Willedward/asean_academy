<svg xmlns="http://www.w3.org/2000/svg" width="600" height="398" viewBox="0 0 600 398" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">An L-shape left after a corner is removed</title><desc id="desc">An L-shape. The full bottom edge is 12 cm and the full left edge is 10 cm. The removed top-right corner has edges 5 cm and 4 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="398" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="l-shape" data-points="A B C D E F" points="138,310 462,310 462,148 327,148 327,40 138,40" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="138" y1="310" x2="462" y2="310" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="462" y1="310" x2="462" y2="148" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="462" y1="148" x2="327" y2="148" stroke="#124e52" stroke-width="5"/>
<line data-segment="DE" x1="327" y1="148" x2="327" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="EF" x1="327" y1="40" x2="138" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="FA" x1="138" y1="40" x2="138" y2="310" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="378" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="300" y="340.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">12 cm</text>
<text data-label-for="segment:FA" x="82.13" y="184.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">10 cm</text>
<text data-label-for="segment:CD" x="410.7" y="135.94" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
<text data-label-for="segment:DE" x="373.51" y="103.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">4 cm</text>
</g>
</svg>
