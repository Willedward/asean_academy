<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="title desc">
<title id="title">Tiles for an L-shaped lobby</title><desc id="desc">Schematic for Tiles for an L-shaped lobby. Not drawn to scale. Stated measures include 16 m, 12 m, 6 m, 5 m, 0.5 m².</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs>
<rect width="940" height="390" rx="24" fill="#f8fafc"/><text x="36" y="38" class="heading">Tiles for an L-shaped lobby</text>
<g fill="none" stroke="#0f3d40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M130 70 H470 V170 H310 V290 H130 Z"/><path class="dash" d="M310 170 H470 V290 H310"/><text x="170" y="185">remaining region</text><text x="335" y="235">cut-out</text><path class="arrow" d="M560 180 H690"/><rect x="720" y="95" width="120" height="170"/><text x="700" y="305">decompose or subtract</text></g>
<text x="904" y="374" text-anchor="end" class="note">Use stated measurements · not drawn to scale</text>
<style>.heading{font:700 22px system-ui;fill:#0f3d40} text{font:600 17px system-ui;fill:#334155;stroke:none} .note{font:500 13px system-ui;fill:#64748b} .arc{stroke:#c87a1e} .mark{stroke:#c87a1e} .faint{stroke:#94a3b8;stroke-width:2} .dash{stroke:#c87a1e;stroke-dasharray:8 8} .arrow{stroke:#0f766e;marker-end:url(#arrow)} .grid{stroke:#dbe4e6;stroke-width:1}</style>
</svg>