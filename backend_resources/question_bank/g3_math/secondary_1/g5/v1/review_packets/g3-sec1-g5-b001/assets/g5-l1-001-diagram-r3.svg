<svg xmlns="http://www.w3.org/2000/svg" width="600" height="333" viewBox="0 0 600 333" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">Parallelogram with its perpendicular height</title><desc id="desc">A parallelogram with base 8 cm and a dashed perpendicular height of 5 cm, with a right angle marked where the height meets the base. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="333" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="parallelogram" data-points="A B C D" points="90,244.88 417.8,244.88 510,40 182.2,40" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="90" y1="244.88" x2="417.8" y2="244.88" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="417.8" y1="244.88" x2="510" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="510" y1="40" x2="182.2" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="DA" x1="182.2" y1="40" x2="90" y2="244.88" stroke="#124e52" stroke-width="5"/>
<line data-segment="DF" x1="182.2" y1="40" x2="182.2" y2="244.88" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="F" d="M200.2 244.88 L200.2 226.88 L182.2 226.88" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="313" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="253.9" y="275.66" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">8 cm</text>
<text data-label-for="segment:DF" x="228.71" y="151.8" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
</g>
</svg>
