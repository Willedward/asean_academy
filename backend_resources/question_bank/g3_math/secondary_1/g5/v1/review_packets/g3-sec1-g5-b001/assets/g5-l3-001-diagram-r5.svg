<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">A parallelogram beside a trapezium</title><desc id="desc">A parallelogram with base 12 cm and dashed perpendicular height 6 cm, beside a trapezium with parallel sides 10 cm and 12 cm and dashed perpendicular height 5 cm. A right angle is marked at the foot of each height. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="Pparallelogram" data-points="PA PB PC PD" points="35,166.58 256.16,166.58 305.92,56 84.76,56" fill="#e7f2f0" stroke="none"/>
<line data-segment="PAPB" x1="35" y1="166.58" x2="256.16" y2="166.58" stroke="#124e52" stroke-width="5"/>
<line data-segment="PBPC" x1="256.16" y1="166.58" x2="305.92" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="PCPD" x1="305.92" y1="56" x2="84.76" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="PDPA" x1="84.76" y1="56" x2="35" y2="166.58" stroke="#124e52" stroke-width="5"/>
<line data-segment="PDPF" x1="84.76" y1="56" x2="84.76" y2="166.58" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="PF" d="M102.76 166.58 L102.76 148.58 L84.76 148.58" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<polygon data-shape="Ttrapezium" data-points="TA TB TC TD" points="343.84,166.58 565,166.58 546.57,74.43 362.27,74.43" fill="#fdf3e6" stroke="none"/>
<line data-segment="TATB" x1="343.84" y1="166.58" x2="565" y2="166.58" stroke="#124e52" stroke-width="5"/>
<line data-segment="TBTC" x1="565" y1="166.58" x2="546.57" y2="74.43" stroke="#124e52" stroke-width="5"/>
<line data-segment="TCTD" x1="546.57" y1="74.43" x2="362.27" y2="74.43" stroke="#124e52" stroke-width="5"/>
<line data-segment="TDTA" x1="362.27" y1="74.43" x2="343.84" y2="166.58" stroke="#124e52" stroke-width="5"/>
<line data-segment="TDTF" x1="362.27" y1="74.43" x2="362.27" y2="166.58" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="TF" d="M380.27 166.58 L380.27 148.58 L362.27 148.58" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:PAPB" x="145.58" y="197.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">12 cm</text>
<text data-label-for="segment:PDPF" x="131.27" y="120.65" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 cm</text>
<text data-label-for="segment:TATB" x="454.42" y="197.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">12 cm</text>
<text data-label-for="segment:TCTD" x="454.42" y="62.37" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">10 cm</text>
<text data-label-for="segment:TDTF" x="408.78" y="129.87" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
</g>
</svg>
