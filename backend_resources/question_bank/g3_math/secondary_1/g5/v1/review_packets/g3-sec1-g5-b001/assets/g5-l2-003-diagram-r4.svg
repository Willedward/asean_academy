<svg xmlns="http://www.w3.org/2000/svg" width="600" height="388" viewBox="0 0 600 388" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">A triangular prism with a right-triangle cross-section</title><desc id="desc">A triangular prism. Its front face is a right triangle with perpendicular sides 6 cm and 4 cm, and the right angle is marked. The prism is 10 cm long, and hidden edges are dashed. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="388" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="rear-face" data-points="Ab Bb Cb" points="262.57,187.25 498.45,187.25 262.57,30" fill="#d5e8e4" stroke="none"/>
<polygon data-shape="side-BC" data-points="B C Cb Bb" points="337.43,300 101.55,142.75 262.57,30 498.45,187.25" fill="#f1f8f6" stroke="none"/>
<polygon data-shape="cross-section" data-points="A B C" points="101.55,300 337.43,300 101.55,142.75" fill="#e7f2f0" stroke="none"/>
<line data-segment="AbBb" x1="262.57" y1="187.25" x2="498.45" y2="187.25" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="CbAb" x1="262.57" y1="30" x2="262.57" y2="187.25" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="AAb" x1="101.55" y1="300" x2="262.57" y2="187.25" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="BbCb" x1="498.45" y1="187.25" x2="262.57" y2="30" stroke="#124e52" stroke-width="5"/>
<line data-segment="BBb" x1="337.43" y1="300" x2="498.45" y2="187.25" stroke="#124e52" stroke-width="5"/>
<line data-segment="CCb" x1="101.55" y1="142.75" x2="262.57" y2="30" stroke="#124e52" stroke-width="5"/>
<line data-segment="AB" x1="101.55" y1="300" x2="337.43" y2="300" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="337.43" y1="300" x2="101.55" y2="142.75" stroke="#124e52" stroke-width="5"/>
<line data-segment="CA" x1="101.55" y1="142.75" x2="101.55" y2="300" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M121.55 300 L121.55 280 L101.55 280" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="368" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="219.49" y="330.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 cm</text>
<text data-label-for="segment:CA" x="55.04" y="230.74" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">4 cm</text>
<text data-label-for="segment:BBb" x="444.02" y="290.23" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">10 cm</text>
</g>
