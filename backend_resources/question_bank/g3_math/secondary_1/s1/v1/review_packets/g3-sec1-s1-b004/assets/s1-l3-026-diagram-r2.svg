<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Pie chart</title><desc id="desc">Pie chart with sector P of 120 degrees, sector Q of 72 degrees and a remaining sector labelled Other.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<path data-chart-mark="sector-0" data-chart-kind="pie-sector" data-value="120" d="M360 250 L360 90 A160 160 0 0 1 498.564065 330 Z" fill="#dcecf6" stroke="#17324d" stroke-width="2"/>
<path data-chart-mark="sector-1" data-chart-kind="pie-sector" data-value="72" d="M360 250 L498.564065 330 A160 160 0 0 1 326.734129 406.503616 Z" fill="#f7d9c9" stroke="#17324d" stroke-width="2"/>
<path data-chart-mark="sector-2" data-chart-kind="pie-sector" data-value="168" d="M360 250 L326.734129 406.503616 A160 160 0 0 1 360 90 Z" fill="#e4ead7" stroke="#17324d" stroke-width="2"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Pie chart</text>
<text x="450.066642" y="206" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">P 120°</text>
<text x="402.300611" y="353.008728" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Q 72°</text>
<text x="256.569723" y="247.12904" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Other</text>
</g>
</svg>
