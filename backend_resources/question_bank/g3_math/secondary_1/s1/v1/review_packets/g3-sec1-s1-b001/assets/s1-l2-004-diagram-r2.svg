<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Students in one category</title><desc id="desc">Pictogram where each ● represents 6; Category has 4.5 symbols.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">

</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="700" text-anchor="middle" fill="#17324d">Students in one category</text>
<text x="150" y="123" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">Category</text>
<text x="200" y="124" font-size="32" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="icon-0-0" data-chart-kind="icon" data-value="6">●</text>
<text x="258" y="124" font-size="32" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="icon-0-1" data-chart-kind="icon" data-value="6">●</text>
<text x="316" y="124" font-size="32" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="icon-0-2" data-chart-kind="icon" data-value="6">●</text>
<text x="374" y="124" font-size="32" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="icon-0-3" data-chart-kind="icon" data-value="6">●</text>
<text x="432" y="124" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="icon-0-partial" data-chart-kind="partial-icon" data-value="3">½●</text>
<text x="360" y="435" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Key: ● represents 6</text>
</g>
</svg>
