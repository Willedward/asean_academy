<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Books each day</title><desc id="desc">Bar chart of the number of books on Monday, Tuesday and Wednesday, with a vertical axis from 0 to 10 marked in steps of 2. Monday: 6, Tuesday: 9, Wednesday: 7.</desc>
