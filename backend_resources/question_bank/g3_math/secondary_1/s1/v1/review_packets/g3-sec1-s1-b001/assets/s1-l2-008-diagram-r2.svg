<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Two square icons</title><desc id="desc">Two square icons: one for 20 items with side 2 cm and one for 40 items with side 4 cm.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<rect data-chart-mark="icon-0" data-chart-kind="square-icon" data-value="2x2" x="120" y="220" width="120" height="120" fill="#dcecf6" stroke="#17324d" stroke-width="3"/>
<rect data-chart-mark="icon-1" data-chart-kind="square-icon" data-value="4x4" x="420" y="100" width="240" height="240" fill="#dcecf6" stroke="#17324d" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Two square icons</text>
<text x="180" y="385" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">20 items</text>
<text x="180" y="425" font-size="25" font-weight="500" text-anchor="middle" fill="#17324d">side 2 cm</text>
<text x="540" y="385" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">40 items</text>
<text x="540" y="425" font-size="25" font-weight="500" text-anchor="middle" fill="#17324d">side 4 cm</text>
</g>
</svg>
