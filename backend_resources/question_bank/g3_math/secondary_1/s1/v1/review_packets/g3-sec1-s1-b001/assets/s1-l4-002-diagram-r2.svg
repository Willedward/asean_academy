<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Pie chart</title><desc id="desc">Pie chart with two sectors, marked 135 degrees and 225 degrees.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<path data-chart-mark="sector-0" data-chart-kind="pie-sector" data-value="135" d="M360 250 L360 90 A160 160 0 0 1 473.137085 363.137085 Z" fill="#dcecf6" stroke="#17324d" stroke-width="2"/>
<path data-chart-mark="sector-1" data-chart-kind="pie-sector" data-value="225" d="M360 250 L473.137085 363.137085 A160 160 0 1 1 360 90 Z" fill="#f7d9c9" stroke="#17324d" stroke-width="2"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Pie chart</text>
