<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<path data-chart-mark="sector-0" data-chart-kind="pie-sector" data-value="72" d="M360 250 L360 90 A160 160 0 0 1 512.169043 200.557281 Z" fill="#dcecf6" stroke="#17324d" stroke-width="2"/>
<path data-chart-mark="sector-1" data-chart-kind="pie-sector" data-value="288" d="M360 250 L512.169043 200.557281 A160 160 0 1 1 360 90 Z" fill="#f7d9c9" stroke="#17324d" stroke-width="2"/>
</g>
