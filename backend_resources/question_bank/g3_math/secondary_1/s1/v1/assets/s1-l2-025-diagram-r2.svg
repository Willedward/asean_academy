<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="85" y1="95" x2="85" y2="299" stroke="#17324d" stroke-width="2"/>
<line x1="268.333333" y1="95" x2="268.333333" y2="299" stroke="#17324d" stroke-width="2"/>
<line x1="451.666667" y1="95" x2="451.666667" y2="299" stroke="#17324d" stroke-width="2"/>
