<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Time axis of a line graph</title><desc id="desc">Horizontal time axis of a line graph with the years 2019, 2020, 2023 and 2024 at equal distances.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="60" y1="250" x2="660" y2="250" stroke="#17324d" stroke-width="4"/>
<line x1="90" y1="234" x2="90" y2="266" stroke="#17324d" stroke-width="3"/>
<g data-axis-tick="x:2019" data-axis="x" data-value="2019" data-position="90" data-label="2019"/>
<line x1="270" y1="234" x2="270" y2="266" stroke="#17324d" stroke-width="3"/>
<g data-axis-tick="x:2020" data-axis="x" data-value="2020" data-position="270" data-label="2020"/>
<line x1="450" y1="234" x2="450" y2="266" stroke="#17324d" stroke-width="3"/>
<g data-axis-tick="x:2023" data-axis="x" data-value="2023" data-position="450" data-label="2023"/>
<line x1="630" y1="234" x2="630" y2="266" stroke="#17324d" stroke-width="3"/>
<g data-axis-tick="x:2024" data-axis="x" data-value="2024" data-position="630" data-label="2024"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="75" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Time axis of a line graph</text>
<text x="90" y="300" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">2019</text>
<text x="270" y="300" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">2020</text>
<text x="450" y="300" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">2023</text>
<text x="630" y="300" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">2024</text>
</g>
</svg>
