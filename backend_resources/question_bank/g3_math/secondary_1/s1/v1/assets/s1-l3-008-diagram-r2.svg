<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Two circular symbols</title><desc id="desc">Two circles: Value 25 with diameter 1 unit and Value 100 with diameter 4 units.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<circle data-chart-mark="icon-0" data-chart-kind="circle-icon" data-value="1x1" cx="180" cy="310" r="30" fill="#dcecf6" stroke="#17324d" stroke-width="3"/>
<circle data-chart-mark="icon-1" data-chart-kind="circle-icon" data-value="4x4" cx="540" cy="220" r="120" fill="#dcecf6" stroke="#17324d" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Two circular symbols</text>
<text x="180" y="385" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Value 25</text>
<text x="180" y="425" font-size="25" font-weight="500" text-anchor="middle" fill="#17324d">diameter 1 unit</text>
<text x="540" y="385" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Value 100</text>
<text x="540" y="425" font-size="25" font-weight="500" text-anchor="middle" fill="#17324d">diameter 4 units</text>
</g>
</svg>
