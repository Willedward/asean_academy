<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Two bars</title><desc id="desc">Two bars of equal height 8 units, with widths 2 cm and 5 cm.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<rect data-chart-mark="icon-0" data-chart-kind="rect-icon" data-value="2x8" x="150" y="100" width="60" height="240" fill="#dcecf6" stroke="#17324d" stroke-width="3"/>
<rect data-chart-mark="icon-1" data-chart-kind="rect-icon" data-value="5x8" x="465" y="100" width="150" height="240" fill="#dcecf6" stroke="#17324d" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Two bars</text>
<text x="180" y="385" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Narrow bar</text>
<text x="180" y="425" font-size="25" font-weight="500" text-anchor="middle" fill="#17324d">2 cm by 8 units</text>
<text x="540" y="385" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Wide bar</text>
<text x="540" y="425" font-size="25" font-weight="500" text-anchor="middle" fill="#17324d">5 cm by 8 units</text>
</g>
</svg>
