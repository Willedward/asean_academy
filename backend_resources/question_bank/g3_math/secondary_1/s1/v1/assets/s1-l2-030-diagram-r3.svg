<g data-axis-tick="y:60" data-axis="y" data-value="60" data-position="75" data-label="60"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Vertical scale</text>
<text x="302" y="413" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">0</text>
<text x="302" y="330.5" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">10</text>
<text x="302" y="248" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">20</text>
<text x="302" y="165.5" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">50</text>
<text x="302" y="83" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">60</text>
