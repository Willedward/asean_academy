<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Vertical scale</title><desc id="desc">Vertical scale marked 0, 10, 20, 50, 60.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="330" y1="75" x2="330" y2="405" stroke="#17324d" stroke-width="4"/>
<line x1="314" y1="405" x2="346" y2="405" stroke="#17324d" stroke-width="3"/>
<g data-axis-tick="y:0" data-axis="y" data-value="0" data-position="405" data-label="0"/>
<line x1="314" y1="322.5" x2="346" y2="322.5" stroke="#17324d" stroke-width="3"/>
<g data-axis-tick="y:10" data-axis="y" data-value="10" data-position="322.5" data-label="10"/>
<line x1="314" y1="240" x2="346" y2="240" stroke="#17324d" stroke-width="3"/>
<g data-axis-tick="y:20" data-axis="y" data-value="20" data-position="240" data-label="20"/>
<line x1="314" y1="157.5" x2="346" y2="157.5" stroke="#17324d" stroke-width="3"/>
<g data-axis-tick="y:50" data-axis="y" data-value="50" data-position="157.5" data-label="50"/>
