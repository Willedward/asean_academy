<path d="M680 250 l-18 -10 M680 250 l-18 10" fill="none" stroke="#17324d" stroke-width="3"/>
<line x1="80" y1="240" x2="80" y2="260" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="x:-5" data-axis="x" data-value="-5" data-position="80" data-label="-5"/>
