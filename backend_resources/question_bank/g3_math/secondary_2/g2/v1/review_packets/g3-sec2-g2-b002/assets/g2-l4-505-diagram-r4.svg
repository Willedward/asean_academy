<svg xmlns="http://www.w3.org/2000/svg" width="600" height="474" viewBox="0 0 600 474" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Congruent triangles ABC and ADC sharing side AC</title><desc id="desc">Two triangles ABC and ADC, on either side of their shared side AC. AB is marked (3x − 2) cm, AD is marked (x + 8) cm and DC is marked (2x − 1) cm. AB and AD have one tick, and BC and DC have two ticks. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="474" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="A B C D" points="300,44 162.33,177.95 300,364 437.67,177.95" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="300" y1="44" x2="162.33" y2="177.95" stroke="#124e52" stroke-width="5"/>
<line data-segment="AD" x1="300" y1="44" x2="437.67" y2="177.95" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="162.33" y1="177.95" x2="300" y2="364" stroke="#124e52" stroke-width="5"/>
<line data-segment="DC" x1="437.67" y1="177.95" x2="300" y2="364" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="300" y1="44" x2="300" y2="364" stroke="#124e52" stroke-width="5"/>
<path data-tick-mark="AB" data-ticks="1" d="M224.19 103.81 L238.14 118.14" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="AD" data-ticks="1" d="M361.86 118.14 L375.81 103.81" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="BC" data-ticks="2" d="M220.75 273.71 L236.82 261.81 M225.51 280.14 L241.58 268.24" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="DC" data-ticks="2" d="M363.18 261.81 L379.25 273.71 M358.42 268.24 L374.49 280.14" fill="none" stroke="#124e52" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="454" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="point:A" x="300" y="32.44" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">A</text>
<text data-label-for="point:B" x="141.17" y="185.31" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">B</text>
<text data-label-for="point:C" x="300" y="394.28" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">C</text>
<text data-label-for="point:D" x="459.73" y="185.22" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">D</text>
<text data-label-for="segment:AB" x="174.92" y="60.19" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(3x − 2) cm</text>
<text data-label-for="segment:AD" x="420.53" y="64.87" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(x + 8) cm</text>
<text data-label-for="segment:DC" x="439.81" y="330.52" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">(2x − 1) cm</text>
</g>
