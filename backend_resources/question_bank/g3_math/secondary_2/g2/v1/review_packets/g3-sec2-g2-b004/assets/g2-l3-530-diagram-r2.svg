<svg xmlns="http://www.w3.org/2000/svg" width="600" height="423" viewBox="0 0 600 423" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Mirror on level ground between a student and a flagpole</title><desc id="desc">A mirror on level ground between a student and a flagpole, with a right angle shown by a corner mark at the student&#x27;s feet and at the foot of the flagpole. The student&#x27;s eye is marked 1.6 m above the ground. Along the ground, the distance from the student to the mirror is marked 2 m and the distance from the mirror to the flagpole is marked 10 m. The flagpole height is marked h. Dashed lines join the eye to the mirror and the mirror to the top of the flagpole, and one arc on each side of the mirror marks equal angles. Not drawn to scale.</desc>
