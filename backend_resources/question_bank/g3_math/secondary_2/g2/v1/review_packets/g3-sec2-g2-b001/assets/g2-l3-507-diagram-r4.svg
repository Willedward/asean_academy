<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">A point and its image on a line from O</title><desc id="desc">A straight line from the centre O through A to its image A′. OA is marked 5 cm and the whole distance OA′ is marked d. A caption reads scale factor 3. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="OA" x1="65" y1="120" x2="221.67" y2="120" stroke="#124e52" stroke-width="5"/>
<line data-segment="AA′" x1="221.67" y1="120" x2="535" y2="120" stroke="#124e52" stroke-width="5"/>
<circle data-point="O" cx="65" cy="120" r="5" fill="#124e52"/>
<circle data-point="A" cx="221.67" cy="120" r="5" fill="#124e52"/>
<circle data-point="A′" cx="535" cy="120" r="5" fill="#124e52"/>
<path data-role="extension" d="M65 126 L65 167" fill="none" stroke="#7d9799" stroke-width="2"/>
<path data-role="extension" d="M535 126 L535 167" fill="none" stroke="#7d9799" stroke-width="2"/>
<line data-segment="dim-OA′" x1="65" y1="160" x2="535" y2="160" stroke="#153f42" stroke-width="3"/>
<path data-role="dimension-tick" d="M65 152 L65 168" fill="none" stroke="#153f42" stroke-width="3"/>
<path data-role="dimension-tick" d="M535 152 L535 168" fill="none" stroke="#153f42" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="point:O" x="65" y="99.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">O</text>
<text data-label-for="point:A" x="221.67" y="99.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">A</text>
<text data-label-for="point:A′" x="535" y="99.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">A′</text>
<text data-label-for="segment:OA" x="143.33" y="107.94" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
<text data-label-for="segment:OA′" x="300" y="188.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">d</text>
<text data-label-for="caption:factor" x="300" y="42.64" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">scale factor 3</text>
</g>
</svg>
