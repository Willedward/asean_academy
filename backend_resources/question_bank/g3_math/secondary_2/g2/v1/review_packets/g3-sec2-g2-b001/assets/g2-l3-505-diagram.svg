<g fill="none" stroke="#0f3d40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M90 275 L210 70 L360 275 Z M540 275 L670 70 L850 275 Z"/><text x="200" y="55">A</text><text x="70" y="300">B</text><text x="360" y="300">C</text><text x="660" y="55">P</text><text x="520" y="300">Q</text><text x="850" y="300">R</text><text x="380" y="145">A ↔ P</text><text x="380" y="190">B ↔ Q</text><text x="380" y="235">C ↔ R</text></g>
