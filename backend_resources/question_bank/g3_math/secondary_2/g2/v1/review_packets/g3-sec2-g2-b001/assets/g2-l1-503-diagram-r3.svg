<svg xmlns="http://www.w3.org/2000/svg" width="600" height="332" viewBox="0 0 600 332" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">A triangle and its similar enlargement</title><desc id="desc">Two similar triangles, with an arrow marked × k from the smaller to the larger. The corresponding base edges are marked 3 cm and 6 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="332" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="S1 S2 S3" points="45,221.85 175.77,221.85 89.46,132.92" fill="#e7f2f0" stroke="none"/>
<line data-segment="S1S2" x1="45" y1="221.85" x2="175.77" y2="221.85" stroke="#124e52" stroke-width="5"/>
<line data-segment="S2S3" x1="175.77" y1="221.85" x2="89.46" y2="132.92" stroke="#124e52" stroke-width="5"/>
<line data-segment="S3S1" x1="89.46" y1="132.92" x2="45" y2="221.85" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="T1 T2 T3" points="293.46,221.85 555,221.85 382.38,44" fill="#fdf3e6" stroke="none"/>
<line data-segment="T1T2" x1="293.46" y1="221.85" x2="555" y2="221.85" stroke="#124e52" stroke-width="5"/>
<line data-segment="T2T3" x1="555" y1="221.85" x2="382.38" y2="44" stroke="#124e52" stroke-width="5"/>
<line data-segment="T3T1" x1="382.38" y1="44" x2="293.46" y2="221.85" stroke="#124e52" stroke-width="5"/>
<path data-arrow="scale" d="M194.6 177.38 L274.63 177.38 M260.63 186.38 L274.63 177.38 L260.63 168.38" fill="none" stroke="#124e52" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="312" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="caption:arrow-scale" x="224.62" y="163.94" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">× k</text>
