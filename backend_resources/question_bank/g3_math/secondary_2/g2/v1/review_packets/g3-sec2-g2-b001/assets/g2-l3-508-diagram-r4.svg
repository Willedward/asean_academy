<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">A rectangular garden and its model</title><desc id="desc">A rectangle labelled garden, marked 24 m and 15 m. An arrow marked 1 : 300 points down to a smaller similar rectangle labelled model. The sides of the model are not marked, and it is marked perimeter p. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="500" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="G1 G2 G3 G4" points="149.29,244.39 450.71,244.39 450.71,56 149.29,56" fill="#e7f2f0" stroke="none"/>
<line data-segment="G1G2" x1="149.29" y1="244.39" x2="450.71" y2="244.39" stroke="#124e52" stroke-width="5"/>
<line data-segment="G2G3" x1="450.71" y1="244.39" x2="450.71" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="G3G4" x1="450.71" y1="56" x2="149.29" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="G4G1" x1="149.29" y1="56" x2="149.29" y2="244.39" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="M1 M2 M3 M4" points="236.7,426 363.3,426 363.3,346.88 236.7,346.88" fill="#fdf3e6" stroke="none"/>
<line data-segment="M1M2" x1="236.7" y1="426" x2="363.3" y2="426" stroke="#124e52" stroke-width="5"/>
<line data-segment="M2M3" x1="363.3" y1="426" x2="363.3" y2="346.88" stroke="#124e52" stroke-width="5"/>
<line data-segment="M3M4" x1="363.3" y1="346.88" x2="236.7" y2="346.88" stroke="#124e52" stroke-width="5"/>
<line data-segment="M4M1" x1="236.7" y1="346.88" x2="236.7" y2="426" stroke="#124e52" stroke-width="5"/>
<path data-arrow="scale" d="M300 254.64 L300 336.63 M291 322.63 L300 336.63 L309 322.63" fill="none" stroke="#124e52" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="480" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="caption:arrow-scale" x="362.24" y="304.27" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">1 : 300</text>
<text data-label-for="segment:G3G4" x="300" y="43.94" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">24 m</text>
<text data-label-for="segment:G4G1" x="101.35" y="159.56" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">15 m</text>
<text data-label-for="caption:garden" x="300" y="156.67" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">garden</text>
<text data-label-for="caption:model" x="300" y="395.08" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">model</text>
<text data-label-for="caption:unknown" x="240" y="454.48" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">perimeter p</text>
</g>
