<svg xmlns="http://www.w3.org/2000/svg" width="600" height="302" viewBox="0 0 600 302" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Congruent triangles ABC and PQR</title><desc id="desc">Two triangles ABC and PQR, with PQR turned upside down. Angles A and P each have one arc, and angles B and Q each have two arcs. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="302" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="A B C" points="50,192.08 254.08,192.08 133.18,48" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="50" y1="192.08" x2="254.08" y2="192.08" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="254.08" y1="192.08" x2="133.18" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="CA" x1="133.18" y1="48" x2="50" y2="192.08" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="P Q R" points="550,48 345.92,48 466.82,192.08" fill="#fdf3e6" stroke="none"/>
<line data-segment="PQ" x1="550" y1="48" x2="345.92" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="QR" x1="345.92" y1="48" x2="466.82" y2="192.08" stroke="#124e52" stroke-width="5"/>
<line data-segment="RP" x1="466.82" y1="192.08" x2="550" y2="48" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-A" d="M84 192.08 A34 34 0 0 0 67 162.63" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-P" d="M516 48 A34 34 0 0 0 533 77.45" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-B" d="M234.8 169.1 A30 30 0 0 0 224.08 192.08" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-B2" d="M229.65 162.97 A38 38 0 0 0 216.08 192.08" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-Q" d="M365.2 70.98 A30 30 0 0 0 375.92 48" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-Q2" d="M370.35 77.11 A38 38 0 0 0 383.92 48" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
