<title id="title">Shadows of a pole and a taller pole</title><desc id="desc">Two triangles, each with an upright, its shadow along level ground and a dashed sun ray. The pole is marked 1.8 m and its shadow 2.4 m. The taller pole is marked h. The second shadow is shown in two parts, marked 9.6 m and 2.4 m. A right angle is shown with a corner mark at each foot. One arc in each triangle marks the equal angle of the sun ray with the ground. Not drawn to scale.</desc>
