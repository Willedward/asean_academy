<svg xmlns="http://www.w3.org/2000/svg" width="600" height="352" viewBox="0 0 600 352" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Similar survey triangles across a river</title><desc id="desc">Two similar triangles with their bases level. The smaller has a baseline marked 6 m and an offset marked 4 m. The larger lies across a shaded river, with a baseline marked 15 m along one bank, and its corresponding side across the river is marked w. One arc in each triangle marks the equal angles at the left end of the baselines. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="352" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon points="223.53,252.09 570,252.09 570,44 223.53,44" fill="#cfe3f6" stroke="none"/>
<polygon data-shape="figure" data-points="S1 S2 S3" points="30,252.09 154.86,252.09 154.86,168.86" fill="#e7f2f0" stroke="none"/>
<line data-segment="S1S2" x1="30" y1="252.09" x2="154.86" y2="252.09" stroke="#124e52" stroke-width="5"/>
<line data-segment="S2S3" x1="154.86" y1="252.09" x2="154.86" y2="168.86" stroke="#124e52" stroke-width="5"/>
<line data-segment="S3S1" x1="154.86" y1="168.86" x2="30" y2="252.09" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="T1 T2 T3" points="232.89,252.09 545.03,252.09 545.03,44" fill="#fdf3e6" stroke="none"/>
<line data-segment="T1T2" x1="232.89" y1="252.09" x2="545.03" y2="252.09" stroke="#124e52" stroke-width="5"/>
<line data-segment="T2T3" x1="545.03" y1="252.09" x2="545.03" y2="44" stroke="#124e52" stroke-width="5"/>
<line data-segment="T3T1" x1="545.03" y1="44" x2="232.89" y2="252.09" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="base-first" d="M60 252.09 A30 30 0 0 0 54.96 235.45" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="base-second" d="M262.89 252.09 A30 30 0 0 0 257.85 235.45" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="332" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:S1S2" x="92.43" y="282.87" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 m</text>
<text data-label-for="segment:S2S3" x="193.44" y="219.84" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">4 m</text>
<text data-label-for="segment:T1T2" x="388.96" y="282.87" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">15 m</text>
<text data-label-for="segment:T2T3" x="568.01" y="157.41" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">w</text>
<text data-label-for="caption:river" x="281.53" y="80.64" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">river</text>
</g>
</svg>
