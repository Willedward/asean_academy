<svg xmlns="http://www.w3.org/2000/svg" width="600" height="444" viewBox="0 0 600 444" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Corresponding angles of two similar triangles</title><desc id="desc">Two similar triangles in the same position, the second larger. The top angle of the first is marked 48° and the top angle of the second is marked x°, each with one arc. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="444" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="S1 S2 S3" points="138.6,102 35.31,334 236.73,322.4" fill="#e7f2f0" stroke="none"/>
<line data-segment="S1S2" x1="138.6" y1="102" x2="35.31" y2="334" stroke="#124e52" stroke-width="5"/>
<line data-segment="S2S3" x1="35.31" y1="334" x2="236.73" y2="322.4" stroke="#124e52" stroke-width="5"/>
<line data-segment="S3S1" x1="236.73" y1="322.4" x2="138.6" y2="102" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="T1 T2 T3" points="442.03,44 312.92,334 564.69,319.5" fill="#fdf3e6" stroke="none"/>
<line data-segment="T1T2" x1="442.03" y1="44" x2="312.92" y2="334" stroke="#124e52" stroke-width="5"/>
<line data-segment="T2T3" x1="312.92" y1="334" x2="564.69" y2="319.5" stroke="#124e52" stroke-width="5"/>
<line data-segment="T3T1" x1="564.69" y1="319.5" x2="442.03" y2="44" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-given" d="M110.13 165.95 A70 70 0 0 0 167.07 165.95" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-x" d="M406.44 123.94 A87.5 87.5 0 0 0 477.62 123.94" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="424" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-given" x="138.6" y="212.28" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">48°</text>
<text data-label-for="angle:angle-x" x="442.03" y="157.78" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">x°</text>
</g>
</svg>
