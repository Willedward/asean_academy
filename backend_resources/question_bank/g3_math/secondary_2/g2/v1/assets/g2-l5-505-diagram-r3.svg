<title id="title">A plan, a courtyard and a stage</title><desc id="desc">Three similar rectangles, one above another. The rectangle labelled plan is marked 7.5 cm and 4.8 cm. An arrow marked 1 : 400 points down to a rectangle labelled courtyard, whose sides are not marked. An arrow marked × 3/5 points down to a smaller rectangle labelled stage, marked area s. Not drawn to scale.</desc>
