<svg xmlns="http://www.w3.org/2000/svg" width="600" height="364" viewBox="0 0 600 364" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Corresponding angles written in x</title><desc id="desc">Two similar triangles in the same position, the second larger. The top angle of the first is marked (3x + 5)° and the top angle of the second is marked (5x − 35)°, each with one arc. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="364" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="S1 S2 S3" points="142.16,86.05 35,254.26 243.96,245.85" fill="#e7f2f0" stroke="none"/>
<line data-segment="S1S2" x1="142.16" y1="86.05" x2="35" y2="254.26" stroke="#124e52" stroke-width="5"/>
<line data-segment="S2S3" x1="35" y1="254.26" x2="243.96" y2="245.85" stroke="#124e52" stroke-width="5"/>
<line data-segment="S3S1" x1="243.96" y1="245.85" x2="142.16" y2="86.05" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="T1 T2 T3" points="437.75,44 303.8,254.26 565,243.75" fill="#fdf3e6" stroke="none"/>
<line data-segment="T1T2" x1="437.75" y1="44" x2="303.8" y2="254.26" stroke="#124e52" stroke-width="5"/>
<line data-segment="T2T3" x1="303.8" y1="254.26" x2="565" y2="243.75" stroke="#124e52" stroke-width="5"/>
<line data-segment="T3T1" x1="565" y1="243.75" x2="437.75" y2="44" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-first" d="M90.58 167.02 A96 96 0 0 0 193.74 167.02" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-second" d="M373.27 145.21 A120 120 0 0 0 502.22 145.21" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="344" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-first" x="142.16" y="232.33" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">(3x + 5)°</text>
<text data-label-for="angle:angle-second" x="437.75" y="204.28" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">(5x − 35)°</text>
</g>
</svg>
