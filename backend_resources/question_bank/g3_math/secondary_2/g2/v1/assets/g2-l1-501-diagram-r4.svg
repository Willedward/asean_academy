<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Two triangular tiles with labelled sides</title><desc id="desc">Two triangles. The sides of the first are marked 4 cm, 6 cm and 7 cm. The second triangle is turned, and its sides are marked 7 cm, 4 cm and 6 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="S1 S2 S3" points="100,155.91 263.96,155.91 148.52,75.76" fill="#e7f2f0" stroke="none"/>
<line data-segment="S1S2" x1="100" y1="155.91" x2="263.96" y2="155.91" stroke="#124e52" stroke-width="5"/>
<line data-segment="S2S3" x1="263.96" y1="155.91" x2="148.52" y2="75.76" stroke="#124e52" stroke-width="5"/>
<line data-segment="S3S1" x1="148.52" y1="75.76" x2="100" y2="155.91" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="T1 T2 T3" points="500,64 345.93,120.08 481.82,155.91" fill="#fdf3e6" stroke="none"/>
<line data-segment="T1T2" x1="500" y1="64" x2="345.93" y2="120.08" stroke="#124e52" stroke-width="5"/>
<line data-segment="T2T3" x1="345.93" y1="120.08" x2="481.82" y2="155.91" stroke="#124e52" stroke-width="5"/>
<line data-segment="T3T1" x1="481.82" y1="155.91" x2="500" y2="64" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:S3S1" x="84.09" y="100.88" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">4 cm</text>
<text data-label-for="segment:S2S3" x="229.06" y="92.33" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 cm</text>
<text data-label-for="segment:S1S2" x="181.98" y="186.69" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">7 cm</text>
<text data-label-for="segment:T1T2" x="411.65" y="70.32" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">7 cm</text>
<text data-label-for="segment:T3T1" x="537.94" y="128.62" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">4 cm</text>
<text data-label-for="segment:T2T3" x="406.17" y="176.6" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 cm</text>
</g>
</svg>
