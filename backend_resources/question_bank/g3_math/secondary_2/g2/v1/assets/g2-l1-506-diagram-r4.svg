<svg xmlns="http://www.w3.org/2000/svg" width="600" height="367" viewBox="0 0 600 367" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">A length and its enlargement</title><desc id="desc">Two straight segments, one above the other. The upper, labelled design, is marked 2 cm. An arrow marked × 5 points down to the lower, longer segment, labelled toy, which is marked y. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="367" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="D1D2" x1="65" y1="70" x2="159" y2="70" stroke="#124e52" stroke-width="5"/>
<line data-segment="T1T2" x1="65" y1="267.4" x2="535" y2="267.4" stroke="#124e52" stroke-width="5"/>
<path data-role="scale-arrow" d="M112 125.27 L112 227.92 M103 213.92 L112 227.92 L121 213.92" fill="none" stroke="#124e52" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="347" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="caption:factor" x="149.4" y="185.23" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">× 5</text>
<text data-label-for="segment:D1D2" x="112" y="57.94" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">2 cm</text>
<text data-label-for="segment:T1T2" x="300" y="298.18" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">y</text>
<text data-label-for="caption:first" x="225.8" y="76.48" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">design</text>
<text data-label-for="caption:second" x="415" y="247.88" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">toy</text>
</g>
</svg>
