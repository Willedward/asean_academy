<line data-segment="C4C1" x1="462.2" y1="70" x2="415.04" y2="184.54" stroke="#124e52" stroke-width="5"/>
<path data-arrow="a-b" d="M120.87 165.67 L189.76 165.67 M175.76 174.67 L189.76 165.67 L175.76 156.67" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-arrow="b-c" d="M332.76 165.67 L401.65 165.67 M387.65 174.67 L401.65 165.67 L387.65 156.67" fill="none" stroke="#124e52" stroke-width="3"/>
</g>
