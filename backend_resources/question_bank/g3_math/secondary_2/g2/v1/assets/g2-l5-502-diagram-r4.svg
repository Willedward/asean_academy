<line data-segment="A1A2" x1="30" y1="184.54" x2="97.37" y2="184.54" stroke="#124e52" stroke-width="5"/>
<line data-segment="A2A3" x1="97.37" y1="184.54" x2="107.48" y2="142.76" stroke="#124e52" stroke-width="5"/>
