<line data-segment="A4A1" x1="53.58" y1="127.27" x2="30" y2="184.54" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="B1 B2 B3 B4" points="203.15,184.54 304.21,184.54 319.37,121.88 238.52,98.63" fill="#fdf3e6" stroke="none"/>
<line data-segment="B1B2" x1="203.15" y1="184.54" x2="304.21" y2="184.54" stroke="#124e52" stroke-width="5"/>
<line data-segment="B2B3" x1="304.21" y1="184.54" x2="319.37" y2="121.88" stroke="#124e52" stroke-width="5"/>
<line data-segment="B3B4" x1="319.37" y1="121.88" x2="238.52" y2="98.63" stroke="#124e52" stroke-width="5"/>
<line data-segment="B4B1" x1="238.52" y1="98.63" x2="203.15" y2="184.54" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="C1 C2 C3 C4" points="415.04,184.54 549.79,184.54 570,100.99 462.2,70" fill="#e7f2f0" stroke="none"/>
<line data-segment="C1C2" x1="415.04" y1="184.54" x2="549.79" y2="184.54" stroke="#124e52" stroke-width="5"/>
