<svg xmlns="http://www.w3.org/2000/svg" width="600" height="319" viewBox="0 0 600 319" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Three similar polygons A, B and C</title><desc id="desc">Three similar polygons A, B and C in a row, each larger than the last. An arrow marked × 3/2 runs from A to B and an arrow marked × 4/3 runs from B to C. Labels read A: perimeter 27 cm, A: area 45 cm² and C: area y. Not drawn to scale.</desc>
