<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">A triangle enlarged to a similar triangle</title><desc id="desc">Two similar triangles, with an arrow marked × 3 from the smaller to the larger. The smaller is marked perimeter 24 cm and the larger is marked perimeter p. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="360" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="S1 S2 S3" points="45,250.02 145.99,250.02 79.34,181.35" fill="#e7f2f0" stroke="none"/>
<line data-segment="S1S2" x1="45" y1="250.02" x2="145.99" y2="250.02" stroke="#124e52" stroke-width="5"/>
<line data-segment="S2S3" x1="145.99" y1="250.02" x2="79.34" y2="181.35" stroke="#124e52" stroke-width="5"/>
<line data-segment="S3S1" x1="79.34" y1="181.35" x2="45" y2="250.02" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="T1 T2 T3" points="252.03,250.02 555,250.02 355.04,44" fill="#fdf3e6" stroke="none"/>
<line data-segment="T1T2" x1="252.03" y1="250.02" x2="555" y2="250.02" stroke="#124e52" stroke-width="5"/>
<line data-segment="T2T3" x1="555" y1="250.02" x2="355.04" y2="44" stroke="#124e52" stroke-width="5"/>
<line data-segment="T3T1" x1="355.04" y1="44" x2="252.03" y2="250.02" stroke="#124e52" stroke-width="5"/>
<path data-arrow="scale" d="M162.96 215.68 L235.06 215.68 M221.06 224.68 L235.06 215.68 L221.06 206.68" fill="none" stroke="#124e52" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="340" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="caption:arrow-scale" x="189.01" y="202.24" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">× 3</text>
<text data-label-for="caption:first" x="123.8" y="282.5" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">perimeter 24 cm</text>
<text data-label-for="caption:second" x="403.51" y="282.5" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">perimeter p</text>
</g>
</svg>
