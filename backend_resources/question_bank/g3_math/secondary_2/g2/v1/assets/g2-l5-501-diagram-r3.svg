<line data-segment="V5V1" x1="189.77" y1="88.76" x2="202.75" y2="244" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="W1 W2 W3 W4 W5" points="397.25,364 224.16,364 189.77,462 270.07,564 410.23,519.24" fill="#fdf3e6" stroke="none"/>
<line data-segment="W1W2" x1="397.25" y1="364" x2="224.16" y2="364" stroke="#124e52" stroke-width="5"/>
