<svg xmlns="http://www.w3.org/2000/svg" width="600" height="674" viewBox="0 0 600 674" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Two congruent pentagons</title><desc id="desc">Two pentagons, the second turned upside down below the first. The sides of the first are marked (3x + 2) cm, 12 cm, 15 cm, 17 cm and 18 cm. One side of the second is marked (5x − 10) cm. These two sides correspond, and each has one tick. Not drawn to scale.</desc>
