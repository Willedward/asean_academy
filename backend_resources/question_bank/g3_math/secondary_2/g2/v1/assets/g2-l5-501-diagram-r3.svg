<line data-segment="V1V2" x1="202.75" y1="244" x2="375.84" y2="244" stroke="#124e52" stroke-width="5"/>
<line data-segment="V2V3" x1="375.84" y1="244" x2="410.23" y2="146" stroke="#124e52" stroke-width="5"/>
