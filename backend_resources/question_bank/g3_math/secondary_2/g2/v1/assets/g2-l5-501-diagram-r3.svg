<line data-segment="W3W4" x1="189.77" y1="462" x2="270.07" y2="564" stroke="#124e52" stroke-width="5"/>
<line data-segment="W4W5" x1="270.07" y1="564" x2="410.23" y2="519.24" stroke="#124e52" stroke-width="5"/>
<line data-segment="W5W1" x1="410.23" y1="519.24" x2="397.25" y2="364" stroke="#124e52" stroke-width="5"/>
<path data-tick-mark="V1V2" data-ticks="1" d="M289.29 254 L289.29 234" fill="none" stroke="#124e52" stroke-width="3"/>
