<svg xmlns="http://www.w3.org/2000/svg" width="600" height="510" viewBox="0 0 600 510" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Shadows of a pole and a tree</title><desc id="desc">Two triangles, each with an upright, its shadow along level ground and a dashed sun ray. The pole is marked 3 m and its shadow 2 m. The tree is marked h. The second shadow is marked 8 m. A right angle is shown with a corner mark at each foot. One arc in each triangle marks the equal angle of the sun ray with the ground. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="510" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="S1 F1 T1" points="76.26,386 131.26,386 131.26,303.5" fill="#e7f2f0" stroke="none"/>
<polygon data-shape="figure" data-points="S2 F2 T2" points="252.26,386 472.26,386 472.26,56" fill="#fdf3e6" stroke="none"/>
<line data-segment="S1F1" x1="76.26" y1="386" x2="131.26" y2="386" stroke="#124e52" stroke-width="5"/>
<line data-segment="F1T1" x1="131.26" y1="386" x2="131.26" y2="303.5" stroke="#124e52" stroke-width="5"/>
<line data-segment="S1T1" x1="76.26" y1="386" x2="131.26" y2="303.5" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="S2F2" x1="252.26" y1="386" x2="472.26" y2="386" stroke="#124e52" stroke-width="5"/>
<line data-segment="F2T2" x1="472.26" y1="386" x2="472.26" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="S2T2" x1="252.26" y1="386" x2="472.26" y2="56" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="F2" d="M456.26 386 L456.26 370 L472.26 370" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-right-angle-marker="F1" d="M115.26 386 L115.26 370 L131.26 370" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="sun-first" d="M103.76 386 A27.5 27.5 0 0 0 91.51 363.12" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="sun-second" d="M290.26 386 A38 38 0 0 0 273.34 354.38" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="490" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:F1T1" x="169.84" y="354.11" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">3 m</text>
<text data-label-for="segment:F2T2" x="492.38" y="230.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">h</text>
<text data-label-for="segment:S1F1" x="103.76" y="416.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">2 m</text>
<text data-label-for="segment:S2F2" x="362.26" y="416.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">8 m</text>
<text data-label-for="caption:first-name" x="131.26" y="289.98" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">pole</text>
<text data-label-for="caption:second-name" x="472.26" y="44.64" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">tree</text>
</g>
