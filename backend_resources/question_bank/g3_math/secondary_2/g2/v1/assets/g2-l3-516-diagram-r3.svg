<svg xmlns="http://www.w3.org/2000/svg" width="600" height="510" viewBox="0 0 600 510" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Shadows of a stick and a building</title><desc id="desc">Two triangles, each with an upright, its shadow along level ground and a dashed sun ray. The stick is marked 1.5 m and its shadow 2 m. The building is marked h. The second shadow is marked 30 m. A right angle is shown with a corner mark at the foot of the building. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="510" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="S1 F1 T1" points="77.8,221 107.13,221 107.13,199" fill="#e7f2f0" stroke="none"/>
<polygon data-shape="figure" data-points="S2 F2 T2" points="51.4,386 491.4,386 491.4,56" fill="#fdf3e6" stroke="none"/>
<line data-segment="S1F1" x1="77.8" y1="221" x2="107.13" y2="221" stroke="#124e52" stroke-width="5"/>
<line data-segment="F1T1" x1="107.13" y1="221" x2="107.13" y2="199" stroke="#124e52" stroke-width="5"/>
<line data-segment="S1T1" x1="77.8" y1="221" x2="107.13" y2="199" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="S2F2" x1="51.4" y1="386" x2="491.4" y2="386" stroke="#124e52" stroke-width="5"/>
<line data-segment="F2T2" x1="491.4" y1="386" x2="491.4" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="S2T2" x1="51.4" y1="386" x2="491.4" y2="56" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="F2" d="M475.4 386 L475.4 370 L491.4 370" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="490" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:F1T1" x="160.27" y="219.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">1.5 m</text>
<text data-label-for="segment:F2T2" x="511.52" y="230.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">h</text>
<text data-label-for="segment:S1F1" x="92.47" y="251.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">2 m</text>
<text data-label-for="segment:S2F2" x="271.4" y="416.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">30 m</text>
<text data-label-for="caption:first-name" x="107.13" y="187.64" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">stick</text>
<text data-label-for="caption:second-name" x="491.4" y="42.48" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">building</text>
</g>
</svg>
