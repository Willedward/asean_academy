<path data-right-angle-marker="F1" d="M98.35 219.88 L98.35 206.77 L111.46 206.77" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="sun-first" d="M80.73 219.88 A30.73 30.73 0 0 0 75.57 202.84" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="sun-second" d="M284.66 219.88 A38 38 0 0 0 278.28 198.8" fill="none" stroke="#c2620a" stroke-width="3.5"/>
