<polygon data-shape="figure" data-points="S2 F2 T2" points="246.66,219.88 492.48,219.88 492.48,56" fill="#fdf3e6" stroke="none"/>
<line data-segment="S1F1" x1="50" y1="219.88" x2="111.46" y2="219.88" stroke="#124e52" stroke-width="5"/>
<line data-segment="F1T1" x1="111.46" y1="219.88" x2="111.46" y2="178.91" stroke="#124e52" stroke-width="5"/>
<line data-segment="S1T1" x1="50" y1="219.88" x2="111.46" y2="178.91" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
