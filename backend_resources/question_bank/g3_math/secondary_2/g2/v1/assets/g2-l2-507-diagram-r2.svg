<svg xmlns="http://www.w3.org/2000/svg" width="600" height="344" viewBox="0 0 600 344" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Shadows of a pole and a tree</title><desc id="desc">Two triangles, each with an upright, its shadow along level ground and a dashed sun ray. The pole is marked 2 m and its shadow 3 m. The tree is marked h. The second shadow is marked 12 m. A right angle is shown with a corner mark at each foot. One arc in each triangle marks the equal angle of the sun ray with the ground. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="344" rx="20" fill="#f7faf9"/>
