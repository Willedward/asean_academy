<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Similar triangles ABC and DEF</title>
  <desc id="desc">Diagram is not drawn to scale.</desc>
  <rect width="940" height="500" rx="28" fill="#f7faf9"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#103f42">Similar triangles ABC and DEF</text>
  <text x="44" y="92" font-family="Arial, sans-serif" font-size="18" fill="#52666a">Not drawn to scale</text>
  <polygon points="120,380 181,218 340,380" fill="#dff3ef" stroke="#103f42" stroke-width="7"/>
  <polygon points="490,380 582,137 820,380" fill="#fff1db" stroke="#103f42" stroke-width="7"/>
  <text x="100" y="412" font-family="Arial" font-size="23" fill="#103f42">A</text>
  <text x="174" y="206" font-family="Arial" font-size="23" fill="#103f42">B</text>
  <text x="345" y="412" font-family="Arial" font-size="23" fill="#103f42">C</text>
  <text x="468" y="412" font-family="Arial" font-size="23" fill="#103f42">D</text>
  <text x="575" y="124" font-family="Arial" font-size="23" fill="#103f42">E</text>
  <text x="826" y="412" font-family="Arial" font-size="23" fill="#103f42">F</text>
  <text x="134" y="300" font-family="Arial" font-size="22" fill="#103f42" text-anchor="end">AB = 8 cm</text>
  <text x="274" y="290" font-family="Arial" font-size="22" fill="#103f42">BC = 10 cm</text>
  <text x="520" y="262" font-family="Arial" font-size="22" fill="#103f42" text-anchor="end">DE = 12 cm</text>
</svg>
