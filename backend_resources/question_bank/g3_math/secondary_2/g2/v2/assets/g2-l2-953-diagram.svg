<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Similar triangles ABC and DEF</title>
  <desc id="desc">Diagram is not drawn to scale.</desc>
  <rect width="940" height="500" rx="28" fill="#f7faf9"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#103f42">Similar triangles ABC and DEF</text>
  <text x="44" y="92" font-family="Arial, sans-serif" font-size="18" fill="#52666a">Not drawn to scale</text>
  
  <polygon points="100,380 185,155 405,380" fill="#dff3ef" stroke="#103f42" stroke-width="7"/>
  <polygon points="520,380 650,115 865,380" fill="#fff1db" stroke="#103f42" stroke-width="7"/>
  <text x="72" y="412" font-family="Arial" font-size="23" fill="#103f42">A</text>
  <text x="175" y="145" font-family="Arial" font-size="23" fill="#103f42">B</text>
  <text x="407" y="412" font-family="Arial" font-size="23" fill="#103f42">C</text>
  <text x="488" y="412" font-family="Arial" font-size="23" fill="#103f42">D</text>
  <text x="641" y="105" font-family="Arial" font-size="23" fill="#103f42">E</text>
  <text x="867" y="412" font-family="Arial" font-size="23" fill="#103f42">F</text>
  <text x="117" y="255" font-family="Arial" font-size="22" fill="#103f42">AB = 8 cm</text>
  <text x="260" y="415" font-family="Arial" font-size="22" fill="#103f42">BC = 10 cm</text>
  <text x="520" y="245" font-family="Arial" font-size="22" fill="#103f42">DE = 12 cm</text>

</svg>
