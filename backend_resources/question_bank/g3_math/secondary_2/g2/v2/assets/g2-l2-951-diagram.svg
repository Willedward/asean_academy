<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Congruent triangles</title>
  <desc id="desc">Diagram is not drawn to scale.</desc>
  <rect width="940" height="500" rx="28" fill="#f7faf9"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#103f42">Congruent triangles</text>
  <text x="44" y="92" font-family="Arial, sans-serif" font-size="18" fill="#52666a">Not drawn to scale</text>
  
  <polygon points="100,380 250,145 390,380" fill="#dff3ef" stroke="#103f42" stroke-width="7"/>
  <polygon points="550,380 700,145 840,380" fill="#fff1db" stroke="#103f42" stroke-width="7"/>
  <text x="145" y="275" font-family="Arial" font-size="24" fill="#103f42">7 cm</text>
  <text x="300" y="275" font-family="Arial" font-size="24" fill="#103f42">11 cm</text>
  <text x="222" y="415" font-family="Arial" font-size="24" fill="#103f42">9 cm</text>
  <text x="157" y="462" font-family="Arial" font-size="24" font-weight="700" fill="#103f42">PQR</text>
  <text x="654" y="462" font-family="Arial" font-size="24" font-weight="700" fill="#103f42">XYZ</text>
  <text x="426" y="270" font-family="Arial" font-size="34" fill="#c87516">≅</text>

</svg>
