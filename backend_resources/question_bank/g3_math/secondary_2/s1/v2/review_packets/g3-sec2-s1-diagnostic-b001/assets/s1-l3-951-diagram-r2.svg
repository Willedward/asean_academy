<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Stem-and-leaf diagram</title><desc id="desc">Stem-and-leaf diagram. stem 1, leaves 2 4 7; stem 2, leaves 0 0 5 8; stem 3, leaves 1 6. Key: 2 | 5 = 25.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="310" y1="90" x2="310" y2="355" stroke="#17324d" stroke-width="4"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Stem-and-leaf diagram</text>
<text x="285" y="125" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">1</text>
<text x="335" y="125" font-size="25" font-weight="500" text-anchor="start" fill="#17324d" data-chart-mark="row-0" data-chart-kind="stem-leaf-row" data-value="1|2 4 7">2  4  7</text>
<text x="285" y="183" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">2</text>
<text x="335" y="183" font-size="25" font-weight="500" text-anchor="start" fill="#17324d" data-chart-mark="row-1" data-chart-kind="stem-leaf-row" data-value="2|0 0 5 8">0  0  5  8</text>
<text x="285" y="241" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">3</text>
<text x="335" y="241" font-size="25" font-weight="500" text-anchor="start" fill="#17324d" data-chart-mark="row-2" data-chart-kind="stem-leaf-row" data-value="3|1 6">1  6</text>
<text x="360" y="420" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Key: 2 | 5 = 25</text>
</g>
</svg>
