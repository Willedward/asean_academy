<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Histogram display</title><desc id="desc">Histogram with 2 classes; frequency values 10, 20.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="90" y1="385" x2="680" y2="385" stroke="#cad5df" stroke-width="1.5"/>
