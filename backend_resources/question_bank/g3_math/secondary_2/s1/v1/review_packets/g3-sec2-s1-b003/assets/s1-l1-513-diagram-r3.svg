<text x="75" y="160.5" font-size="25" font-weight="500" text-anchor="end" fill="#17324d">15</text>
<text x="75" y="83" font-size="25" font-weight="500" text-anchor="end" fill="#17324d">20</text>
<text x="90" y="423" font-size="25" font-weight="500" text-anchor="middle" fill="#17324d">0</text>
