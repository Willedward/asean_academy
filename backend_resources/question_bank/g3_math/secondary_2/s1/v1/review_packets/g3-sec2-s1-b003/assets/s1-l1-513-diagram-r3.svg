<line x1="90" y1="378" x2="90" y2="392" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="x:0" data-axis="x" data-value="0" data-position="90" data-label="0"/>
<line x1="208" y1="378" x2="208" y2="392" stroke="#17324d" stroke-width="2"/>
