<line x1="680" y1="378" x2="680" y2="392" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="x:25" data-axis="x" data-value="25" data-position="680" data-label="25"/>
<line x1="90" y1="75" x2="90" y2="385" stroke="#17324d" stroke-width="3"/>
<line x1="90" y1="385" x2="680" y2="385" stroke="#17324d" stroke-width="3"/>
<rect data-chart-mark="bin-0" data-chart-kind="histogram-bin" data-value="10" x="90" y="230" width="118" height="155" fill="#dcecf6" stroke="#17324d" stroke-width="2"/>
<rect data-chart-mark="bin-1" data-chart-kind="histogram-bin" data-value="20" x="208" y="75" width="472" height="310" fill="#dcecf6" stroke="#17324d" stroke-width="2"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Histogram display</text>
<text x="75" y="393" font-size="25" font-weight="500" text-anchor="end" fill="#17324d">0</text>
<text x="75" y="315.5" font-size="25" font-weight="500" text-anchor="end" fill="#17324d">5</text>
