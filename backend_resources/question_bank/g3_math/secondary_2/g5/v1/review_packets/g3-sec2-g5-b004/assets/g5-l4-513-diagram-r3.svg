<line data-segment="bObE" x1="438.57" y1="181.43" x2="539.25" y2="96.95" stroke="#c2620a" stroke-width="4"/>
<circle data-point="bO" cx="438.57" cy="181.43" r="4" fill="#c2620a"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="443" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
