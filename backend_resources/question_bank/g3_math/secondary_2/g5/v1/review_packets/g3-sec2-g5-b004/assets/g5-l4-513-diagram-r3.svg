<path data-ellipse="aequator" data-half="back" d="M30 181.43 A119.48 35.84 0 0 1 268.96 181.43" fill="none" stroke="#7d9799" stroke-width="2" stroke-dasharray="10 8"/>
<path data-ellipse="aequator" data-half="front" d="M30 181.43 A119.48 35.84 0 0 0 268.96 181.43" fill="none" stroke="#7d9799" stroke-width="2"/>
<line data-segment="aOaE" x1="149.48" y1="181.43" x2="241.01" y2="104.63" stroke="#c2620a" stroke-width="4"/>
