<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc" data-renderer="nextscholar-mensuration-svg-v2">
<title id="title">Sphere before and after enlargement</title><desc id="desc">Two spheres side by side: the original with radius r, and the enlarged sphere with radius R, which is r increased by 50%. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="500" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<circle data-circle="asphere" cx="130" cy="200" r="100" fill="#e7f2f0" stroke="#124e52" stroke-width="5"/>
<path data-ellipse="aequator" data-half="back" d="M30 200 A100 30 0 0 1 230 200" fill="none" stroke="#7d9799" stroke-width="2" stroke-dasharray="10 8"/>
<path data-ellipse="aequator" data-half="front" d="M30 200 A100 30 0 0 0 230 200" fill="none" stroke="#7d9799" stroke-width="2"/>
<line data-segment="aOaE" x1="130" y1="200" x2="206.6" y2="135.72" stroke="#c2620a" stroke-width="4"/>
<circle data-point="aO" cx="130" cy="200" r="4" fill="#c2620a"/>
<circle data-circle="bsphere" cx="420" cy="200" r="150" fill="#e7f2f0" stroke="#124e52" stroke-width="5"/>
<path data-ellipse="bequator" data-half="back" d="M270 200 A150 45 0 0 1 570 200" fill="none" stroke="#7d9799" stroke-width="2" stroke-dasharray="10 8"/>
<path data-ellipse="bequator" data-half="front" d="M270 200 A150 45 0 0 0 570 200" fill="none" stroke="#7d9799" stroke-width="2"/>
<line data-segment="bObE" x1="420" y1="200" x2="534.91" y2="103.58" stroke="#c2620a" stroke-width="4"/>
<circle data-point="bO" cx="420" cy="200" r="4" fill="#c2620a"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="480" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text x="130" y="398.64" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">radius r</text>
<text x="420" y="396.48" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">r increased by 50%</text>
<text data-label-for="segment:aOaE" x="154.06" y="159.53" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">r</text>
<text data-label-for="segment:bObE" x="461.78" y="141.74" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">R</text>
</g>
</svg>
