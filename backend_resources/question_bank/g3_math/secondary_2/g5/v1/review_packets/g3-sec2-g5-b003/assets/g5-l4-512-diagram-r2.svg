<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" role="img" aria-labelledby="title desc" data-renderer="nextscholar-mensuration-svg-v2">
<title id="title">Hollow spherical shell</title><desc id="desc">Hollow spherical shell: an outer sphere of radius R = 4 cm with a dashed concentric inner sphere of radius r = 2 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="470" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<circle data-circle="sphere" cx="300" cy="215" r="165" fill="#e7f2f0" stroke="#124e52" stroke-width="5"/>
<circle data-point="O" cx="300" cy="215" r="4" fill="#c2620a"/>
<circle data-circle="inner" cx="300" cy="215" r="82.5" fill="#ffffff" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="OE" x1="300" y1="215" x2="426.4" y2="108.94" stroke="#c2620a" stroke-width="4"/>
<line data-segment="OI" x1="300" y1="215" x2="236.8" y2="268.03" stroke="#c2620a" stroke-width="4"/>
<circle data-point="O" cx="300" cy="215" r="4" fill="#c2620a"/>
<path data-leader-for="segment:OE" d="M373.31 153.49 L471.39 114.25" fill="none" stroke="#153f42" stroke-width="2"/>
<circle data-leader-anchor="segment:OE" cx="373.31" cy="153.49" r="3.5" fill="#153f42"/>
<path data-leader-for="segment:OI" d="M268.4 241.51 L288.72 309.24" fill="none" stroke="#153f42" stroke-width="2"/>
<circle data-leader-anchor="segment:OI" cx="268.4" cy="241.51" r="3.5" fill="#153f42"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="450" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:OE" x="509.09" y="107.81" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">R = 4 cm</text>
<text data-label-for="segment:OI" x="293.24" y="332.96" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">r = 2 cm</text>
</g>
</svg>
