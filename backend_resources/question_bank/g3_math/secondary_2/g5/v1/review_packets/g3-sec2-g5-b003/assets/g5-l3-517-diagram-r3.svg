<line data-segment="VP3" x1="407.03" y1="46" x2="560" y2="236.65" stroke="#124e52" stroke-width="5"/>
<line data-segment="VO" x1="407.03" y1="46" x2="407.03" y2="276" stroke="#c2620a" stroke-width="4" stroke-dasharray="10 8"/>
