<polygon points="470.05,384.6 560,328.4 380.02,46" fill="#fdf3e6" stroke="none"/>
<polygon data-shape="pyramid-base" data-points="P1 P2 P3 P4" points="200.05,384.6 470.05,384.6 560,328.4 290,328.4" fill="none" stroke="none"/>
<line data-segment="P1P4" x1="200.05" y1="384.6" x2="290" y2="328.4" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="P4P3" x1="290" y1="328.4" x2="560" y2="328.4" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="VP4" x1="380.02" y1="46" x2="290" y2="328.4" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="P1P2" x1="200.05" y1="384.6" x2="470.05" y2="384.6" stroke="#124e52" stroke-width="5"/>
<line data-segment="P2P3" x1="470.05" y1="384.6" x2="560" y2="328.4" stroke="#124e52" stroke-width="5"/>
<line data-segment="VP1" x1="380.02" y1="46" x2="200.05" y2="384.6" stroke="#124e52" stroke-width="5"/>
<line data-segment="VP2" x1="380.02" y1="46" x2="470.05" y2="384.6" stroke="#124e52" stroke-width="5"/>
<line data-segment="VP3" x1="380.02" y1="46" x2="560" y2="328.4" stroke="#124e52" stroke-width="5"/>
<line data-segment="VO" x1="380.02" y1="46" x2="380.02" y2="356.5" stroke="#c2620a" stroke-width="4" stroke-dasharray="10 8"/>
<path data-right-angle-marker="O" d="M380.02 340.5 L396.02 340.5 L396.02 356.5" fill="none" stroke="#c2620a" stroke-width="3.5"/>
