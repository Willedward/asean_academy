<title id="title">Rectangular-based pyramid</title><desc id="desc">Rectangular-based pyramid with base 7 cm by 5 cm and volume 70 cm³. The perpendicular height h runs from the apex to the centre of the base, with the right angle marked. Not drawn to scale.</desc>
