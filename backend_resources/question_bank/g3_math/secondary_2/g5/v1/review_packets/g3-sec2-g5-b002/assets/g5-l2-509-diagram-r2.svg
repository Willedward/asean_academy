<polygon data-shape="pyramid-base" data-points="P1 P2 P3 P4" points="194.06,405.35 434.06,405.35 560,326.65 320,326.65" fill="none" stroke="none"/>
<line data-segment="P1P4" x1="194.06" y1="405.35" x2="320" y2="326.65" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="P4P3" x1="320" y1="326.65" x2="560" y2="326.65" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="VP4" x1="377.03" y1="46" x2="320" y2="326.65" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
