<line data-segment="VP2" x1="377.03" y1="46" x2="434.06" y2="405.35" stroke="#124e52" stroke-width="5"/>
<line data-segment="VP3" x1="377.03" y1="46" x2="560" y2="326.65" stroke="#124e52" stroke-width="5"/>
<line data-segment="VO" x1="377.03" y1="46" x2="377.03" y2="366" stroke="#c2620a" stroke-width="4" stroke-dasharray="10 8"/>
<path data-right-angle-marker="O" d="M377.03 350 L393.03 350 L393.03 366" fill="none" stroke="#c2620a" stroke-width="3.5"/>
