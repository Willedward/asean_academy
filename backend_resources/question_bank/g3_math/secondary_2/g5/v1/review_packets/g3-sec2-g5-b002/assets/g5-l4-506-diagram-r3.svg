<path data-ellipse="aequator" data-half="back" d="M30 187.27 A114.39 34.32 0 0 1 258.78 187.27" fill="none" stroke="#7d9799" stroke-width="2" stroke-dasharray="10 8"/>
<path data-ellipse="aequator" data-half="front" d="M30 187.27 A114.39 34.32 0 0 0 258.78 187.27" fill="none" stroke="#7d9799" stroke-width="2"/>
<line data-segment="aOaE" x1="144.39" y1="187.27" x2="232.02" y2="113.74" stroke="#c2620a" stroke-width="4"/>
<circle data-point="aO" cx="144.39" cy="187.27" r="4" fill="#c2620a"/>
<circle data-circle="bsphere" cx="432.73" cy="187.27" r="137.27" fill="#e7f2f0" stroke="#124e52" stroke-width="5"/>
<path data-ellipse="bequator" data-half="back" d="M295.46 187.27 A137.27 41.18 0 0 1 570 187.27" fill="none" stroke="#7d9799" stroke-width="2" stroke-dasharray="10 8"/>
<path data-ellipse="bequator" data-half="front" d="M295.46 187.27 A137.27 41.18 0 0 0 570 187.27" fill="none" stroke="#7d9799" stroke-width="2"/>
<line data-segment="bObE" x1="432.73" y1="187.27" x2="537.89" y2="99.03" stroke="#c2620a" stroke-width="4"/>
<circle data-point="bO" cx="432.73" cy="187.27" r="4" fill="#c2620a"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="455" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
