<text data-label-for="segment:aOaE" x="167.47" y="149.02" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">r</text>
<text data-label-for="segment:bObE" x="466.33" y="136.73" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">R</text>
</g>
