<svg xmlns="http://www.w3.org/2000/svg" width="600" height="485" viewBox="0 0 600 485" role="img" aria-labelledby="title desc" data-renderer="nextscholar-mensuration-svg-v2">
<title id="title">Sphere before and after enlargement</title><desc id="desc">Two spheres side by side: the original with radius r, and the enlarged sphere with radius R, which is r increased by 30%. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="485" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<circle data-circle="asphere" cx="139.7" cy="192.61" r="109.7" fill="#e7f2f0" stroke="#124e52" stroke-width="5"/>
<path data-ellipse="aequator" data-half="back" d="M30 192.61 A109.7 32.91 0 0 1 249.4 192.61" fill="none" stroke="#7d9799" stroke-width="2" stroke-dasharray="10 8"/>
<path data-ellipse="aequator" data-half="front" d="M30 192.61 A109.7 32.91 0 0 0 249.4 192.61" fill="none" stroke="#7d9799" stroke-width="2"/>
<line data-segment="aOaE" x1="139.7" y1="192.61" x2="223.73" y2="122.1" stroke="#c2620a" stroke-width="4"/>
<circle data-point="aO" cx="139.7" cy="192.61" r="4" fill="#c2620a"/>
<circle data-circle="bsphere" cx="427.39" cy="192.61" r="142.61" fill="#e7f2f0" stroke="#124e52" stroke-width="5"/>
<path data-ellipse="bequator" data-half="back" d="M284.78 192.61 A142.61 42.78 0 0 1 570 192.61" fill="none" stroke="#7d9799" stroke-width="2" stroke-dasharray="10 8"/>
<path data-ellipse="bequator" data-half="front" d="M284.78 192.61 A142.61 42.78 0 0 0 570 192.61" fill="none" stroke="#7d9799" stroke-width="2"/>
<line data-segment="bObE" x1="427.39" y1="192.61" x2="536.63" y2="100.94" stroke="#c2620a" stroke-width="4"/>
<circle data-point="bO" cx="427.39" cy="192.61" r="4" fill="#c2620a"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="465" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text x="139.7" y="383.86" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">radius r</text>
