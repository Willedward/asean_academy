<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Curved surface area of a cone</title><desc id="desc">A labelled cone mensuration schematic. The diagram is not drawn to scale.</desc><rect width="760" height="430" rx="24" fill="#f7faf9"/><g font-family="system-ui,sans-serif" fill="#153f42"><text x="35" y="42" font-size="23" font-weight="700">Curved surface area of a cone</text><text x="35" y="68" font-size="14" fill="#607579">Not drawn to scale</text><ellipse cx="250" cy="340" rx="145" ry="43" fill="#e4f1ef" stroke="#124e52" stroke-width="5"/><path d="M250 75 L105 340 M250 75 L395 340" fill="none" stroke="#124e52" stroke-width="5"/><path d="M250 75 V340 M250 340 H395" fill="none" stroke="#d17a18" stroke-width="4" stroke-dasharray="9 7"/><path d="M250 310 h30 v30" fill="none" stroke="#d17a18" stroke-width="4"/><rect x="480" y="125" width="235" height="190" rx="16" fill="#fff" stroke="#c6d7d5" stroke-width="2"/><text x="505" y="165" font-size="18" font-weight="700">Given dimensions</text><text x="505" y="205" font-size="17">r = 8 cm</text><text x="505" y="233" font-size="17">l = 17 cm</text><text x="505" y="285" font-size="14" fill="#607579">Select the dimensions</text><text x="505" y="306" font-size="14" fill="#607579">required by the formula.</text></g></svg>