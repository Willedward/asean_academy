<polygon points="434.06,405.35 560,326.65 400.6,46" fill="#fdf3e6" stroke="none"/>
<polygon data-shape="pyramid-base" data-points="P1 P2 P3 P4" points="241.21,405.35 434.06,405.35 560,326.65 367.14,326.65" fill="none" stroke="none"/>
<line data-segment="P1P4" x1="241.21" y1="405.35" x2="367.14" y2="326.65" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="P4P3" x1="367.14" y1="326.65" x2="560" y2="326.65" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="VP4" x1="400.6" y1="46" x2="367.14" y2="326.65" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
