<line data-segment="P2P3" x1="434.06" y1="405.35" x2="560" y2="326.65" stroke="#124e52" stroke-width="5"/>
<line data-segment="VP1" x1="400.6" y1="46" x2="241.21" y2="405.35" stroke="#124e52" stroke-width="5"/>
<line data-segment="VP2" x1="400.6" y1="46" x2="434.06" y2="405.35" stroke="#124e52" stroke-width="5"/>
<line data-segment="VP3" x1="400.6" y1="46" x2="560" y2="326.65" stroke="#124e52" stroke-width="5"/>
<line data-segment="VO" x1="400.6" y1="46" x2="400.6" y2="366" stroke="#c2620a" stroke-width="4" stroke-dasharray="10 8"/>
<path data-right-angle-marker="O" d="M400.6 350 L416.6 350 L416.6 366" fill="none" stroke="#c2620a" stroke-width="3.5"/>
