<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Curved area of a hemisphere</title><desc id="desc">A labelled hemisphere mensuration schematic. The diagram is not drawn to scale.</desc><rect width="760" height="430" rx="24" fill="#f7faf9"/><g font-family="system-ui,sans-serif" fill="#153f42"><text x="35" y="42" font-size="23" font-weight="700">Curved area of a hemisphere</text><text x="35" y="68" font-size="14" fill="#607579">Not drawn to scale</text><path d="M95 220 A150 150 0 0 0 395 220" fill="#e4f1ef" stroke="#124e52" stroke-width="5"/><ellipse cx="245" cy="220" rx="150" ry="46" fill="#f7faf9" stroke="#124e52" stroke-width="5"/><path d="M245 220 H395" stroke="#d17a18" stroke-width="4"/><rect x="480" y="125" width="235" height="190" rx="16" fill="#fff" stroke="#c6d7d5" stroke-width="2"/><text x="505" y="165" font-size="18" font-weight="700">Given dimensions</text><text x="505" y="205" font-size="17">r = 6 cm</text><text x="505" y="233" font-size="17">open at circular face</text><text x="505" y="285" font-size="14" fill="#607579">Select the dimensions</text><text x="505" y="306" font-size="14" fill="#607579">required by the formula.</text></g></svg>