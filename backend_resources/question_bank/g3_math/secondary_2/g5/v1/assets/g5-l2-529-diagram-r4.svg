<line data-segment="P2P3" x1="449.81" y1="400.43" x2="560" y2="331.57" stroke="#124e52" stroke-width="5"/>
<line data-segment="VP1" x1="369.9" y1="46" x2="179.81" y2="400.43" stroke="#124e52" stroke-width="5"/>
<line data-segment="VP2" x1="369.9" y1="46" x2="449.81" y2="400.43" stroke="#124e52" stroke-width="5"/>
<line data-segment="VP3" x1="369.9" y1="46" x2="560" y2="331.57" stroke="#124e52" stroke-width="5"/>
<line data-segment="VO" x1="369.9" y1="46" x2="369.9" y2="366" stroke="#c2620a" stroke-width="4" stroke-dasharray="10 8"/>
<path data-right-angle-marker="O" d="M369.9 350 L385.9 350 L385.9 366" fill="none" stroke="#c2620a" stroke-width="3.5"/>
