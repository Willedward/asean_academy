<polygon points="449.81,400.43 560,331.57 369.9,46" fill="#fdf3e6" stroke="none"/>
<polygon data-shape="pyramid-base" data-points="P1 P2 P3 P4" points="179.81,400.43 449.81,400.43 560,331.57 290,331.57" fill="none" stroke="none"/>
<line data-segment="P1P4" x1="179.81" y1="400.43" x2="290" y2="331.57" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="P4P3" x1="290" y1="331.57" x2="560" y2="331.57" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
<line data-segment="VP4" x1="369.9" y1="46" x2="290" y2="331.57" stroke="#124e52" stroke-width="5" stroke-dasharray="10 8"/>
