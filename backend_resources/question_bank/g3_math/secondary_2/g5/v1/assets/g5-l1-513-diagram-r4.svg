<line data-segment="VP3" x1="383.02" y1="46" x2="560" y2="334.77" stroke="#124e52" stroke-width="5"/>
<line data-segment="VO" x1="383.02" y1="46" x2="383.02" y2="361" stroke="#c2620a" stroke-width="4" stroke-dasharray="10 8"/>
