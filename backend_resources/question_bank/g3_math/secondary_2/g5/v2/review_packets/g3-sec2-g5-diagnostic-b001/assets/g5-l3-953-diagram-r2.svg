<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Square-based pyramid</title>
  <desc id="desc">Diagram is not drawn to scale.</desc>
  <rect width="940" height="500" rx="28" fill="#f7faf9"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#103f42">Square-based pyramid</text>
  <text x="44" y="92" font-family="Arial, sans-serif" font-size="18" fill="#52666a">Not drawn to scale</text>
  <polygon points="210,360 640,360 790,290 360,290" fill="#fff1db" stroke="#103f42" stroke-width="7"/>
  <line x1="500" y1="105" x2="210" y2="360" stroke="#103f42" stroke-width="7"/>
  <line x1="500" y1="105" x2="640" y2="360" stroke="#103f42" stroke-width="7"/>
  <line x1="500" y1="105" x2="790" y2="290" stroke="#103f42" stroke-width="7"/>
  <line x1="500" y1="105" x2="360" y2="290" stroke="#103f42" stroke-width="7"/>
  <line x1="500" y1="105" x2="500" y2="325" stroke="#c87516" stroke-width="6" stroke-dasharray="12 10"/>
  <text x="512" y="238" font-family="Arial" font-size="22" fill="#103f42">9 cm</text>
  <text x="425" y="405" font-family="Arial" font-size="24" fill="#103f42" text-anchor="middle">12 cm</text>
</svg>
