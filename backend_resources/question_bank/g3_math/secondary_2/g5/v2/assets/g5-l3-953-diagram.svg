<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Square-based pyramid</title>
  <desc id="desc">Diagram is not drawn to scale.</desc>
  <rect width="940" height="500" rx="28" fill="#f7faf9"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#103f42">Square-based pyramid</text>
  <text x="44" y="92" font-family="Arial, sans-serif" font-size="18" fill="#52666a">Not drawn to scale</text>
  
  <polygon points="260,350 560,350 720,285 420,285" fill="#fff1db" stroke="#103f42" stroke-width="7"/>
  <line x1="490" y1="105" x2="260" y2="350" stroke="#103f42" stroke-width="7"/>
  <line x1="490" y1="105" x2="560" y2="350" stroke="#103f42" stroke-width="7"/>
  <line x1="490" y1="105" x2="720" y2="285" stroke="#103f42" stroke-width="7"/>
  <line x1="490" y1="105" x2="420" y2="285" stroke="#103f42" stroke-width="7"/>
  <line x1="490" y1="105" x2="490" y2="318" stroke="#c87516" stroke-width="6" stroke-dasharray="12 10"/>
  <text x="505" y="220" font-family="Arial" font-size="24" fill="#103f42">9 cm</text>
  <text x="365" y="395" font-family="Arial" font-size="24" fill="#103f42">12 cm</text>

</svg>
