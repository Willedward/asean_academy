<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Rectangular display</title>
  <desc id="desc">Diagram is not drawn to scale.</desc>
  <rect width="940" height="500" rx="28" fill="#f7faf9"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#103f42">Rectangular display</text>
  <text x="44" y="92" font-family="Arial, sans-serif" font-size="18" fill="#52666a">Not drawn to scale</text>
  
  <rect x="175" y="145" width="590" height="205" fill="#fff1db" stroke="#103f42" stroke-width="7"/>
  <line x1="175" y1="350" x2="765" y2="145" stroke="#c87516" stroke-width="7"/>
  <text x="425" y="397" font-family="Arial" font-size="24" fill="#103f42">35 cm</text>
  <text x="790" y="260" font-family="Arial" font-size="24" fill="#103f42">12 cm</text>
  <text x="414" y="225" font-family="Arial" font-size="24" fill="#c87516">diagonal</text>

