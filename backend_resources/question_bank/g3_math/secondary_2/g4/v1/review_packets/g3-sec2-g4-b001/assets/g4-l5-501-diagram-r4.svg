<svg xmlns="http://www.w3.org/2000/svg" width="600" height="317" viewBox="0 0 600 317" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Triangle</title><desc id="desc">Triangle with perimeter 84 m. Two sides are 12 m and 35 m; the third side is labelled x. No angle is marked. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="317" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="110,176.58 149.97,60 490,176.58" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="110" y1="176.58" x2="149.97" y2="60" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="110" y1="176.58" x2="490" y2="176.58" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="149.97" y1="60" x2="490" y2="176.58" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="297" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="83.2" y="111.61" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">12 m</text>
<text data-label-for="segment:BC" x="330.68" y="96.46" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">35 m</text>
<text data-label-for="segment:AC" x="300" y="207.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">x</text>
<text x="300" y="255.06" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">perimeter 84 m</text>
</g>
</svg>
