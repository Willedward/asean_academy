<svg xmlns="http://www.w3.org/2000/svg" width="600" height="384" viewBox="0 0 600 384" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Sight line and vertical height</title><desc id="desc">Right-angled triangle on level ground. The sight line makes 30° with the ground, the horizontal distance is 15 m and the vertical height is labelled x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="384" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="120,263.85 120,56 480,263.85" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="120" y1="263.85" x2="120" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="120" y1="263.85" x2="480" y2="263.85" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="120" y1="56" x2="480" y2="263.85" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M120 241.85 L142 241.85 L142 263.85" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M434 263.85 A46 46 0 0 1 440.16 240.85" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="364" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:C" x="349.29" y="238.19" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">30°</text>
<text data-label-for="segment:AB" x="100.79" y="169.29" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">x</text>
<text data-label-for="segment:AC" x="300" y="294.63" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">15 m</text>
<text data-label-for="segment:BC" x="328.8" y="117.06" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">sight line</text>
</g>
</svg>
