<svg xmlns="http://www.w3.org/2000/svg" width="600" height="326" viewBox="0 0 600 326" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Right-angled triangle</title><desc id="desc">Right-angled triangle with perpendicular sides 5 cm and 12 cm, right angle marked; the hypotenuse is labelled c. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="326" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="120,206 120,56 480,206" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="120" y1="206" x2="120" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="120" y1="206" x2="480" y2="206" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="120" y1="56" x2="480" y2="206" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M120 184 L142 184 L142 206" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="306" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="73.49" y="140.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
<text data-label-for="segment:AC" x="300" y="236.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">12 cm</text>
<text data-label-for="segment:BC" x="309.09" y="118.55" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">c</text>
</g>
</svg>
