<svg xmlns="http://www.w3.org/2000/svg" width="600" height="466" viewBox="0 0 600 466" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Right-angled triangle</title><desc id="desc">Right-angled triangle with the acute angle θ marked. Relative to θ, the opposite side is 45 cm and the adjacent side is 28 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="466" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="209.78,346 209.78,56 390.22,346" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="209.78" y1="346" x2="209.78" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="209.78" y1="346" x2="390.22" y2="346" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="209.78" y1="56" x2="390.22" y2="346" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M209.78 324 L231.78 324 L231.78 346" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M344.22 346 A46 46 0 0 1 365.92 306.94" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="446" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:C" x="327.83" y="320.7" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">θ</text>
<text data-label-for="segment:AB" x="153.91" y="210.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">45 cm</text>
<text data-label-for="segment:AC" x="300" y="376.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">28 cm</text>
</g>
</svg>
