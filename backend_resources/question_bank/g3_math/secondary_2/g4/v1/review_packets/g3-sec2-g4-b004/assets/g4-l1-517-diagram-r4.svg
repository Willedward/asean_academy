<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="139.38,346 139.38,56 460.62,346" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="139.38" y1="346" x2="139.38" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="139.38" y1="346" x2="460.62" y2="346" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="139.38" y1="56" x2="460.62" y2="346" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M139.38 324 L161.38 324 L161.38 346" fill="none" stroke="#c2620a" stroke-width="3.5"/>
