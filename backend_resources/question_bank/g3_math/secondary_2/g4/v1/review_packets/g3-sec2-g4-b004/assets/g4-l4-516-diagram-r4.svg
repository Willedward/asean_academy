<title id="title">Angle of elevation from eye level</title><desc id="desc">An observer stands 16 m from a vertical tower of height h on level ground. The observer&#x27;s eye is 1.6 m above the ground. A dashed eye-level line meets the tower at a right angle, and the angle of elevation from eye level to the top is 50°. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="470" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="E P Q" points="183.88,326.78 416.12,326.78 416.12,50" fill="#e7f2f0" stroke="none"/>
<line data-segment="FT" x1="183.88" y1="350" x2="416.12" y2="350" stroke="#124e52" stroke-width="5"/>
<line data-segment="TQ" x1="416.12" y1="350" x2="416.12" y2="50" stroke="#124e52" stroke-width="8"/>
<line data-segment="FE" x1="183.88" y1="350" x2="183.88" y2="326.78" stroke="#c2620a" stroke-width="6"/>
<line data-segment="EP" x1="183.88" y1="326.78" x2="416.12" y2="326.78" stroke="#7d9799" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="EQ" x1="183.88" y1="326.78" x2="416.12" y2="50" stroke="#c2620a" stroke-width="5"/>
<circle data-point="E" cx="183.88" cy="326.78" r="6" fill="#c2620a"/>
<path data-right-angle-marker="P" d="M398.12 326.78 L398.12 308.78 L416.12 308.78" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-E" d="M229.88 326.78 A46 46 0 0 0 213.45 291.54" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="450" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:E" x="270.41" y="295.79" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">50°</text>
<text data-label-for="segment:FT" x="300" y="380.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">16 m</text>
