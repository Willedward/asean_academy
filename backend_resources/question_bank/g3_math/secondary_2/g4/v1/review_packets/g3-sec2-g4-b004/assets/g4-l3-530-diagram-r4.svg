<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Right-angled triangle</title><desc id="desc">Right-angled triangle with the acute angle θ marked. Relative to θ, the opposite side is 9 cm and the adjacent side is 40 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="120,137 120,56 480,137" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="120" y1="137" x2="120" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="120" y1="137" x2="480" y2="137" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="120" y1="56" x2="480" y2="137" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M120 115 L142 115 L142 137" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M371.2 137 A108.8 108.8 0 0 1 373.85 113.12" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:C" x="282.04" y="124.36" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">θ</text>
<text data-label-for="segment:AB" x="73.49" y="105.86" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">9 cm</text>
<text data-label-for="segment:AC" x="300" y="167.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">40 cm</text>
</g>
</svg>
