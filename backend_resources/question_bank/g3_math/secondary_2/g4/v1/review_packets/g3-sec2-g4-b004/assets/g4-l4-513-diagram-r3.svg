<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Cable from a vertical post</title><desc id="desc">Vertical post 28 m high with a cable c from its top to an anchor 45 m from its base, right angle marked at the base. A further 2 m of cable is shown beyond the anchor for fastening. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="390" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="110,259.83 110,56 437.59,259.83" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="110" y1="259.83" x2="110" y2="56" stroke="#124e52" stroke-width="8"/>
<line data-segment="AC" x1="110" y1="259.83" x2="437.59" y2="259.83" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="110" y1="56" x2="437.59" y2="259.83" stroke="#c2620a" stroke-width="5"/>
<line data-segment="CE" x1="437.59" y1="259.83" x2="490" y2="259.83" stroke="#c2620a" stroke-width="5" stroke-dasharray="10 8"/>
<circle data-point="C" cx="437.59" cy="259.83" r="7" fill="#124e52"/>
<path data-right-angle-marker="A" d="M110 237.83 L132 237.83 L132 259.83" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="370" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="62.06" y="167.28" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">28 m</text>
<text data-label-for="segment:AC" x="273.79" y="290.61" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">45 m</text>
<text data-label-for="segment:BC" x="286.45" y="146.93" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">c</text>
<text data-label-for="segment:CE" x="463.79" y="296.61" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">+2 m</text>
</g>
</svg>
