<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="110,230.45 216.06,60 490,230.45" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="110" y1="230.45" x2="216.06" y2="60" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="110" y1="230.45" x2="490" y2="230.45" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="216.06" y1="60" x2="490" y2="230.45" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
