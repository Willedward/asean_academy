<text data-label-for="segment:AB" x="122.23" y="129.2" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">28 m</text>
<text data-label-for="segment:BC" x="373.92" y="121" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">45 m</text>
<text data-label-for="segment:AC" x="300" y="261.23" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">x</text>
<text x="300" y="308.93" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">perimeter 126 m</text>
