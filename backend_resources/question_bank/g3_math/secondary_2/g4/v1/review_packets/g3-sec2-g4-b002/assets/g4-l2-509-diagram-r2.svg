<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Right-angled triangle</title><desc id="desc">Right-angled triangle with hypotenuse 37 m and one perpendicular side 12 m, right angle marked; the other perpendicular side is labelled b. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="120,179.43 120,56 480,179.43" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="120" y1="179.43" x2="120" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="120" y1="179.43" x2="480" y2="179.43" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="120" y1="56" x2="480" y2="179.43" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M120 157.43 L142 157.43 L142 179.43" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="72.06" y="127.08" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">12 m</text>
<text data-label-for="segment:AC" x="300" y="210.21" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">b</text>
<text data-label-for="segment:BC" x="310.69" y="95.88" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">37 m</text>
</g>
</svg>
