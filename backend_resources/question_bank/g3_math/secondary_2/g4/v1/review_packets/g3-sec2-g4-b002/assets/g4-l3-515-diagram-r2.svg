<svg xmlns="http://www.w3.org/2000/svg" width="600" height="466" viewBox="0 0 600 466" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Right-angled triangle</title><desc id="desc">Right-angled triangle with the acute angle θ marked. Relative to θ, the opposite side is 40 cm and the adjacent side is 42 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="466" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="147.75,346 147.75,56 452.25,346" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="147.75" y1="346" x2="147.75" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="147.75" y1="346" x2="452.25" y2="346" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="147.75" y1="56" x2="452.25" y2="346" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M147.75 324 L169.75 324 L169.75 346" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M406.25 346 A46 46 0 0 1 418.94 314.28" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="446" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:C" x="386.68" y="329.13" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">θ</text>
<text data-label-for="segment:AB" x="91.88" y="210.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">40 cm</text>
<text data-label-for="segment:AC" x="300" y="376.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">42 cm</text>
</g>
</svg>
