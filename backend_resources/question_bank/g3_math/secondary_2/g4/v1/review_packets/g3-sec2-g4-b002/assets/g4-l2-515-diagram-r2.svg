<svg xmlns="http://www.w3.org/2000/svg" width="600" height="466" viewBox="0 0 600 466" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Sight line and vertical height</title><desc id="desc">Right-angled triangle on level ground. The sight line makes 55° with the ground, the horizontal distance is 17 m and the vertical height is labelled x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="466" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="198.47,346 198.47,56 401.53,346" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="198.47" y1="346" x2="198.47" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="198.47" y1="346" x2="401.53" y2="346" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="198.47" y1="56" x2="401.53" y2="346" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M198.47 324 L220.47 324 L220.47 346" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M355.53 346 A46 46 0 0 1 375.15 308.32" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="446" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:C" x="324.03" y="315.02" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">55°</text>
<text data-label-for="segment:AB" x="179.26" y="210.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">x</text>
<text data-label-for="segment:AC" x="300" y="376.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">17 m</text>
<text data-label-for="segment:BC" x="362.63" y="164.16" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">sight line</text>
</g>
</svg>
