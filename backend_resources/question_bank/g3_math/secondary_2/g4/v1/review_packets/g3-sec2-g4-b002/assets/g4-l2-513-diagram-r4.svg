<svg xmlns="http://www.w3.org/2000/svg" width="600" height="466" viewBox="0 0 600 466" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Sight line and vertical height</title><desc id="desc">Right-angled triangle on level ground. The sight line makes 65° with the ground, the horizontal distance is 9 m and the vertical height is labelled x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="466" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="232.39,346 232.39,56 367.61,346" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="232.39" y1="346" x2="232.39" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="232.39" y1="346" x2="367.61" y2="346" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="232.39" y1="56" x2="367.61" y2="346" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M232.39 324 L254.39 324 L254.39 346" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M321.61 346 A46 46 0 0 1 348.17 304.31" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="446" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:C" x="294.23" y="308.61" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">65°</text>
<text data-label-for="segment:AB" x="213.18" y="210.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">x</text>
<text data-label-for="segment:AC" x="300" y="376.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">9 m</text>
<text data-label-for="segment:BC" x="373.11" y="173.93" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">sight line</text>
</g>
</svg>
