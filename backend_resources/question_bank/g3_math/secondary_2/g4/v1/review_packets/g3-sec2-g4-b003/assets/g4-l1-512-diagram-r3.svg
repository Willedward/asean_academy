<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="126.99,346 126.99,56 473.01,346" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="126.99" y1="346" x2="126.99" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="126.99" y1="346" x2="473.01" y2="346" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="126.99" y1="56" x2="473.01" y2="346" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M126.99 324 L148.99 324 L148.99 346" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
