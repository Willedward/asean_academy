<title id="title">Angle of elevation from eye level</title><desc id="desc">An observer stands 18 m from a vertical tower of height h on level ground. The observer&#x27;s eye is 1.6 m above the ground. A dashed eye-level line meets the tower at a right angle, and the angle of elevation from eye level to the top is 60°. Not drawn to scale.</desc>
