<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Route across a rectangular floor</title><desc id="desc">Rectangular floor 70 m by 24 m. The route crosses the floor along the diagonal d, then continues 30 m along a straight corridor. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="rectangle" data-points="A C D B" points="65,172.8 394,172.8 394,60 65,60" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="65" y1="172.8" x2="65" y2="60" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="65" y1="172.8" x2="394" y2="172.8" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="394" y1="172.8" x2="394" y2="60" stroke="#124e52" stroke-width="5"/>
<line data-segment="BD" x1="65" y1="60" x2="394" y2="60" stroke="#124e52" stroke-width="5"/>
<line data-segment="AD" x1="65" y1="172.8" x2="394" y2="60" stroke="#c2620a" stroke-width="5"/>
<line data-segment="DE" x1="394" y1="60" x2="535" y2="60" stroke="#c2620a" stroke-width="5"/>
<path data-right-angle-marker="C" d="M372 172.8 L372 150.8 L394 150.8" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<circle data-point="A" cx="65" cy="172.8" r="6" fill="#c2620a"/>
<circle data-point="E" cx="535" cy="60" r="6" fill="#c2620a"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AC" x="229.5" y="203.58" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">70 m</text>
<text data-label-for="segment:CD" x="441.94" y="125.76" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">24 m</text>
<text data-label-for="segment:AD" x="221.73" y="103.1" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">d</text>
<text data-label-for="segment:DE" x="464.5" y="47.94" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">30 m</text>
</g>
</svg>
