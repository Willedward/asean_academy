<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Right-angled triangle</title><desc id="desc">Right-angled triangle with hypotenuse 53 m and one perpendicular side 28 m, right angle marked; the other perpendicular side is labelled b. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="400" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="120,280 120,56 480,280" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="120" y1="280" x2="120" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="120" y1="280" x2="480" y2="280" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="120" y1="56" x2="480" y2="280" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M120 258 L142 258 L142 280" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="380" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="72.06" y="177.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">28 m</text>
<text data-label-for="segment:AC" x="300" y="310.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">b</text>
<text data-label-for="segment:BC" x="320.9" y="143.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">53 m</text>
</g>
</svg>
