<line data-segment="AB" x1="110" y1="186.29" x2="110" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="110" y1="186.29" x2="490" y2="186.29" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="490" y1="186.29" x2="490" y2="56" stroke="#124e52" stroke-width="5"/>
