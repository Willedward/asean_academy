<title id="title">Rectangle and diagonal</title><desc id="desc">Rectangle 30 m by 16 m with a cable along the diagonal from one corner to the opposite corner, labelled d. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="379" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="rectangle" data-points="A C D B" points="110,258.67 490,258.67 490,56 110,56" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="110" y1="258.67" x2="110" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="110" y1="258.67" x2="490" y2="258.67" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="490" y1="258.67" x2="490" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="BD" x1="110" y1="56" x2="490" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="110" y1="56" x2="490" y2="258.67" stroke="#c2620a" stroke-width="5"/>
<path data-right-angle-marker="A" d="M110 236.67 L132 236.67 L132 258.67" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
