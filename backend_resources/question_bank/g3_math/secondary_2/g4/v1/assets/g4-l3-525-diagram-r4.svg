<text data-label-for="segment:AC" x="300" y="289.45" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">30 m</text>
<text data-label-for="segment:BC" x="311.61" y="144.93" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">d</text>
