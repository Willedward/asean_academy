<svg xmlns="http://www.w3.org/2000/svg" width="600" height="404" viewBox="0 0 600 404" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Angle of elevation from eye level</title><desc id="desc">An observer stands 20 m from a vertical tower of height h on level ground. The observer&#x27;s eye is 1.6 m above the ground. A dashed eye-level line meets the tower at a right angle, and the angle of elevation from eye level to the top is 35°. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="404" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="E P Q" points="150,260.06 450,260.06 450,50" fill="#e7f2f0" stroke="none"/>
<line data-segment="FT" x1="150" y1="284.06" x2="450" y2="284.06" stroke="#124e52" stroke-width="5"/>
<line data-segment="TQ" x1="450" y1="284.06" x2="450" y2="50" stroke="#124e52" stroke-width="8"/>
<line data-segment="FE" x1="150" y1="284.06" x2="150" y2="260.06" stroke="#c2620a" stroke-width="6"/>
<line data-segment="EP" x1="150" y1="260.06" x2="450" y2="260.06" stroke="#7d9799" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="EQ" x1="150" y1="260.06" x2="450" y2="50" stroke="#c2620a" stroke-width="5"/>
<circle data-point="E" cx="150" cy="260.06" r="6" fill="#c2620a"/>
<path data-right-angle-marker="P" d="M432 260.06 L432 242.06 L450 242.06" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-E" d="M196 260.06 A46 46 0 0 0 187.68 233.68" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="384" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:E" x="263.92" y="233.5" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">35°</text>
<text data-label-for="segment:FT" x="300" y="314.84" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">20 m</text>
<text data-label-for="segment:FE" x="90.86" y="281.42" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">1.6 m</text>
<text data-label-for="segment:TQ" x="470.12" y="176.39" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">h</text>
</g>
</svg>
