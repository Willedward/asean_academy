<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Rectangle and diagonal</title><desc id="desc">Rectangle 112 m by 15 m with a cable along the diagonal from one corner to the opposite corner, labelled d. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="rectangle" data-points="A C D B" points="110,140.44 490,140.44 490,56 110,56" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="110" y1="140.44" x2="110" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="110" y1="140.44" x2="490" y2="140.44" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="490" y1="140.44" x2="490" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="BD" x1="110" y1="56" x2="490" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="110" y1="56" x2="490" y2="140.44" stroke="#c2620a" stroke-width="5"/>
<path data-right-angle-marker="A" d="M110 118.44 L132 118.44 L132 140.44" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="62.06" y="107.58" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">15 m</text>
<text data-label-for="segment:AC" x="300" y="171.22" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">112 m</text>
<text data-label-for="segment:BC" x="335.44" y="91.64" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">d</text>
</g>
</svg>
