<text data-role="note" x="578" y="450" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:E" x="267.61" y="302.46" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">50°</text>
