<line data-segment="FT" x1="181.08" y1="350" x2="418.92" y2="350" stroke="#124e52" stroke-width="5"/>
<line data-segment="TQ" x1="418.92" y1="350" x2="418.92" y2="50" stroke="#124e52" stroke-width="8"/>
<line data-segment="FE" x1="181.08" y1="350" x2="181.08" y2="333.45" stroke="#c2620a" stroke-width="6"/>
<line data-segment="EP" x1="181.08" y1="333.45" x2="418.92" y2="333.45" stroke="#7d9799" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="EQ" x1="181.08" y1="333.45" x2="418.92" y2="50" stroke="#c2620a" stroke-width="5"/>
<circle data-point="E" cx="181.08" cy="333.45" r="6" fill="#c2620a"/>
<path data-right-angle-marker="P" d="M400.92 333.45 L400.92 315.45 L418.92 315.45" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-E" d="M227.08 333.45 A46 46 0 0 0 210.65 298.21" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
