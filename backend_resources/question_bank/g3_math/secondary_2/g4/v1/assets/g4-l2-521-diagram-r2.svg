<svg xmlns="http://www.w3.org/2000/svg" width="600" height="428" viewBox="0 0 600 428" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Sight line and vertical height</title><desc id="desc">Right-angled triangle on level ground. The sight line makes 35° with the ground, the horizontal distance is 17 m and the vertical height is labelled x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="428" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="120,308.07 120,56 480,308.07" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="120" y1="308.07" x2="120" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="120" y1="308.07" x2="480" y2="308.07" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="120" y1="56" x2="480" y2="308.07" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M120 286.07 L142 286.07 L142 308.07" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M434 308.07 A46 46 0 0 1 442.32 281.69" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="408" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:C" x="366.08" y="281.51" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">35°</text>
<text data-label-for="segment:AB" x="100.79" y="191.4" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">x</text>
<text data-label-for="segment:AC" x="300" y="338.85" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">17 m</text>
<text data-label-for="segment:BC" x="335.69" y="138.08" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">sight line</text>
</g>
</svg>
