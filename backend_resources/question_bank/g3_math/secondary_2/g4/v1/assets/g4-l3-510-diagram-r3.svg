<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="rectangle" data-points="A C D B" points="110,292.44 490,292.44 490,56 110,56" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="110" y1="292.44" x2="110" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="110" y1="292.44" x2="490" y2="292.44" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="490" y1="292.44" x2="490" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="BD" x1="110" y1="56" x2="490" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="110" y1="56" x2="490" y2="292.44" stroke="#c2620a" stroke-width="5"/>
<path data-right-angle-marker="A" d="M110 270.44 L132 270.44 L132 292.44" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
