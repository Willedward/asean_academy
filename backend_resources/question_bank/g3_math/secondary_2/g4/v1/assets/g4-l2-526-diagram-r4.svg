<svg xmlns="http://www.w3.org/2000/svg" width="600" height="466" viewBox="0 0 600 466" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Right-angled triangle</title><desc id="desc">Right-angled triangle with hypotenuse 73 m and one perpendicular side 48 m, right angle marked; the other perpendicular side is labelled b. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="466" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="133.85,346 133.85,56 466.15,346" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="133.85" y1="346" x2="133.85" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="133.85" y1="346" x2="466.15" y2="346" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="133.85" y1="56" x2="466.15" y2="346" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M133.85 324 L155.85 324 L155.85 346" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="446" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="85.91" y="210.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">48 m</text>
<text data-label-for="segment:AC" x="300" y="376.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">b</text>
<text data-label-for="segment:BC" x="328.5" y="177.7" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">73 m</text>
</g>
</svg>
