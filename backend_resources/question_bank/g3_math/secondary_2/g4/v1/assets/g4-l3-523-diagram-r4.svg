<svg xmlns="http://www.w3.org/2000/svg" width="600" height="388" viewBox="0 0 600 388" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Right-angled triangle</title><desc id="desc">Right-angled triangle with the acute angle θ marked. Relative to θ, the opposite side is 33 cm and the adjacent side is 56 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="388" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="120,268.14 120,56 480,268.14" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="120" y1="268.14" x2="120" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="120" y1="268.14" x2="480" y2="268.14" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="120" y1="56" x2="480" y2="268.14" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M120 246.14 L142 246.14 L142 268.14" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M434 268.14 A46 46 0 0 1 440.37 244.79" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="368" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:C" x="395.31" y="254.4" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">θ</text>
<text data-label-for="segment:AB" x="64.13" y="171.43" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">33 cm</text>
<text data-label-for="segment:AC" x="300" y="298.92" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">56 cm</text>
</g>
</svg>
