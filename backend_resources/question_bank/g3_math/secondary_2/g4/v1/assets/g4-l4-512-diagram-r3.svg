<svg xmlns="http://www.w3.org/2000/svg" width="600" height="368" viewBox="0 0 600 368" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Angle of elevation from eye level</title><desc id="desc">An observer stands 19 m from a vertical tower of height h on level ground. The observer&#x27;s eye is 1.6 m above the ground. A dashed eye-level line meets the tower at a right angle, and the angle of elevation from eye level to the top is 30°. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="368" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="E P Q" points="150,223.21 450,223.21 450,50" fill="#e7f2f0" stroke="none"/>
<line data-segment="FT" x1="150" y1="248.47" x2="450" y2="248.47" stroke="#124e52" stroke-width="5"/>
<line data-segment="TQ" x1="450" y1="248.47" x2="450" y2="50" stroke="#124e52" stroke-width="8"/>
<line data-segment="FE" x1="150" y1="248.47" x2="150" y2="223.21" stroke="#c2620a" stroke-width="6"/>
<line data-segment="EP" x1="150" y1="223.21" x2="450" y2="223.21" stroke="#7d9799" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="EQ" x1="150" y1="223.21" x2="450" y2="50" stroke="#c2620a" stroke-width="5"/>
<circle data-point="E" cx="150" cy="223.21" r="6" fill="#c2620a"/>
<path data-right-angle-marker="P" d="M432 223.21 L432 205.21 L450 205.21" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-E" d="M196 223.21 A46 46 0 0 0 189.84 200.21" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="348" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:E" x="280.71" y="197.55" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">30°</text>
<text data-label-for="segment:FT" x="300" y="279.25" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">19 m</text>
<text data-label-for="segment:FE" x="90.86" y="245.2" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">1.6 m</text>
<text data-label-for="segment:TQ" x="470.12" y="158.6" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">h</text>
</g>
</svg>
