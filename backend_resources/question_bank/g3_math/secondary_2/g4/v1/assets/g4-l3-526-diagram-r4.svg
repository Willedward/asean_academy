<line data-segment="AB" x1="110" y1="306.55" x2="110" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="110" y1="306.55" x2="490" y2="306.55" stroke="#124e52" stroke-width="5"/>
