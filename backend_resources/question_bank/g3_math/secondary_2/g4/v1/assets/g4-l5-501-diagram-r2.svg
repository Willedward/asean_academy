<line data-segment="AB" x1="110" y1="242.4" x2="246.8" y2="60" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="110" y1="242.4" x2="490" y2="242.4" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="246.8" y1="60" x2="490" y2="242.4" stroke="#124e52" stroke-width="5"/>
</g>
