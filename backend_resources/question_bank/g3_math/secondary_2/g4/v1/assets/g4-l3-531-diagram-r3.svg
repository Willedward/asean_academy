<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Right-angled triangle</title><desc id="desc">Right-angled triangle with the acute angle θ marked. Relative to θ, the opposite side is 16 cm and the adjacent side is 63 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="120,147.43 120,56 480,147.43" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="120" y1="147.43" x2="120" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="120" y1="147.43" x2="480" y2="147.43" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="120" y1="56" x2="480" y2="147.43" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M120 125.43 L142 125.43 L142 147.43" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M383.2 147.43 A96.8 96.8 0 0 1 386.18 123.6" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:C" x="294.13" y="133.56" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">θ</text>
<text data-label-for="segment:AB" x="64.13" y="111.08" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">16 cm</text>
<text data-label-for="segment:AC" x="300" y="178.21" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">63 cm</text>
</g>
</svg>
