<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Angles of elevation from two points</title><desc id="desc">A vertical mast of height h stands on level ground. Two observation points on the same line as the mast are 20 m apart; the nearer point is x from the mast. The angle of elevation of the top is 35° from the farther point and 50° from the nearer point. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="460" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="F T Q" points="100.06,330 499.94,330 499.94,50" fill="#e7f2f0" stroke="none"/>
<line data-segment="FN" x1="100.06" y1="330" x2="264.99" y2="330" stroke="#124e52" stroke-width="5"/>
<line data-segment="NT" x1="264.99" y1="330" x2="499.94" y2="330" stroke="#124e52" stroke-width="5"/>
<line data-segment="TQ" x1="499.94" y1="330" x2="499.94" y2="50" stroke="#124e52" stroke-width="8"/>
<line data-segment="FQ" x1="100.06" y1="330" x2="499.94" y2="50" stroke="#c2620a" stroke-width="5"/>
<line data-segment="NQ" x1="264.99" y1="330" x2="499.94" y2="50" stroke="#c2620a" stroke-width="5"/>
<circle data-point="F" cx="100.06" cy="330" r="6" fill="#124e52"/>
<circle data-point="N" cx="264.99" cy="330" r="6" fill="#124e52"/>
<path data-right-angle-marker="T" d="M481.94 330 L481.94 312 L499.94 312" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-F" d="M160.06 330 A60 60 0 0 0 149.21 295.59" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-N" d="M310.99 330 A46 46 0 0 0 294.56 294.76" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="440" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:F" x="213.98" y="303.44" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">35°</text>
<text data-label-for="angle:N" x="351.52" y="299.01" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">50°</text>
<text data-label-for="segment:FN" x="182.53" y="360.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">20 m</text>
<text data-label-for="segment:NT" x="382.47" y="360.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">x</text>
<text data-label-for="segment:TQ" x="520.06" y="199.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">h</text>
</g>
</svg>
