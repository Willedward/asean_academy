<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">From raw observations to a frequency table</title>
  <desc id="desc">Eight travel-to-school observations are classified into walk, bicycle and bus, with frequencies three, two and three and a checked total of eight.</desc>
  <rect width="940" height="500" rx="28" fill="#f7fafb"/>
  <style>
    .title{font:700 28px system-ui,sans-serif;fill:#123f43}.label{font:600 21px system-ui,sans-serif;fill:#123f43}
    .text{font:500 20px system-ui,sans-serif;fill:#475569}.cell{fill:#fff;stroke:#b8cacc;stroke-width:2}
    .head{fill:#dff2f0;stroke:#87b7b4;stroke-width:2}.accent{fill:#c97817}.arrow{stroke:#c97817;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <text x="48" y="52" class="title">Classify first, then tally and check the total</text>
  <text x="55" y="112" class="label">Raw observations</text>
  <rect x="50" y="135" width="320" height="215" rx="18" class="cell"/>
  <text x="75" y="180" class="text">walk, bus, bicycle, walk,</text>
  <text x="75" y="220" class="text">bus, walk, bicycle, bus</text>
  <text x="75" y="285" class="text">Every observation belongs to</text>
  <text x="75" y="320" class="text">exactly one category.</text>
  <path d="M395 240h85m-18-18 20 18-20 18" class="arrow"/>
  <text x="535" y="112" class="label">Frequency table</text>
  <rect x="530" y="135" width="170" height="55" class="head"/><rect x="700" y="135" width="170" height="55" class="head"/>
  <text x="570" y="170" class="label">Method</text><text x="730" y="170" class="label">Frequency</text>
  <rect x="530" y="190" width="170" height="52" class="cell"/><rect x="700" y="190" width="170" height="52" class="cell"/>
  <rect x="530" y="242" width="170" height="52" class="cell"/><rect x="700" y="242" width="170" height="52" class="cell"/>
  <rect x="530" y="294" width="170" height="52" class="cell"/><rect x="700" y="294" width="170" height="52" class="cell"/>
  <rect x="530" y="346" width="170" height="52" class="head"/><rect x="700" y="346" width="170" height="52" class="head"/>
  <text x="575" y="224" class="text">Walk</text><text x="775" y="224" class="text">3</text>
  <text x="560" y="276" class="text">Bicycle</text><text x="775" y="276" class="text">2</text>
  <text x="585" y="328" class="text">Bus</text><text x="775" y="328" class="text">3</text>
  <text x="585" y="380" class="label">Total</text><text x="775" y="380" class="label">8</text>
  <circle cx="851" cy="375" r="9" class="accent"/>
  <text x="50" y="450" class="label">Check: 3 + 2 + 3 = 8 observations</text>
</svg>
