<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">A triangular prism with a right-triangle cross-section</title><desc id="desc">A triangular prism. Its front face is a right triangle with perpendicular sides 8 cm and 5 cm, and the right angle is marked. The prism is 9 cm long, and hidden edges are dashed. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="380" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="rear-face" data-points="Ab Bb Cb" points="225.44,202.84 501.98,202.84 225.44,30" fill="#d5e8e4" stroke="none"/>
<polygon data-shape="side-BC" data-points="B C Cb Bb" points="374.56,292.06 98.02,119.22 225.44,30 501.98,202.84" fill="#f1f8f6" stroke="none"/>
<polygon data-shape="cross-section" data-points="A B C" points="98.02,292.06 374.56,292.06 98.02,119.22" fill="#e7f2f0" stroke="none"/>
<line data-segment="AbBb" x1="225.44" y1="202.84" x2="501.98" y2="202.84" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="CbAb" x1="225.44" y1="30" x2="225.44" y2="202.84" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="AAb" x1="98.02" y1="292.06" x2="225.44" y2="202.84" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="BbCb" x1="501.98" y1="202.84" x2="225.44" y2="30" stroke="#124e52" stroke-width="5"/>
<line data-segment="BBb" x1="374.56" y1="292.06" x2="501.98" y2="202.84" stroke="#124e52" stroke-width="5"/>
<line data-segment="CCb" x1="98.02" y1="119.22" x2="225.44" y2="30" stroke="#124e52" stroke-width="5"/>
<line data-segment="AB" x1="98.02" y1="292.06" x2="374.56" y2="292.06" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="374.56" y1="292.06" x2="98.02" y2="119.22" stroke="#124e52" stroke-width="5"/>
<line data-segment="CA" x1="98.02" y1="119.22" x2="98.02" y2="292.06" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M118.02 292.06 L118.02 272.06 L98.02 272.06" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="360" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="236.29" y="322.84" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">8 cm</text>
<text data-label-for="segment:CA" x="51.51" y="215" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
<text data-label-for="segment:BBb" x="461.27" y="289.66" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">9 cm</text>
</g>
