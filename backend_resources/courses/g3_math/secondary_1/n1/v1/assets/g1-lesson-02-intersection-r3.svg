<title id="title">Obtuse and acute angles at two crossing lines</title><desc id="desc">Two straight lines crossing at a point. Each of the two obtuse angles is marked 124°. The two acute angles are marked a and b. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="412" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="WE" x1="125.1" y1="193" x2="474.9" y2="193" stroke="#124e52" stroke-width="5"/>
<line data-segment="QP" x1="202.2" y1="338" x2="397.8" y2="48" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-a" d="M352 193 A52 52 0 0 0 329.08 149.89" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-1" d="M320.13 163.15 A36 36 0 0 0 264 193" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-b" d="M248 193 A52 52 0 0 0 270.92 236.11" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-2" d="M279.87 222.85 A36 36 0 0 0 336 193" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="392" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-a" x="368.13" y="166.13" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">a</text>
<text data-label-for="angle:angle-1" x="267.65" y="141.51" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">124°</text>
<text data-label-for="angle:angle-b" x="231.47" y="238.8" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">b</text>
<text data-label-for="angle:angle-2" x="332.35" y="263.21" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">124°</text>
</g>
</svg>
