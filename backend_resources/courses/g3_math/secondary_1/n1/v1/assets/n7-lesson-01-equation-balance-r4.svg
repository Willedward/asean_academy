<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">A balanced equation</title><desc id="desc">A level balance scale with 2x + 3 on the left pan and 11 on the right pan, representing the equation 2x + 3 = 11.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<path d="M250 284 H350 L330 262 H270 Z" fill="#dcecf6" stroke="#17324d" stroke-width="4" data-role="base"/>
<line x1="300" y1="70" x2="300" y2="262" stroke="#17324d" stroke-width="10" data-role="post"/>
<line data-chart-mark="beam" data-chart-kind="beam" data-value="level" x1="120" y1="70" x2="480" y2="70" stroke="#17324d" stroke-width="9"/>
<line x1="120" y1="70" x2="20" y2="210" stroke="#17324d" stroke-width="3" data-role="string"/>
<line x1="120" y1="70" x2="220" y2="210" stroke="#17324d" stroke-width="3" data-role="string"/>
<path data-chart-mark="pan-left" data-chart-kind="pan" data-value="2x + 3" d="M12 210 Q120 280 228 210 Z" fill="#dcecf6" stroke="#17324d" stroke-width="4"/>
<line x1="480" y1="70" x2="380" y2="210" stroke="#17324d" stroke-width="3" data-role="string"/>
<line x1="480" y1="70" x2="580" y2="210" stroke="#17324d" stroke-width="3" data-role="string"/>
<path data-chart-mark="pan-right" data-chart-kind="pan" data-value="11" d="M372 210 Q480 280 588 210 Z" fill="#dcecf6" stroke="#17324d" stroke-width="4"/>
<circle data-role="pivot" cx="300" cy="70" r="13" fill="#e36b45" stroke="#17324d" stroke-width="4"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="120" y="200" font-size="32" font-weight="700" text-anchor="middle" fill="#e36b45" data-label-for="pan-left">2x + 3</text>
<text x="480" y="200" font-size="32" font-weight="700" text-anchor="middle" fill="#e36b45" data-label-for="pan-right">11</text>
</g>
</svg>
