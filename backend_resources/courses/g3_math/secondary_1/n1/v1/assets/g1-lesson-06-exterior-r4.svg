<title id="title">A regular hexagon with one exterior angle</title><desc id="desc">A regular polygon, a hexagon, with all six sides marked equal by tick marks. Lines from one vertex divide it into four triangles. One side is extended beyond a vertex, and the exterior angle between the extension and the next side is marked e. Not drawn to scale.</desc>
