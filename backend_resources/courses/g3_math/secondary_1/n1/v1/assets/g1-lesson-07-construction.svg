<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="title desc">
<title id="title">Constructing simple geometrical figures</title><desc id="desc">A line segment AB with intersecting compass arcs locating C, together with a perpendicular-bisector construction.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs>
<rect width="940" height="390" rx="24" fill="#f8fafc"/><text x="36" y="38" class="heading">Constructing simple geometrical figures</text>
<g fill="none" stroke="#0f3d40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M110 245 H430 M270 55 V310"/><circle class="faint" cx="110" cy="245" r="205"/><circle class="faint" cx="430" cy="245" r="205"/><circle cx="110" cy="245" r="5"/><circle cx="430" cy="245" r="5"/><text x="95" y="275">A</text><text x="430" y="275">B</text><path d="M610 245 L780 245 L690 95 Z"/><path class="faint" d="M610 245 A170 170 0 0 1 690 95 M780 245 A170 170 0 0 0 690 95"/><text x="680" y="80">C</text></g>
<style>.heading{font:700 22px system-ui;fill:#0f3d40} text{font:600 17px system-ui;fill:#334155;stroke:none} .arc{stroke:#c87a1e} .mark{stroke:#c87a1e} .faint{stroke:#94a3b8;stroke-width:2} .dash{stroke:#c87a1e;stroke-dasharray:8 8} .arrow{stroke:#0f766e;marker-end:url(#arrow)} .grid{stroke:#dbe4e6;stroke-width:1}</style>
</svg>