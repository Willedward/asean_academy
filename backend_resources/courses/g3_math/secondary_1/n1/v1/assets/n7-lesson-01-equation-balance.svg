<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="title desc">
  <title id="title">A balanced equation</title>
  <desc id="desc">A level balance scale with 2x plus 3 on the left pan and 11 on the right pan, illustrating the equation 2x plus 3 equals 11.</desc>
  <rect width="940" height="460" rx="28" fill="#f6f8fb"/>
  <text x="470" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#123f42">An equation is a balance</text>
  <line x1="470" y1="130" x2="470" y2="365" stroke="#123f42" stroke-width="12" stroke-linecap="round"/>
  <path d="M390 380 H550 L520 350 H420 Z" fill="#d9e7e6" stroke="#123f42" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="470" cy="150" r="18" fill="#ce7818" stroke="#123f42" stroke-width="5"/>
  <line x1="220" y1="150" x2="720" y2="150" stroke="#123f42" stroke-width="10" stroke-linecap="round"/>
  <line x1="260" y1="150" x2="205" y2="270" stroke="#123f42" stroke-width="5"/>
  <line x1="680" y1="150" x2="735" y2="270" stroke="#123f42" stroke-width="5"/>
  <line x1="205" y1="270" x2="315" y2="270" stroke="#123f42" stroke-width="6" stroke-linecap="round"/>
  <line x1="625" y1="270" x2="735" y2="270" stroke="#123f42" stroke-width="6" stroke-linecap="round"/>
  <path d="M175 270 Q260 360 345 270" fill="#eaf3f2" stroke="#123f42" stroke-width="5"/>
  <path d="M595 270 Q680 360 765 270" fill="#eaf3f2" stroke="#123f42" stroke-width="5"/>
  <text x="260" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ce7818">2x + 3</text>
  <text x="680" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ce7818">11</text>
  <text x="470" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#34465d">Do the same valid operation to both sides to keep the beam level.</text>
</svg>
