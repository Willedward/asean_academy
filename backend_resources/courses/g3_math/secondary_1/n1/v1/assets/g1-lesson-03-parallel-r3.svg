<svg xmlns="http://www.w3.org/2000/svg" width="600" height="369" viewBox="0 0 600 369" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Corresponding angles at parallel lines</title><desc id="desc">Two parallel horizontal lines, shown with arrow marks, cut by one transversal. At the upper line, the angle above the line and to the right of the transversal is marked 68°. At the lower line, the angle in the same position is marked x. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="369" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line data-segment="L1L2" x1="65" y1="81.79" x2="535" y2="81.79" stroke="#124e52" stroke-width="5"/>
<line data-segment="M1M2" x1="65" y1="243.63" x2="535" y2="243.63" stroke="#124e52" stroke-width="5"/>
<line data-segment="T1T2" x1="230.2" y1="295.42" x2="337.43" y2="30" stroke="#124e52" stroke-width="5"/>
<path data-parallel-mark="L1L2" d="M100 90.79 L112 81.79 L100 72.79" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-parallel-mark="M1M2" d="M100 252.63 L112 243.63 L100 234.63" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-angle-marker="angle-given" d="M362.51 81.79 A46 46 0 0 0 333.74 39.14" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-x" d="M297.12 243.63 A46 46 0 0 0 268.35 200.98" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="349" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:angle-given" x="388.51" y="42.58" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">68°</text>
<text data-label-for="angle:angle-x" x="310.25" y="213.1" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">x</text>
</g>
</svg>
