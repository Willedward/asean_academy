<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="title desc">
<title id="title">Right, acute, obtuse and reflex angles</title><desc id="desc">Four labelled examples showing an acute angle, a right angle, an obtuse angle and a reflex angle.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs>
<rect width="940" height="390" rx="24" fill="#f8fafc"/><text x="36" y="38" class="heading">Right, acute, obtuse and reflex angles</text>
<g fill="none" stroke="#0f3d40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M100 230 L100 105 M100 230 L225 185 M310 230 L310 105 M310 230 L435 230"/><path d="M520 230 L520 105 M520 230 L635 175 M730 230 L730 105 M730 230 L835 185"/><path class="arc" d="M100 190 A40 40 0 0 1 138 216 M310 190 A40 40 0 0 1 350 230 M520 188 A42 42 0 0 1 558 212 M730 188 A42 42 0 1 0 770 217"/><text x="82" y="280">acute</text><text x="280" y="280">right</text><text x="490" y="280">obtuse</text><text x="700" y="280">reflex</text></g>
<style>.heading{font:700 22px system-ui;fill:#0f3d40} text{font:600 17px system-ui;fill:#334155;stroke:none} .arc{stroke:#c87a1e} .mark{stroke:#c87a1e} .faint{stroke:#94a3b8;stroke-width:2} .dash{stroke:#c87a1e;stroke-dasharray:8 8} .arrow{stroke:#0f766e;marker-end:url(#arrow)} .grid{stroke:#dbe4e6;stroke-width:1}</style>
</svg>