<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">The same values on truncated and zero-based axes</title>
  <desc id="desc">Values 92 and 98 appear four times as tall above a baseline of 90, but are only slightly different when bars begin at zero.</desc>
  <rect width="940" height="500" rx="28" fill="#f7fafb"/>
  <style>
    .title{font:700 28px system-ui,sans-serif;fill:#123f43}.label{font:600 19px system-ui,sans-serif;fill:#123f43}.small{font:500 17px system-ui,sans-serif;fill:#475569}
    .axis{stroke:#123f43;stroke-width:3}.grid{stroke:#d8e3e5;stroke-width:1}.bar1{fill:#87b7b4}.bar2{fill:#c97817}.warn{font:700 18px system-ui,sans-serif;fill:#b45309}
  </style>
  <text x="48" y="52" class="title">Axis baselines change the visual impression</text>
  <text x="95" y="96" class="label">Truncated at 90</text><text x="565" y="96" class="label">Zero-based scale</text>
  <line x1="90" y1="390" x2="390" y2="390" class="axis"/><line x1="90" y1="390" x2="90" y2="135" class="axis"/>
  <line x1="90" y1="330" x2="390" y2="330" class="grid"/><line x1="90" y1="270" x2="390" y2="270" class="grid"/><line x1="90" y1="210" x2="390" y2="210" class="grid"/><line x1="90" y1="150" x2="390" y2="150" class="grid"/>
  <text x="52" y="396" class="small">90</text><text x="52" y="336" class="small">92</text><text x="52" y="276" class="small">94</text><text x="52" y="216" class="small">96</text><text x="52" y="156" class="small">98</text>
  <rect x="145" y="330" width="72" height="60" rx="5" class="bar1"/><rect x="265" y="150" width="72" height="240" rx="5" class="bar2"/>
  <text x="165" y="320" class="label">92</text><text x="285" y="140" class="label">98</text><text x="120" y="438" class="warn">Displayed heights: 2 and 8</text>
  <line x1="545" y1="390" x2="865" y2="390" class="axis"/><line x1="545" y1="390" x2="545" y2="135" class="axis"/>
  <line x1="545" y1="270" x2="865" y2="270" class="grid"/><line x1="545" y1="150" x2="865" y2="150" class="grid"/>
  <text x="518" y="396" class="small">0</text><text x="505" y="276" class="small">50</text><text x="497" y="156" class="small">100</text>
  <rect x="610" y="169" width="72" height="221" rx="5" class="bar1"/><rect x="745" y="155" width="72" height="235" rx="5" class="bar2"/>
  <text x="630" y="159" class="label">92</text><text x="765" y="145" class="label">98</text><text x="585" y="438" class="small">Actual values differ by 6.</text>
  <text x="50" y="478" class="small">Always inspect the baseline and tick intervals before judging the size of a difference.</text>
</svg>
