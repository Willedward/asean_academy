<title id="title">Compass arcs meeting on both sides of a segment</title><desc id="desc">Segment AB marked 7 cm. Compass arcs centred at A and B meet at C above the segment and at C′ below it. Triangle ABC has AC marked 5 cm and BC marked 8 cm. Triangle ABC′, the mirror image in AB, is dashed. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="462" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="179.77,218 420.23,218 204.3,48" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="179.77" y1="218" x2="420.23" y2="218" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="179.77" y1="218" x2="204.3" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="420.23" y1="218" x2="204.3" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="AD" x1="179.77" y1="218" x2="204.3" y2="388" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="BD" x1="420.23" y1="218" x2="204.3" y2="388" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-arc="arc-a-1" d="M162.44 47.12 A171.76 171.76 0 0 1 244.7 58.98" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-a-2" d="M244.7 377.02 A171.76 171.76 0 0 1 162.44 388.88" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-b-1" d="M169.59 105.29 A274.82 274.82 0 0 1 251.84 0.81" fill="none" stroke="#7d9799" stroke-width="3"/>
<path data-arc="arc-b-2" d="M251.84 435.19 A274.82 274.82 0 0 1 169.59 330.71" fill="none" stroke="#7d9799" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="442" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="point:A" x="159.37" y="227.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">A</text>
