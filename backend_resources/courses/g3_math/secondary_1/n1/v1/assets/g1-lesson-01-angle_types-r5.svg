<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-labelledby="title desc" data-renderer="nextscholar-plane-geometry-svg-v1">
<title id="title">Acute, right, obtuse and reflex angles</title><desc id="desc">Four angles drawn to size, each between two rays from one point: an acute angle of 60°, a right angle of 90° with a corner mark, an obtuse angle of 120° and a reflex angle of 240°, measured the long way round.</desc>
<rect data-role="background" width="600" height="560" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<g data-angle-kind="acute" data-angle-degrees="60">
<line data-segment="VacuteHacute" x1="75" y1="205" x2="225" y2="205" stroke="#124e52" stroke-width="5"/>
<line data-segment="VacuteRacute" x1="75" y1="205" x2="150" y2="75.1" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-acute" d="M119 205 A44 44 0 0 0 97 166.9" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-angle-kind="right" data-angle-degrees="90">
<line data-segment="VrightHright" x1="375" y1="205" x2="525" y2="205" stroke="#124e52" stroke-width="5"/>
<line data-segment="VrightRright" x1="375" y1="205" x2="375" y2="55" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="Vright" d="M399 205 L399 181 L375 181" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-angle-kind="obtuse" data-angle-degrees="120">
<line data-segment="VobtuseHobtuse" x1="205" y1="455" x2="355" y2="455" stroke="#124e52" stroke-width="5"/>
<line data-segment="VobtuseRobtuse" x1="205" y1="455" x2="130" y2="325.1" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-obtuse" d="M249 455 A44 44 0 0 0 183 416.9" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-angle-kind="reflex" data-angle-degrees="240">
<line data-segment="VreflexHreflex" x1="440" y1="400" x2="560" y2="400" stroke="#124e52" stroke-width="5"/>
<line data-segment="VreflexRreflex" x1="440" y1="400" x2="380" y2="503.92" stroke="#124e52" stroke-width="5"/>
<path data-angle-marker="angle-reflex" d="M474 400 A34 34 0 1 0 423 429.44" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-label-for="angle:angle-acute" x="148.8" y="171.75" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">60°</text>
<text x="433" y="160.36" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">90°</text>
<text data-label-for="angle:angle-obtuse" x="243.93" y="396.94" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">120°</text>
<text data-label-for="angle:angle-reflex" x="406.07" y="350.6" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">240°</text>
<text x="150" y="258" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">acute</text>
<text x="450" y="258" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">right</text>
<text x="205" y="536" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">obtuse</text>
<text x="510" y="536" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">reflex</text>
</g>
</svg>
