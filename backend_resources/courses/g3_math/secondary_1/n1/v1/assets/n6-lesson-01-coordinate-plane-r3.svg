<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Reflection of a point in the y-axis</title><desc id="desc">Coordinate plane showing A at negative four comma three and its reflection A prime at four comma three.</desc>
  <rect width="940" height="500" rx="28" fill="#f7fafb"/>
  <style>
    .axis{stroke:#123f43;stroke-width:3}.grid{stroke:#d8e3e5;stroke-width:1}
    .line{stroke:#087f7b;stroke-width:5;fill:none;stroke-linecap:round}
    .guide{stroke:#c97817;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:9 7}
    .point{fill:#c97817;stroke:#fff;stroke-width:3}.label{font:600 22px system-ui,sans-serif;fill:#123f43}
    .small{font:500 18px system-ui,sans-serif;fill:#475569}.title{font:700 27px system-ui,sans-serif;fill:#123f43}
  </style>

  <text x="48" y="48" class="title">Coordinates: read x first, then y</text>
  <g><line x1="170" y1="70" x2="170" y2="450" class="grid"/><line x1="220" y1="70" x2="220" y2="450" class="grid"/><line x1="270" y1="70" x2="270" y2="450" class="grid"/><line x1="320" y1="70" x2="320" y2="450" class="grid"/><line x1="370" y1="70" x2="370" y2="450" class="grid"/><line x1="420" y1="70" x2="420" y2="450" class="grid"/><line x1="470" y1="70" x2="470" y2="450" class="grid"/><line x1="520" y1="70" x2="520" y2="450" class="grid"/><line x1="570" y1="70" x2="570" y2="450" class="grid"/><line x1="620" y1="70" x2="620" y2="450" class="grid"/><line x1="670" y1="70" x2="670" y2="450" class="grid"/><line x1="720" y1="70" x2="720" y2="450" class="grid"/><line x1="770" y1="70" x2="770" y2="450" class="grid"/><line x1="170" y1="100" x2="770" y2="100" class="grid"/><line x1="170" y1="150" x2="770" y2="150" class="grid"/><line x1="170" y1="200" x2="770" y2="200" class="grid"/><line x1="170" y1="250" x2="770" y2="250" class="grid"/><line x1="170" y1="300" x2="770" y2="300" class="grid"/><line x1="170" y1="350" x2="770" y2="350" class="grid"/><line x1="170" y1="400" x2="770" y2="400" class="grid"/></g>
  <line x1="150" y1="250" x2="800" y2="250" class="axis"/><line x1="470" y1="70" x2="470" y2="450" class="axis"/>
  <path d="M800 250l-13-7v14zM470 70l-7 13h14z" fill="#123f43"/>
  <text x="810" y="258" class="label">x</text><text x="481" y="84" class="label">y</text><text x="478" y="274" class="small">0</text>
  <text x="690" y="158" class="small">Quadrant I (+,+)</text><text x="190" y="158" class="small">Quadrant II (−,+)</text>
  <text x="190" y="428" class="small">Quadrant III (−,−)</text><text x="675" y="428" class="small">Quadrant IV (+,−)</text>
  <line x1="270" y1="100" x2="670" y2="100" class="guide"/><circle cx="270" cy="100" r="9" class="point"/><circle cx="670" cy="100" r="9" class="point"/>
  <text x="208" y="84" class="label">A(−4, 3)</text><text x="681" y="84" class="label">A′(4, 3)</text><text x="350" y="137" class="small">same distance from the y-axis</text>
</svg>
