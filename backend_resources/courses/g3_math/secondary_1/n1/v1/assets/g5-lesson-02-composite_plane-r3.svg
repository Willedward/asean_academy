<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">An L-shape left after a corner is removed</title><desc id="desc">An L-shape. The full bottom edge is 15 m and the full left edge is 9 m. The removed top-right corner has edges 5 m and 3 m. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="380" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="l-shape" data-points="A B C D E F" points="90,292 510,292 510,124 370,124 370,40 90,40" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="90" y1="292" x2="510" y2="292" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="510" y1="292" x2="510" y2="124" stroke="#124e52" stroke-width="5"/>
<line data-segment="CD" x1="510" y1="124" x2="370" y2="124" stroke="#124e52" stroke-width="5"/>
<line data-segment="DE" x1="370" y1="124" x2="370" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="EF" x1="370" y1="40" x2="90" y2="40" stroke="#124e52" stroke-width="5"/>
<line data-segment="FA" x1="90" y1="40" x2="90" y2="292" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="360" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:AB" x="300" y="322.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">15 m</text>
<text data-label-for="segment:FA" x="51.42" y="175.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">9 m</text>
<text data-label-for="segment:CD" x="456.8" y="111.94" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 m</text>
<text data-label-for="segment:DE" x="408.58" y="77.92" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">3 m</text>
</g>
</svg>
