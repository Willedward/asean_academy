<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="title desc">
<title id="title">Interior and exterior angles of convex polygons</title><desc id="desc">A regular hexagon showing a fan of four triangles and one exterior angle at a vertex.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs>
<rect width="940" height="390" rx="24" fill="#f8fafc"/><text x="36" y="38" class="heading">Interior and exterior angles of convex polygons</text>
<g fill="none" stroke="#0f3d40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M260 70 L390 70 L470 175 L390 280 L260 280 L180 175 Z M260 70 L390 280 M260 70 L470 175 M260 70 L260 280 M390 70 L520 70"/><path class="arc" d="M390 105 A35 35 0 0 1 425 70"/><text x="425" y="105">exterior angle</text><text x="610" y="145">n−2 triangles</text><text x="610" y="195">sum = (n−2)×180°</text></g>
<style>.heading{font:700 22px system-ui;fill:#0f3d40} text{font:600 17px system-ui;fill:#334155;stroke:none} .arc{stroke:#c87a1e} .mark{stroke:#c87a1e} .faint{stroke:#94a3b8;stroke-width:2} .dash{stroke:#c87a1e;stroke-dasharray:8 8} .arrow{stroke:#0f766e;marker-end:url(#arrow)} .grid{stroke:#dbe4e6;stroke-width:1}</style>
</svg>