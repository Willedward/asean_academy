<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-sec1-mensuration-svg-v1">
<title id="title">A parallelogram beside a trapezium</title><desc id="desc">A parallelogram with base 10 cm and dashed perpendicular height 6 cm, beside a trapezium with parallel sides 7 cm and 13 cm and dashed perpendicular height 5 cm. A right angle is marked at the foot of each height. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="Pparallelogram" data-points="PA PB PC PD" points="35,171.73 227.88,171.73 279.96,56 87.08,56" fill="#e7f2f0" stroke="none"/>
<line data-segment="PAPB" x1="35" y1="171.73" x2="227.88" y2="171.73" stroke="#124e52" stroke-width="5"/>
<line data-segment="PBPC" x1="227.88" y1="171.73" x2="279.96" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="PCPD" x1="279.96" y1="56" x2="87.08" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="PDPA" x1="87.08" y1="56" x2="35" y2="171.73" stroke="#124e52" stroke-width="5"/>
<line data-segment="PDPF" x1="87.08" y1="56" x2="87.08" y2="171.73" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="PF" d="M105.08 171.73 L105.08 153.73 L87.08 153.73" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<polygon data-shape="Ttrapezium" data-points="TA TB TC TD" points="314.25,171.73 565,171.73 507.14,75.29 372.12,75.29" fill="#fdf3e6" stroke="none"/>
<line data-segment="TATB" x1="314.25" y1="171.73" x2="565" y2="171.73" stroke="#124e52" stroke-width="5"/>
<line data-segment="TBTC" x1="565" y1="171.73" x2="507.14" y2="75.29" stroke="#124e52" stroke-width="5"/>
<line data-segment="TCTD" x1="507.14" y1="75.29" x2="372.12" y2="75.29" stroke="#124e52" stroke-width="5"/>
<line data-segment="TDTA" x1="372.12" y1="75.29" x2="314.25" y2="171.73" stroke="#124e52" stroke-width="5"/>
<line data-segment="TDTF" x1="372.12" y1="75.29" x2="372.12" y2="171.73" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="TF" d="M390.12 171.73 L390.12 153.73 L372.12 153.73" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="280" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:PAPB" x="131.44" y="202.51" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">10 cm</text>
<text data-label-for="segment:PDPF" x="133.59" y="123.22" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 cm</text>
<text data-label-for="segment:TATB" x="439.62" y="202.51" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">13 cm</text>
<text data-label-for="segment:TCTD" x="439.63" y="63.23" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">7 cm</text>
<text data-label-for="segment:TDTF" x="418.63" y="132.87" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">5 cm</text>
</g>
</svg>
