<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Intercepts of y equals negative two x plus eight</title><desc id="desc">Straight line crossing the y-axis at zero comma eight and the x-axis at four comma zero.</desc>
  <rect width="940" height="500" rx="28" fill="#f7fafb"/>
  <style>
    .axis{stroke:#123f43;stroke-width:3}.grid{stroke:#d8e3e5;stroke-width:1}
    .line{stroke:#087f7b;stroke-width:5;fill:none;stroke-linecap:round}
    .guide{stroke:#c97817;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:9 7}
    .point{fill:#c97817;stroke:#fff;stroke-width:3}.label{font:600 22px system-ui,sans-serif;fill:#123f43}
    .small{font:500 18px system-ui,sans-serif;fill:#475569}.title{font:700 27px system-ui,sans-serif;fill:#123f43}
  </style>

  <text x="48" y="48" class="title">Find intercepts by setting one coordinate to zero</text>
  <line x1="100" y1="420" x2="820" y2="420" class="axis"/><line x1="140" y1="455" x2="140" y2="70" class="axis"/>
  <path d="M820 420l-13-7v14zM140 70l-7 13h14z" fill="#123f43"/>
  <line x1="140" y1="100" x2="545" y2="460" class="line"/><circle cx="140" cy="100" r="9" class="point"/><circle cx="500" cy="420" r="9" class="point"/>
  <line x1="140" y1="100" x2="500" y2="100" class="guide" opacity=".45"/><line x1="500" y1="100" x2="500" y2="420" class="guide" opacity=".45"/>
  <text x="170" y="120" class="label">(0, 8)</text><text x="515" y="405" class="label">(4, 0)</text><text x="590" y="190" class="label">y = −2x + 8</text>
  <text x="828" y="429" class="label">x</text><text x="152" y="82" class="label">y</text>
</svg>
