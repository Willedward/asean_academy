<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Reading a bar graph and a line graph</title>
  <desc id="desc">A bar graph compares books read by three clubs, while a line graph shows attendance changing from Monday to Friday.</desc>
  <rect width="940" height="500" rx="28" fill="#f7fafb"/>
  <style>
    .title{font:700 28px system-ui,sans-serif;fill:#123f43}.label{font:600 18px system-ui,sans-serif;fill:#123f43}
    .small{font:500 16px system-ui,sans-serif;fill:#475569}.axis{stroke:#123f43;stroke-width:3}.grid{stroke:#d8e3e5;stroke-width:1}
    .bar{fill:#087f7b}.line{stroke:#c97817;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.point{fill:#c97817;stroke:#fff;stroke-width:3}
  </style>
  <text x="48" y="52" class="title">Match the graph to the question</text>
  <text x="82" y="95" class="label">Bar graph: compare categories</text>
  <text x="88" y="125" class="small">books read</text>
  <line x1="85" y1="385" x2="410" y2="385" class="axis"/><line x1="85" y1="385" x2="85" y2="130" class="axis"/>
  <line x1="85" y1="325" x2="410" y2="325" class="grid"/><line x1="85" y1="265" x2="410" y2="265" class="grid"/>
  <line x1="85" y1="205" x2="410" y2="205" class="grid"/><line x1="85" y1="145" x2="410" y2="145" class="grid"/>
  <text x="58" y="391" class="small">0</text><text x="50" y="331" class="small">6</text><text x="42" y="271" class="small">12</text><text x="42" y="211" class="small">18</text><text x="42" y="151" class="small">24</text>
  <rect x="125" y="265" width="60" height="120" rx="5" class="bar"/><rect x="220" y="205" width="60" height="180" rx="5" class="bar"/><rect x="315" y="145" width="60" height="240" rx="5" class="bar"/>
  <text x="128" y="415" class="small">Club A</text><text x="223" y="415" class="small">Club B</text><text x="318" y="415" class="small">Club C</text>
  <text x="135" y="252" class="label">12</text><text x="230" y="192" class="label">18</text><text x="325" y="132" class="label">24</text>
  <text x="520" y="95" class="label">Line graph: follow ordered change</text>
  <text x="538" y="125" class="small">attendance</text>
  <line x1="535" y1="385" x2="875" y2="385" class="axis"/><line x1="535" y1="385" x2="535" y2="130" class="axis"/>
  <line x1="535" y1="325" x2="875" y2="325" class="grid"/><line x1="535" y1="265" x2="875" y2="265" class="grid"/>
  <line x1="535" y1="205" x2="875" y2="205" class="grid"/><line x1="535" y1="145" x2="875" y2="145" class="grid"/>
  <text x="503" y="391" class="small">26</text><text x="503" y="331" class="small">32</text><text x="503" y="271" class="small">38</text><text x="503" y="211" class="small">44</text><text x="503" y="151" class="small">50</text>
  <path d="M570 325 L635 285 L700 305 L765 225 L830 185" class="line"/>
  <circle cx="570" cy="325" r="8" class="point"/><circle cx="635" cy="285" r="8" class="point"/><circle cx="700" cy="305" r="8" class="point"/><circle cx="765" cy="225" r="8" class="point"/><circle cx="830" cy="185" r="8" class="point"/>
  <text x="555" y="415" class="small">Mon</text><text x="622" y="415" class="small">Tue</text><text x="685" y="415" class="small">Wed</text><text x="752" y="415" class="small">Thu</text><text x="820" y="415" class="small">Fri</text>
  <text x="50" y="465" class="small">Read the title, labels, scale and key before comparing values.</text>
</svg>
