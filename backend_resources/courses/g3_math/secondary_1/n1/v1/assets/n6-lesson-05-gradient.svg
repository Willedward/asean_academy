<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Gradient as vertical change divided by horizontal change</title><desc id="desc">Line through one comma one and five comma three with a right triangle showing a run of four and rise of two.</desc>
  <rect width="940" height="500" rx="28" fill="#f7fafb"/>
  <style>
    .axis{stroke:#123f43;stroke-width:3}.grid{stroke:#d8e3e5;stroke-width:1}
    .line{stroke:#087f7b;stroke-width:5;fill:none;stroke-linecap:round}
    .guide{stroke:#c97817;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:9 7}
    .point{fill:#c97817;stroke:#fff;stroke-width:3}.label{font:600 22px system-ui,sans-serif;fill:#123f43}
    .small{font:500 18px system-ui,sans-serif;fill:#475569}.title{font:700 27px system-ui,sans-serif;fill:#123f43}
  </style>

  <text x="48" y="48" class="title">Gradient = vertical change ÷ horizontal change</text>
  <line x1="100" y1="420" x2="820" y2="420" class="axis"/><line x1="140" y1="460" x2="140" y2="75" class="axis"/>
  <path d="M820 420l-13-7v14zM140 75l-7 13h14z" fill="#123f43"/>
  <line x1="140" y1="380" x2="790" y2="120" class="line"/><circle cx="240" cy="340" r="9" class="point"/><circle cx="640" cy="180" r="9" class="point"/>
  <path d="M240 340H640V180" class="guide"/><text x="405" y="372" class="label">run = 4</text><text x="657" y="270" class="label">rise = 2</text>
  <text x="175" y="327" class="small">(1, 1)</text><text x="650" y="153" class="small">(5, 3)</text><text x="690" y="108" class="label">m = 2/4 = 1/2</text>
  <text x="828" y="429" class="label">x</text><text x="152" y="87" class="label">y</text>
</svg>
