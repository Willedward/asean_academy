<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Effect of a and b in y equals a x plus b</title><desc id="desc">Two straight lines share y-intercept one; one rises for positive a and one falls for negative a.</desc>
  <rect width="940" height="500" rx="28" fill="#f7fafb"/>
  <style>
    .axis{stroke:#123f43;stroke-width:3}.grid{stroke:#d8e3e5;stroke-width:1}
    .line{stroke:#087f7b;stroke-width:5;fill:none;stroke-linecap:round}
    .guide{stroke:#c97817;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:9 7}
    .point{fill:#c97817;stroke:#fff;stroke-width:3}.label{font:600 22px system-ui,sans-serif;fill:#123f43}
    .small{font:500 18px system-ui,sans-serif;fill:#475569}.title{font:700 27px system-ui,sans-serif;fill:#123f43}
  </style>

  <text x="48" y="48" class="title">In y = ax + b, a controls direction and b marks the start</text>
  <line x1="100" y1="300" x2="850" y2="300" class="axis"/><line x1="470" y1="450" x2="470" y2="75" class="axis"/>
  <path d="M850 300l-13-7v14zM470 75l-7 13h14z" fill="#123f43"/>
  <line x1="350" y1="420" x2="590" y2="60" class="line"/><line x1="230" y1="80" x2="770" y2="440" stroke="#6d5cae" stroke-width="5" stroke-linecap="round"/>
  <circle cx="470" cy="240" r="9" class="point"/><text x="495" y="224" class="label">b = 1</text>
  <text x="596" y="95" class="label">a &gt; 0: rises</text><text x="650" y="404" class="label">a &lt; 0: falls</text>
  <text x="858" y="309" class="label">x</text><text x="482" y="86" class="label">y</text>
</svg>
