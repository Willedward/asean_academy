<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Ordered pairs following y equals four x plus two</title><desc id="desc">Graph plotting zero comma two, one comma six, two comma ten and three comma fourteen on one straight line.</desc>
  <rect width="940" height="500" rx="28" fill="#f7fafb"/>
  <style>
    .axis{stroke:#123f43;stroke-width:3}.grid{stroke:#d8e3e5;stroke-width:1}
    .line{stroke:#087f7b;stroke-width:5;fill:none;stroke-linecap:round}
    .guide{stroke:#c97817;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:9 7}
    .point{fill:#c97817;stroke:#fff;stroke-width:3}.label{font:600 22px system-ui,sans-serif;fill:#123f43}
    .small{font:500 18px system-ui,sans-serif;fill:#475569}.title{font:700 27px system-ui,sans-serif;fill:#123f43}
  </style>

  <text x="48" y="48" class="title">The same relationship as points and a graph</text>
  <line x1="120" y1="430" x2="800" y2="430" class="axis"/><line x1="150" y1="460" x2="150" y2="78" class="axis"/>
  <path d="M800 430l-13-7v14zM150 78l-7 13h14z" fill="#123f43"/>
  <g class="small"><text x="805" y="438">x</text><text x="162" y="88">y</text><text x="135" y="454">0</text><text x="300" y="454">1</text><text x="450" y="454">2</text><text x="600" y="454">3</text><text x="112" y="388">2</text><text x="112" y="300">6</text><text x="102" y="212">10</text><text x="102" y="124">14</text></g>
  <line x1="150" y1="386" x2="600" y2="122" class="line"/>
  <g><circle cx="150" cy="386" r="9" class="point"/><circle cx="300" cy="298" r="9" class="point"/><circle cx="450" cy="210" r="9" class="point"/><circle cx="600" cy="122" r="9" class="point"/></g>
  <text x="635" y="150" class="label">y = 4x + 2</text><text x="635" y="185" class="small">Each +1 in x gives +4 in y.</text>
</svg>
