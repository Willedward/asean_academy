<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Travel to school: tally and frequency</title><desc id="desc">Frequency table for eight travel-to-school observations. Walk has tally three strokes and frequency 3, bicycle two strokes and frequency 2, bus three strokes and frequency 3, and the total frequency is 8.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="85" y1="95" x2="85" y2="395" stroke="#17324d" stroke-width="2"/>
<line x1="268.333333" y1="95" x2="268.333333" y2="395" stroke="#17324d" stroke-width="2"/>
<line x1="451.666667" y1="95" x2="451.666667" y2="395" stroke="#17324d" stroke-width="2"/>
<line x1="635" y1="95" x2="635" y2="395" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="95" x2="635" y2="95" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="155" x2="635" y2="155" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="215" x2="635" y2="215" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="275" x2="635" y2="275" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="335" x2="635" y2="335" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="395" x2="635" y2="395" stroke="#17324d" stroke-width="2"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Travel to school: tally and frequency</text>
<text x="360" y="135.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Tally</text>
<text x="543.333333" y="135.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Frequency</text>
<text x="176.666667" y="195.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Walk</text>
<text x="360" y="195.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-0-0" data-chart-kind="table-cell" data-value="|||">|||</text>
<text x="543.333333" y="195.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-0-1" data-chart-kind="table-cell" data-value="3">3</text>
<text x="176.666667" y="255.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Bicycle</text>
<text x="360" y="255.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-1-0" data-chart-kind="table-cell" data-value="||">||</text>
<text x="543.333333" y="255.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-1-1" data-chart-kind="table-cell" data-value="2">2</text>
<text x="176.666667" y="315.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Bus</text>
<text x="360" y="315.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-2-0" data-chart-kind="table-cell" data-value="|||">|||</text>
<text x="543.333333" y="315.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-2-1" data-chart-kind="table-cell" data-value="3">3</text>
<text x="176.666667" y="375.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Total</text>
<text x="360" y="375.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-3-0" data-chart-kind="table-cell" data-value=""></text>
<text x="543.333333" y="375.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-3-1" data-chart-kind="table-cell" data-value="8">8</text>
