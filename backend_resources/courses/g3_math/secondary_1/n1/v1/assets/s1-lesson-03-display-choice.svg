<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Guide for choosing a statistical representation</title>
  <desc id="desc">A decision guide connects exact lookup to tables, category comparison to bar graphs, ordered change to line graphs and a few parts of one whole to pie charts.</desc>
  <rect width="940" height="500" rx="28" fill="#f7fafb"/>
  <style>
    .title{font:700 28px system-ui,sans-serif;fill:#123f43}.head{font:700 21px system-ui,sans-serif;fill:#123f43}
    .text{font:500 18px system-ui,sans-serif;fill:#475569}.choice{font:650 17px system-ui,sans-serif;fill:#123f43}.box{fill:#fff;stroke:#87b7b4;stroke-width:3}.answer{fill:#dff2f0;stroke:#087f7b;stroke-width:3}
    .arrow{stroke:#c97817;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <text x="48" y="52" class="title">Choose from the purpose, not the decoration</text>
  <rect x="325" y="85" width="290" height="70" rx="18" class="box"/><text x="368" y="115" class="head">What must the reader do?</text><text x="385" y="140" class="text">Start with the comparison task.</text>
  <path d="M470 155v45M470 200H155v45M470 200h315v45M470 200v45" class="arrow"/>
  <rect x="55" y="245" width="200" height="88" rx="16" class="box"/><text x="103" y="278" class="choice">Exact lookup</text><text x="103" y="307" class="text">many entries</text>
  <rect x="270" y="245" width="200" height="88" rx="16" class="box"/><text x="313" y="278" class="choice">Compare groups</text><text x="322" y="307" class="text">distinct groups</text>
  <rect x="485" y="245" width="200" height="88" rx="16" class="box"/><text x="526" y="278" class="choice">Ordered change</text><text x="519" y="307" class="text">often over time</text>
  <rect x="700" y="245" width="200" height="88" rx="16" class="box"/><text x="736" y="278" class="choice">Parts of a whole</text><text x="752" y="307" class="text">few categories</text>
  <rect x="75" y="375" width="160" height="62" rx="15" class="answer"/><text x="125" y="414" class="head">Table</text>
  <rect x="290" y="375" width="160" height="62" rx="15" class="answer"/><text x="325" y="414" class="head">Bar graph</text>
  <rect x="505" y="375" width="160" height="62" rx="15" class="answer"/><text x="541" y="414" class="head">Line graph</text>
  <rect x="720" y="375" width="160" height="62" rx="15" class="answer"/><text x="758" y="414" class="head">Pie chart</text>
  <path d="M155 333v42M370 333v42M585 333v42M800 333v42" class="arrow"/>
</svg>
