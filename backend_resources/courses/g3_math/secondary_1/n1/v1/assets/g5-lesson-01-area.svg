<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="title desc">
<title id="title">Area of a parallelogram and trapezium</title><desc id="desc">A parallelogram and a trapezium with bases and perpendicular heights clearly marked.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs>
<rect width="940" height="390" rx="24" fill="#f8fafc"/><text x="36" y="38" class="heading">Area of a parallelogram and trapezium</text>
<g fill="none" stroke="#0f3d40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M90 250 L160 95 H390 L320 250 Z M520 250 L575 105 H790 L850 250 Z"/><path class="dash" d="M160 95 V250 M575 105 V250"/><text x="205" y="285">base b</text><text x="125" y="180">h</text><text x="655" y="90">a</text><text x="655" y="285">b</text><text x="540" y="180">h</text></g>
<style>.heading{font:700 22px system-ui;fill:#0f3d40} text{font:600 17px system-ui;fill:#334155;stroke:none} .arc{stroke:#c87a1e} .mark{stroke:#c87a1e} .faint{stroke:#94a3b8;stroke-width:2} .dash{stroke:#c87a1e;stroke-dasharray:8 8} .arrow{stroke:#0f766e;marker-end:url(#arrow)} .grid{stroke:#dbe4e6;stroke-width:1}</style>
</svg>