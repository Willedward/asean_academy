<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc"><title id="title">Pythagoras theorem on a right triangle</title><desc id="desc">A right triangle with legs six and eight units, hypotenuse ten units, a right-angle marker, and squares represented by the equation six squared plus eight squared equals ten squared.</desc><rect width="940" height="470" rx="24" fill="#f7faf9"/><g font-family="system-ui,sans-serif"><text x="46" y="54" font-size="27" font-weight="700" fill="#113f42">Pythagoras’ theorem</text><path d="M170 370 L170 130 L490 370 Z" fill="#e4f1ef" stroke="#124e52" stroke-width="6"/><path d="M170 332 H208 V370" fill="none" stroke="#d17a18" stroke-width="5"/><text x="118" y="255" font-size="23">6</text><text x="310" y="405" font-size="23">8</text><text x="345" y="235" font-size="23">10</text><text x="585" y="205" font-size="28" font-weight="700" fill="#113f42">a² + b² = c²</text><text x="585" y="260" font-size="24">6² + 8² = 10²</text><text x="585" y="310" font-size="19" fill="#567478">c is opposite the right angle</text></g></svg>