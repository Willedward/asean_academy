<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc"><title id="title">Sine cosine and tangent side labels</title><desc id="desc">A right triangle labels the hypotenuse, opposite and adjacent sides relative to theta, alongside the three trigonometric ratios.</desc><rect width="940" height="470" rx="24" fill="#f7faf9"/><g font-family="system-ui,sans-serif"><text x="46" y="54" font-size="27" font-weight="700" fill="#113f42">Name sides relative to θ</text><path d="M135 370 L135 130 L500 370 Z" fill="#e4f1ef" stroke="#124e52" stroke-width="6"/><path d="M135 332 H173 V370" fill="none" stroke="#d17a18" stroke-width="5"/><path d="M444 370 A56 56 0 0 0 454 337" fill="none" stroke="#d17a18" stroke-width="5"/><text x="432" y="350" font-size="22">θ</text><text x="54" y="255" font-size="21">opposite</text><text x="270" y="408" font-size="21">adjacent</text><text x="315" y="225" font-size="21">hypotenuse</text><text x="585" y="165" font-size="22">sin θ = opposite / hypotenuse</text><text x="585" y="235" font-size="22">cos θ = adjacent / hypotenuse</text><text x="585" y="305" font-size="22">tan θ = opposite / adjacent</text></g></svg>