<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc"><title id="title">Sphere and hemisphere formulas</title><desc id="desc">A sphere with its radius and formulas for sphere volume and surface area, plus curved and total surface area of a hemisphere.</desc><rect width="940" height="500" rx="24" fill="#f7faf9"/><g font-family="system-ui,sans-serif" fill="#113f42"><text x="42" y="52" font-size="28" font-weight="700">Sphere and hemisphere</text>
    <circle cx="235" cy="270" r="145" fill="#e4f1ef" stroke="#124e52" stroke-width="5"/>
    <ellipse cx="235" cy="270" rx="145" ry="45" fill="none" stroke="#5a8588" stroke-width="3" stroke-dasharray="9 7"/>
    <circle cx="235" cy="270" r="6" fill="#d17a18"/><path d="M235 270 L360 210" stroke="#d17a18" stroke-width="4"/>
    <text x="302" y="224" font-size="22">r</text>
    <text x="510" y="135" font-size="27" font-weight="700">Sphere: V = ⁴⁄₃πr³</text>
    <text x="510" y="190" font-size="25">Surface area = 4πr²</text>
    <text x="510" y="270" font-size="24" font-weight="700">Hemisphere</text>
    <text x="510" y="315" font-size="22">curved area = 2πr²</text>
    <text x="510" y="355" font-size="22">total area = 3πr²</text>
    <text x="510" y="405" font-size="19" fill="#567478">Include the circular base only when exposed.</text></g></svg>