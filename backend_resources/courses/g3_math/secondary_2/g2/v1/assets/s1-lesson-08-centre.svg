<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Mean, median and mode on an ordered data strip</title><desc id="desc">Mean, median and mode on an ordered data strip teaching diagram</desc>
<rect width="960" height="480" rx="28" fill="#f6f8fa"/><style>.axis{stroke:#0d4548;stroke-width:4;fill:none}.bar{fill:#65b7ad;stroke:#0d4548;stroke-width:3}.accent{stroke:#cc7a18;stroke-width:6;fill:none}.dot{fill:#cc7a18}.t{font:25px Arial,sans-serif;fill:#153f43}.s{font:19px Arial,sans-serif;fill:#334155}</style><text class="t" x="55" y="55">Data: 2, 4, 4, 7, 13</text><line class="axis" x1="100" y1="210" x2="860" y2="210"/><g class="dot"><circle cx="210" cy="210" r="13"/><circle cx="330" cy="210" r="13"/><circle cx="330" cy="170" r="13"/><circle cx="510" cy="210" r="13"/><circle cx="810" cy="210" r="13"/></g><text class="s" x="198" y="255">2</text><text class="s" x="320" y="255">4</text><text class="s" x="500" y="255">7</text><text class="s" x="795" y="255">13</text><path class="accent" d="M330 135v-45"/><text class="s" x="275" y="80">mode and median = 4</text><path class="accent" d="M460 275v60"/><text class="s" x="355" y="370">mean = 6, using every value</text></svg>
