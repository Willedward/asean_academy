<svg xmlns="http://www.w3.org/2000/svg" width="600" height="351" viewBox="0 0 600 351" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">A triangle and its similar enlargement</title><desc id="desc">Two similar triangles, with an arrow marked × k from the smaller to the larger. The corresponding base edges are marked 6 cm and 15 cm. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="351" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="S1 S2 S3" points="45,241.05 160.91,241.05 84.41,162.23" fill="#e7f2f0" stroke="none"/>
<line data-segment="S1S2" x1="45" y1="241.05" x2="160.91" y2="241.05" stroke="#124e52" stroke-width="5"/>
<line data-segment="S2S3" x1="160.91" y1="241.05" x2="84.41" y2="162.23" stroke="#124e52" stroke-width="5"/>
<line data-segment="S3S1" x1="84.41" y1="162.23" x2="45" y2="241.05" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="T1 T2 T3" points="265.23,241.05 555,241.05 363.75,44" fill="#fdf3e6" stroke="none"/>
<line data-segment="T1T2" x1="265.23" y1="241.05" x2="555" y2="241.05" stroke="#124e52" stroke-width="5"/>
<line data-segment="T2T3" x1="555" y1="241.05" x2="363.75" y2="44" stroke="#124e52" stroke-width="5"/>
<line data-segment="T3T1" x1="363.75" y1="44" x2="265.23" y2="241.05" stroke="#124e52" stroke-width="5"/>
<path data-arrow="scale" d="M177.6 201.64 L248.54 201.64 M234.54 210.64 L248.54 201.64 L234.54 192.64" fill="none" stroke="#124e52" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="331" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="caption:arrow-scale" x="203.07" y="188.2" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">× k</text>
