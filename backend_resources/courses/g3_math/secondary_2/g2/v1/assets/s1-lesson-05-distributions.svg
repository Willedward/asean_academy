<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Dot plot, histogram and stem-and-leaf representations</title><desc id="desc">Dot plot, histogram and stem-and-leaf representations teaching diagram</desc>
<rect width="960" height="480" rx="28" fill="#f6f8fa"/><style>.axis{stroke:#0d4548;stroke-width:4;fill:none}.bar{fill:#65b7ad;stroke:#0d4548;stroke-width:3}.accent{stroke:#cc7a18;stroke-width:6;fill:none}.dot{fill:#cc7a18}.t{font:25px Arial,sans-serif;fill:#153f43}.s{font:19px Arial,sans-serif;fill:#334155}</style><text class="t" x="50" y="48">Three views of a distribution</text><text class="s" x="70" y="95">dot plot</text><line class="axis" x1="65" y1="205" x2="300" y2="205"/><g class="dot"><circle cx="100" cy="185" r="9"/><circle cx="150" cy="185" r="9"/><circle cx="150" cy="160" r="9"/><circle cx="205" cy="185" r="9"/><circle cx="205" cy="160" r="9"/><circle cx="205" cy="135" r="9"/><circle cx="260" cy="185" r="9"/></g><text class="s" x="365" y="95">histogram</text><line class="axis" x1="355" y1="205" x2="620" y2="205"/><line class="axis" x1="355" y1="205" x2="355" y2="105"/><rect class="bar" x="370" y="155" width="70" height="50"/><rect class="bar" x="440" y="115" width="70" height="90"/><rect class="bar" x="510" y="135" width="70" height="70"/><text class="s" x="670" y="95">stem | leaves</text><text class="t" x="680" y="140">2 | 1 4 7</text><text class="t" x="680" y="180">3 | 0 3 3 8</text><line class="accent" x1="710" y1="110" x2="710" y2="195"/><text class="s" x="70" y="285">Dots preserve repeated values.</text><text class="s" x="355" y="285">Histogram area shows grouped frequency.</text><text class="s" x="670" y="285">A key gives place value.</text><text class="s" x="70" y="370">Always read the axis scale, class boundaries and key before interpreting.</text></svg>
