<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Testing triangles with the converse of Pythagoras</title><desc id="desc">Two triangles drawn from their side lengths. The 7, 24, 25 triangle has a right angle marked opposite the side 25 because 7² + 24² = 625 = 25². The 7, 24, 26 triangle has no right angle because 26² = 676.</desc>
<rect data-role="background" width="600" height="650" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A1 B1 C1" points="100,176.67 100,60 500,176.67" fill="#e7f2f0" stroke="none"/>
<line data-segment="A1B1" x1="100" y1="176.67" x2="100" y2="60" stroke="#124e52" stroke-width="5"/>
<line data-segment="A1C1" x1="100" y1="176.67" x2="500" y2="176.67" stroke="#124e52" stroke-width="5"/>
<line data-segment="B1C1" x1="100" y1="60" x2="500" y2="176.67" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A1" d="M100 154.67 L122 154.67 L122 176.67" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<polygon data-shape="triangle" data-points="A2 B2 C2" points="108.85,480.31 91.15,365 508.85,480.31" fill="#e7f2f0" stroke="none"/>
<line data-segment="A2B2" x1="108.85" y1="480.31" x2="91.15" y2="365" stroke="#124e52" stroke-width="5"/>
<line data-segment="A2C2" x1="108.85" y1="480.31" x2="508.85" y2="480.31" stroke="#124e52" stroke-width="5"/>
<line data-segment="B2C2" x1="91.15" y1="365" x2="508.85" y2="480.31" stroke="#124e52" stroke-width="5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-label-for="segment:A1B1" x="80.14" y="127.69" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">7</text>
<text data-label-for="segment:A1C1" x="300" y="207.45" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">24</text>
<text data-label-for="segment:B1C1" x="307.34" y="102.52" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">25</text>
<text x="300" y="263.31" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">7² + 24² = 625 = 625 = 25²</text>
<text x="300" y="299.15" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">right-angled</text>
<text data-label-for="segment:A2B2" x="78.84" y="435.26" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">7</text>
<text data-label-for="segment:A2C2" x="308.85" y="511.09" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">24</text>
<text data-label-for="segment:B2C2" x="306.92" y="406.94" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">26</text>
<text x="300" y="566.95" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">7² + 24² = 625 ≠ 676 = 26²</text>
<text x="300" y="602.79" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">not right-angled</text>
</g>
</svg>
