<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">How a truncated axis exaggerates a difference</title><desc id="desc">How a truncated axis exaggerates a difference teaching diagram</desc>
<rect width="960" height="480" rx="28" fill="#f6f8fa"/><style>.axis{stroke:#0d4548;stroke-width:4;fill:none}.bar{fill:#65b7ad;stroke:#0d4548;stroke-width:3}.accent{stroke:#cc7a18;stroke-width:6;fill:none}.dot{fill:#cc7a18}.t{font:25px Arial,sans-serif;fill:#153f43}.s{font:19px Arial,sans-serif;fill:#334155}</style><text class="t" x="50" y="48">The same values: 96 and 100</text><text class="s" x="75" y="90">zero baseline</text><line class="axis" x1="65" y1="390" x2="400" y2="390"/><rect class="bar" x="120" y="150" width="90" height="240"/><rect class="bar" x="255" y="140" width="90" height="250"/><text class="s" x="145" y="425">96</text><text class="s" x="280" y="425">100</text><text class="s" x="570" y="90">baseline at 92</text><line class="axis" x1="535" y1="390" x2="890" y2="390"/><rect class="bar" x="600" y="310" width="90" height="80"/><rect class="bar" x="745" y="230" width="90" height="160"/><text class="s" x="625" y="425">96</text><text class="s" x="765" y="425">100</text><text class="s" x="540" y="465">Visible heights double although the values rise only about 4.2%.</text></svg>
