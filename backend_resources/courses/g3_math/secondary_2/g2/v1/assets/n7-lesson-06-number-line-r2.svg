<line x1="680" y1="240" x2="680" y2="260" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="x:7" data-axis="x" data-value="7" data-position="680" data-label="7"/>
<circle data-chart-mark="boundary" data-chart-kind="closed-boundary" data-value="3" cx="440" cy="250" r="10" fill="#e36b45" stroke="#e36b45" stroke-width="4"/>
<line x1="440" y1="250" x2="92" y2="250" stroke="#e36b45" stroke-width="6" data-role="solution-ray" data-direction="left"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="75" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">The solution x ≤ 3</text>
