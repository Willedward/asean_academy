<line x1="440" y1="240" x2="440" y2="260" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="x:3" data-axis="x" data-value="3" data-position="440" data-label="3"/>
<line x1="500" y1="240" x2="500" y2="260" stroke="#17324d" stroke-width="2"/>
