<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">The solution x ≤ 3</title><desc id="desc">Number line from −3 to 7 with a filled circle at 3 and the line shaded to the left of 3, showing x ≤ 3.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="80" y1="250" x2="680" y2="250" stroke="#17324d" stroke-width="4"/>
<path d="M80 250 l18 -10 M80 250 l18 10" fill="none" stroke="#17324d" stroke-width="3"/>
<path d="M680 250 l-18 -10 M680 250 l-18 10" fill="none" stroke="#17324d" stroke-width="3"/>
<line x1="80" y1="240" x2="80" y2="260" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="x:-3" data-axis="x" data-value="-3" data-position="80" data-label="-3"/>
