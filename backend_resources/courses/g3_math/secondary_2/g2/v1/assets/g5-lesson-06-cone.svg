<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc"><title id="title">Dimensions and formulas of a cone</title><desc id="desc">A cone showing radius, perpendicular height and slant height, with its volume, curved surface area and total surface area formulas.</desc><rect width="940" height="500" rx="24" fill="#f7faf9"/><g font-family="system-ui,sans-serif" fill="#113f42"><text x="42" y="52" font-size="28" font-weight="700">Right circular cone</text>
    <ellipse cx="255" cy="375" rx="150" ry="48" fill="#e4f1ef" stroke="#124e52" stroke-width="5"/>
    <path d="M255 85 L105 375 M255 85 L405 375" fill="none" stroke="#124e52" stroke-width="5"/>
    <path d="M255 85 V375 M255 375 H405" fill="none" stroke="#d17a18" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M255 345 h30 v30" fill="none" stroke="#d17a18" stroke-width="4"/>
    <text x="270" y="220" font-size="22">h</text><text x="322" y="355" font-size="22">r</text><text x="355" y="215" font-size="22">l</text>
    <text x="545" y="135" font-size="27" font-weight="700">V = ⅓πr²h</text>
    <text x="545" y="200" font-size="25">Curved area = πrl</text>
    <text x="545" y="250" font-size="25">Total area = πrl + πr²</text>
    <text x="545" y="320" font-size="20" fill="#567478">l² = r² + h²</text>
    <text x="545" y="360" font-size="20" fill="#567478">h is perpendicular; l follows the surface.</text></g></svg>