<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">Quadratic graph direction and symmetry</title>
<desc id="desc">Two coordinate graphs compare an upward-opening parabola with positive leading coefficient and minimum point, and a downward-opening parabola with negative leading coefficient and maximum point. Each axis of symmetry is marked.</desc>
<rect width="960" height="460" rx="24" fill="#f7faf9"/>
<text x="44" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#123f42">Leading coefficient, turning point and symmetry</text>
<g transform="translate(45 82)">
  <rect width="405" height="320" rx="18" fill="#ffffff" stroke="#cbdad8" stroke-width="2"/>
  <text x="202" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#123f42">a &gt; 0: minimum</text>
  <line x1="36" y1="145" x2="370" y2="145" stroke="#334155" stroke-width="2"/>
  <line x1="202" y1="55" x2="202" y2="285" stroke="#334155" stroke-width="2"/>
  <path d="M62 78 C110 225 155 260 202 260 C249 260 294 225 342 78" fill="none" stroke="#d17b16" stroke-width="5"/>
  <line x1="202" y1="60" x2="202" y2="278" stroke="#0f7774" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="202" cy="260" r="6" fill="#123f42"/>
  <text x="218" y="270" font-family="Arial, sans-serif" font-size="17" fill="#123f42">minimum</text>
  <text x="212" y="76" font-family="Arial, sans-serif" font-size="16" fill="#0f7774">axis of symmetry</text>
</g>
<g transform="translate(510 82)">
  <rect width="405" height="320" rx="18" fill="#ffffff" stroke="#cbdad8" stroke-width="2"/>
  <text x="202" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#123f42">a &lt; 0: maximum</text>
  <line x1="36" y1="200" x2="370" y2="200" stroke="#334155" stroke-width="2"/>
  <line x1="230" y1="55" x2="230" y2="285" stroke="#334155" stroke-width="2"/>
  <path d="M75 270 C125 112 178 80 230 80 C282 80 335 112 382 270" fill="none" stroke="#d17b16" stroke-width="5"/>
  <line x1="230" y1="58" x2="230" y2="282" stroke="#0f7774" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="230" cy="80" r="6" fill="#123f42"/>
  <text x="244" y="88" font-family="Arial, sans-serif" font-size="17" fill="#123f42">maximum</text>
  <text x="240" y="160" font-family="Arial, sans-serif" font-size="16" fill="#0f7774">axis of symmetry</text>
</g>
</svg>