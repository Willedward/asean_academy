<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Estimated mean from grouped times</title><desc id="desc">Grouped frequency table for times t in minutes, with columns midpoint x, frequency f and fx. Class 10 to 20 (10 ≤ t &lt; 20) has x = 15, f = 4 and fx = 60. Class 20 to 30 has x = 25, f = 7 and fx = 175. Class 30 to 40 has x = 35, f = 3 and fx = 105. The totals are f = 14 and fx = 340.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="85" y1="95" x2="85" y2="395" stroke="#17324d" stroke-width="2"/>
<line x1="222.5" y1="95" x2="222.5" y2="395" stroke="#17324d" stroke-width="2"/>
<line x1="360" y1="95" x2="360" y2="395" stroke="#17324d" stroke-width="2"/>
<line x1="497.5" y1="95" x2="497.5" y2="395" stroke="#17324d" stroke-width="2"/>
<line x1="635" y1="95" x2="635" y2="395" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="95" x2="635" y2="95" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="155" x2="635" y2="155" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="215" x2="635" y2="215" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="275" x2="635" y2="275" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="335" x2="635" y2="335" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="395" x2="635" y2="395" stroke="#17324d" stroke-width="2"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Estimated mean from grouped times</text>
<text x="291.25" y="135.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">x</text>
<text x="428.75" y="135.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">f</text>
<text x="566.25" y="135.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">fx</text>
<text x="153.75" y="195.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">10 to 20</text>
<text x="291.25" y="195.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-0-0" data-chart-kind="table-cell" data-value="15">15</text>
<text x="428.75" y="195.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-0-1" data-chart-kind="table-cell" data-value="4">4</text>
<text x="566.25" y="195.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-0-2" data-chart-kind="table-cell" data-value="60">60</text>
<text x="153.75" y="255.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">20 to 30</text>
<text x="291.25" y="255.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-1-0" data-chart-kind="table-cell" data-value="25">25</text>
<text x="428.75" y="255.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-1-1" data-chart-kind="table-cell" data-value="7">7</text>
<text x="566.25" y="255.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-1-2" data-chart-kind="table-cell" data-value="175">175</text>
<text x="153.75" y="315.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">30 to 40</text>
<text x="291.25" y="315.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-2-0" data-chart-kind="table-cell" data-value="35">35</text>
<text x="428.75" y="315.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-2-1" data-chart-kind="table-cell" data-value="3">3</text>
<text x="566.25" y="315.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-2-2" data-chart-kind="table-cell" data-value="105">105</text>
<text x="153.75" y="375.8" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Total</text>
