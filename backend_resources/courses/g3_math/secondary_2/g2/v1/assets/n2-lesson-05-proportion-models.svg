<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc">
<title id="title">Direct and inverse proportion compared</title>
<desc id="desc">The direct proportion graph is a straight line through the origin and keeps y divided by x constant. The inverse proportion graph curves towards both axes and keeps x times y constant.</desc>
<rect width="940" height="470" rx="24" fill="#f7faf9"/>
<g font-family="system-ui,sans-serif">
  <text x="55" y="54" font-size="26" font-weight="700" fill="#113f42">Direct proportion</text>
  <line x1="80" y1="380" x2="405" y2="380" stroke="#52666f" stroke-width="3"/>
  <line x1="80" y1="380" x2="80" y2="105" stroke="#52666f" stroke-width="3"/>
  <path d="M80 380 L380 125" fill="none" stroke="#11665f" stroke-width="6"/>
  <circle cx="180" cy="295" r="7" fill="#d17a18"/><circle cx="280" cy="210" r="7" fill="#d17a18"/>
  <text x="205" y="430" font-size="18" fill="#24384a">y = kx</text>
  <text x="118" y="92" font-size="17" fill="#24384a">y ÷ x = k</text>
  <text x="385" y="403" font-size="18" fill="#24384a">x</text><text x="56" y="116" font-size="18" fill="#24384a">y</text>
  <text x="520" y="54" font-size="26" font-weight="700" fill="#113f42">Inverse proportion</text>
  <line x1="545" y1="380" x2="870" y2="380" stroke="#52666f" stroke-width="3"/>
  <line x1="545" y1="380" x2="545" y2="105" stroke="#52666f" stroke-width="3"/>
  <path d="M575 130 C600 235 660 315 850 355" fill="none" stroke="#d17a18" stroke-width="6"/>
  <circle cx="625" cy="245" r="7" fill="#11665f"/><circle cx="745" cy="329" r="7" fill="#11665f"/>
  <text x="675" y="430" font-size="18" fill="#24384a">y = k/x</text>
  <text x="590" y="92" font-size="17" fill="#24384a">xy = k</text>
  <text x="850" y="403" font-size="18" fill="#24384a">x</text><text x="521" y="116" font-size="18" fill="#24384a">y</text>
  <text x="270" y="94" font-size="15" fill="#567478">passes through (0, 0)</text>
  <text x="700" y="94" font-size="15" fill="#567478">does not meet an axis</text>
</g>
</svg>
