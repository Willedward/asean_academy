<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">One colour at random, then a fair coin</title><desc id="desc">Sample-space table. The columns are the colours red, blue and green, chosen at random, and the rows are the coin results H and T. The six cells are RH, BH, GH, RT, BT and GT, each an equally likely outcome.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="85" y1="95" x2="85" y2="299" stroke="#17324d" stroke-width="2"/>
<line x1="222.5" y1="95" x2="222.5" y2="299" stroke="#17324d" stroke-width="2"/>
<line x1="360" y1="95" x2="360" y2="299" stroke="#17324d" stroke-width="2"/>
<line x1="497.5" y1="95" x2="497.5" y2="299" stroke="#17324d" stroke-width="2"/>
<line x1="635" y1="95" x2="635" y2="299" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="95" x2="635" y2="95" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="163" x2="635" y2="163" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="231" x2="635" y2="231" stroke="#17324d" stroke-width="2"/>
<line x1="85" y1="299" x2="635" y2="299" stroke="#17324d" stroke-width="2"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">One colour at random, then a fair coin</text>
<text x="291.25" y="141.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Red</text>
<text x="428.75" y="141.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Blue</text>
<text x="566.25" y="141.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Green</text>
<text x="153.75" y="209.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">H</text>
<text x="291.25" y="209.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-0-0" data-chart-kind="table-cell" data-value="RH">RH</text>
<text x="428.75" y="209.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-0-1" data-chart-kind="table-cell" data-value="BH">BH</text>
<text x="566.25" y="209.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-0-2" data-chart-kind="table-cell" data-value="GH">GH</text>
<text x="153.75" y="277.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">T</text>
<text x="291.25" y="277.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-1-0" data-chart-kind="table-cell" data-value="RT">RT</text>
<text x="428.75" y="277.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-1-1" data-chart-kind="table-cell" data-value="BT">BT</text>
<text x="566.25" y="277.24" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d" data-chart-mark="cell-1-2" data-chart-kind="table-cell" data-value="GT">GT</text>
</g>
</svg>
