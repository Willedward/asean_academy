<g data-axis-tick="y:10" data-axis="y" data-value="10" data-position="133.333333" data-label="10"/>
<line x1="110" y1="80" x2="650" y2="80" stroke="#cad5df" stroke-width="1"/>
<g data-axis-tick="y:12" data-axis="y" data-value="12" data-position="80" data-label="12"/>
<line x1="110" y1="400" x2="664" y2="400" stroke="#17324d" stroke-width="3"/>
<line x1="110" y1="400" x2="110" y2="66" stroke="#17324d" stroke-width="3"/>
<path data-chart-mark="curve" data-chart-kind="proportion-curve" data-value="direct;2" d="M110 400 L650 80" fill="none" stroke="#e36b45" stroke-width="4"/>
<circle data-chart-mark="point-0" data-chart-kind="point" data-value="2,4" cx="290" cy="293.333333" r="8" fill="#17324d" stroke="#fffdf8" stroke-width="2"/>
<circle data-chart-mark="point-1" data-chart-kind="point" data-value="4,8" cx="470" cy="186.666667" r="8" fill="#17324d" stroke="#fffdf8" stroke-width="2"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="42" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Direct proportion: y = 2x</text>
