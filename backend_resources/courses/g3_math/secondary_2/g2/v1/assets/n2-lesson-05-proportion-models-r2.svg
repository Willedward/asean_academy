<g data-axis-tick="x:6" data-axis="x" data-value="6" data-position="650" data-label="6"/>
<line x1="110" y1="400" x2="650" y2="400" stroke="#cad5df" stroke-width="1"/>
<g data-axis-tick="y:0" data-axis="y" data-value="0" data-position="400" data-label="0"/>
<line x1="110" y1="346.666667" x2="650" y2="346.666667" stroke="#cad5df" stroke-width="1"/>
<g data-axis-tick="y:2" data-axis="y" data-value="2" data-position="346.666667" data-label="2"/>
<line x1="110" y1="293.333333" x2="650" y2="293.333333" stroke="#cad5df" stroke-width="1"/>
<g data-axis-tick="y:4" data-axis="y" data-value="4" data-position="293.333333" data-label="4"/>
<line x1="110" y1="240" x2="650" y2="240" stroke="#cad5df" stroke-width="1"/>
<g data-axis-tick="y:6" data-axis="y" data-value="6" data-position="240" data-label="6"/>
<line x1="110" y1="186.666667" x2="650" y2="186.666667" stroke="#cad5df" stroke-width="1"/>
<g data-axis-tick="y:8" data-axis="y" data-value="8" data-position="186.666667" data-label="8"/>
