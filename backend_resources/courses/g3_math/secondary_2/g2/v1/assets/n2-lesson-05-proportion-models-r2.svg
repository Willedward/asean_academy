<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Direct proportion: y = 2x</title><desc id="desc">Graph of y = 2x for x from 0 to 6: a straight line through the origin O. The marked points (2, 4) and (4, 8) show that when x doubles, y doubles, and y ÷ x = 2 at both.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="110" y1="80" x2="110" y2="400" stroke="#cad5df" stroke-width="1"/>
<g data-axis-tick="x:0" data-axis="x" data-value="0" data-position="110" data-label="0"/>
<line x1="290" y1="80" x2="290" y2="400" stroke="#cad5df" stroke-width="1"/>
<g data-axis-tick="x:2" data-axis="x" data-value="2" data-position="290" data-label="2"/>
<line x1="470" y1="80" x2="470" y2="400" stroke="#cad5df" stroke-width="1"/>
