<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">A bar chart that starts at 94</title><desc id="desc">Bar chart of sales in thousands: Year 1 is 98 and Year 2 is 102. The vertical axis starts at 94, not 0, with ticks every 2 up to 104.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="90" y1="385" x2="680" y2="385" stroke="#cad5df" stroke-width="1.5"/>
<line x1="82" y1="385" x2="90" y2="385" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="y:94" data-axis="y" data-value="94" data-position="385" data-label="94"/>
<line x1="90" y1="329" x2="680" y2="329" stroke="#cad5df" stroke-width="1.5"/>
<line x1="82" y1="329" x2="90" y2="329" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="y:96" data-axis="y" data-value="96" data-position="329" data-label="96"/>
<line x1="90" y1="273" x2="680" y2="273" stroke="#cad5df" stroke-width="1.5"/>
<line x1="82" y1="273" x2="90" y2="273" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="y:98" data-axis="y" data-value="98" data-position="273" data-label="98"/>
<line x1="90" y1="217" x2="680" y2="217" stroke="#cad5df" stroke-width="1.5"/>
<line x1="82" y1="217" x2="90" y2="217" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="y:100" data-axis="y" data-value="100" data-position="217" data-label="100"/>
<line x1="90" y1="161" x2="680" y2="161" stroke="#cad5df" stroke-width="1.5"/>
<line x1="82" y1="161" x2="90" y2="161" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="y:102" data-axis="y" data-value="102" data-position="161" data-label="102"/>
<line x1="90" y1="105" x2="680" y2="105" stroke="#cad5df" stroke-width="1.5"/>
<line x1="82" y1="105" x2="90" y2="105" stroke="#17324d" stroke-width="2"/>
<g data-axis-tick="y:104" data-axis="y" data-value="104" data-position="105" data-label="104"/>
<line x1="90" y1="105" x2="90" y2="385" stroke="#17324d" stroke-width="3"/>
