<g data-axis-tick="x:Year 1" data-axis="x" data-value="Year 1" data-position="237.5" data-label="Year 1"/>
<g data-axis-tick="x:Year 2" data-axis="x" data-value="Year 2" data-position="532.5" data-label="Year 2"/>
<rect data-chart-mark="bar-0" data-chart-kind="bar" data-value="98" x="149" y="273" width="177" height="112" fill="#e36b45" stroke="#17324d" stroke-width="2"/>
<rect data-chart-mark="bar-1" data-chart-kind="bar" data-value="102" x="444" y="161" width="177" height="224" fill="#e36b45" stroke="#17324d" stroke-width="2"/>
<path d="M78 382 l10 -8 l10 8 l10 -8" fill="none" stroke="#17324d" stroke-width="3" data-role="axis-break"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="42" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">A bar chart that starts at 94</text>
<text x="75" y="393" font-size="25" font-weight="500" text-anchor="end" fill="#17324d">94</text>
<text x="75" y="337" font-size="25" font-weight="500" text-anchor="end" fill="#17324d">96</text>
<text x="75" y="281" font-size="25" font-weight="500" text-anchor="end" fill="#17324d">98</text>
<text x="75" y="225" font-size="25" font-weight="500" text-anchor="end" fill="#17324d">100</text>
<text x="75" y="169" font-size="25" font-weight="500" text-anchor="end" fill="#17324d">102</text>
<text x="75" y="113" font-size="25" font-weight="500" text-anchor="end" fill="#17324d">104</text>
