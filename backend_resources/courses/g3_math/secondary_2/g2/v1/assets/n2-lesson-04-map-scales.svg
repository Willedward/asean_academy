<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc">
<title id="title">How a map scale changes lengths and areas</title>
<desc id="desc">A scale of one to fifty thousand changes one centimetre on a map to five hundred metres in reality. A square measuring two centimetres by two centimetres on the map becomes a square measuring one kilometre by one kilometre, so its real area is one square kilometre.</desc>
<rect width="940" height="470" rx="24" fill="#f7faf9"/>
<text x="48" y="58" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#113f42">Scale 1 : 50 000</text>
<g font-family="system-ui,sans-serif" fill="#24384a">
  <text x="48" y="105" font-size="20" font-weight="600">Length scale</text>
  <line x1="60" y1="150" x2="240" y2="150" stroke="#d17a18" stroke-width="10" stroke-linecap="round"/>
  <line x1="60" y1="136" x2="60" y2="164" stroke="#113f42" stroke-width="3"/>
  <line x1="240" y1="136" x2="240" y2="164" stroke="#113f42" stroke-width="3"/>
  <text x="97" y="194" font-size="18">1 cm on map</text>
  <path d="M278 150 H402" stroke="#567478" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="456" y="145" font-size="22" font-weight="700">50 000 cm = 500 m</text>
  <text x="456" y="178" font-size="18">in reality</text>
  <text x="48" y="264" font-size="20" font-weight="600">Area scale</text>
  <rect x="70" y="300" width="120" height="120" fill="#d8eeea" stroke="#11665f" stroke-width="4"/>
  <text x="100" y="360" font-size="22" font-weight="700">2 cm</text>
  <text x="77" y="448" font-size="18">4 cm² on map</text>
  <path d="M278 360 H402" stroke="#567478" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="455" y="286" width="150" height="150" fill="#f8e4c9" stroke="#d17a18" stroke-width="4"/>
  <text x="493" y="364" font-size="22" font-weight="700">1 km</text>
  <text x="466" y="462" font-size="18">1 km² in reality</text>
  <text x="650" y="322" font-size="20" font-weight="700" fill="#113f42">Use both dimensions</text>
  <text x="650" y="360" font-size="17">length factor: 50 000</text>
  <text x="650" y="394" font-size="17">area factor: 50 000²</text>
</g>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#567478"/></marker></defs>
</svg>
