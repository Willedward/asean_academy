<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc"><title id="title">Testing triangles with the converse of Pythagoras</title><desc id="desc">Side-square comparisons show that seven, twenty-four, twenty-five forms a right triangle, while seven, twenty-four, twenty-six does not.</desc><rect width="940" height="470" rx="24" fill="#f7faf9"/><g font-family="system-ui,sans-serif"><text x="46" y="54" font-size="27" font-weight="700" fill="#113f42">Compare the square of the longest side</text><rect x="55" y="100" width="380" height="295" rx="18" fill="#e4f1ef"/><text x="85" y="145" font-size="23" font-weight="700">7, 24, 25</text><text x="85" y="210" font-size="22">7² + 24² = 625</text><text x="85" y="255" font-size="22">25² = 625</text><text x="85" y="325" font-size="24" font-weight="700" fill="#08766e">right-angled ✓</text><rect x="505" y="100" width="380" height="295" rx="18" fill="#fff1df"/><text x="535" y="145" font-size="23" font-weight="700">7, 24, 26</text><text x="535" y="210" font-size="22">7² + 24² = 625</text><text x="535" y="255" font-size="22">26² = 676</text><text x="535" y="325" font-size="24" font-weight="700" fill="#a35608">not right-angled ✗</text></g></svg>