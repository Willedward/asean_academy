<svg xmlns="http://www.w3.org/2000/svg" width="600" height="486" viewBox="0 0 600 486" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Pythagoras’ theorem</title><desc id="desc">Right-angled triangle with perpendicular sides a = 6 and b = 8 and hypotenuse c = 10 opposite the marked right angle, with 6² + 8² = 10².</desc>
<rect data-role="background" width="600" height="486" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="120,326 120,56 480,326" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="120" y1="326" x2="120" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="120" y1="326" x2="480" y2="326" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="120" y1="56" x2="480" y2="326" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M120 304 L142 304 L142 326" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-label-for="segment:AB" x="70.37" y="200.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">a = 6</text>
<text data-label-for="segment:AC" x="300" y="356.78" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">b = 8</text>
<text data-label-for="segment:BC" x="328.58" y="162.26" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">c = 10</text>
<text x="300" y="416.64" font-size="24" font-weight="600" text-anchor="middle" fill="#153f42">6² + 8² = 10²</text>
<text x="300" y="451.94" font-size="22" font-weight="500" text-anchor="middle" fill="#153f42">c is opposite the right angle</text>
</g>
</svg>
