<title id="title">Choosing a statistical representation</title><desc id="desc">Choosing a statistical representation teaching diagram</desc>
<rect width="960" height="480" rx="28" fill="#f6f8fa"/><style>.axis{stroke:#0d4548;stroke-width:4;fill:none}.bar{fill:#65b7ad;stroke:#0d4548;stroke-width:3}.accent{stroke:#cc7a18;stroke-width:6;fill:none}.dot{fill:#cc7a18}.t{font:25px Arial,sans-serif;fill:#153f43}.s{font:19px Arial,sans-serif;fill:#334155}</style><text class="t" x="55" y="55">Choose from the purpose and data type</text><rect class="bar" x="70" y="105" width="210" height="95" rx="16"/><text class="s" x="95" y="140">small discrete data</text><text class="s" x="98" y="175">dot or stem-and-leaf</text><rect class="bar" x="375" y="105" width="210" height="95" rx="16"/><text class="s" x="402" y="140">grouped continuous</text><text class="s" x="435" y="175">histogram</text><rect class="bar" x="680" y="105" width="210" height="95" rx="16"/><text class="s" x="714" y="140">exact lookup</text><text class="s" x="722" y="175">frequency table</text><path class="accent" d="M175 250v70h610v-70"/><text class="t" x="285" y="375">detail • shape • scale • audience</text></svg>
