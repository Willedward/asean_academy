<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Systematic sample-space table</title>
  <desc id="desc">A table lists the six equally likely outcomes from choosing red, blue or green and then tossing a coin. The outcomes red heads and red tails are highlighted as the event that red is chosen.</desc>
  <rect width="940" height="500" rx="28" fill="#f7faf9"/>
  <text x="52" y="60" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#123f43">List every outcome exactly once</text>
  <text x="52" y="98" font-family="system-ui, sans-serif" font-size="19" fill="#596579">Choose one colour, then toss a fair coin.</text>
  <g transform="translate(150 145)" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="0" y="0" width="640" height="260" rx="16" fill="#ffffff" stroke="#9ab4b0" stroke-width="3"/>
    <path d="M0 70H640M0 165H640M160 0V260M320 0V260M480 0V260" fill="none" stroke="#9ab4b0" stroke-width="3"/>
    <rect x="160" y="70" width="160" height="190" fill="#fff0dc"/>
    <g fill="#172238" font-size="22">
      <text x="80" y="45" font-weight="700">coin</text>
      <text x="240" y="45" font-weight="700">red</text>
      <text x="400" y="45" font-weight="700">blue</text>
      <text x="560" y="45" font-weight="700">green</text>
      <text x="80" y="125" font-weight="700">H</text>
      <text x="80" y="220" font-weight="700">T</text>
      <text x="240" y="125">RH</text>
      <text x="400" y="125">BH</text>
      <text x="560" y="125">GH</text>
      <text x="240" y="220">RT</text>
      <text x="400" y="220">BT</text>
      <text x="560" y="220">GT</text>
    </g>
  </g>
  <circle cx="170" cy="449" r="10" fill="#d07a16"/>
  <text x="194" y="456" font-family="system-ui, sans-serif" font-size="19" fill="#365b60">Highlighted outcomes: red is chosen, so P(red) = 2/6 = 1/3.</text>
</svg>
