<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">Fifteen test marks</title><desc id="desc">Stem-and-leaf diagram of fifteen test marks with key 5 | 2 means 52 marks. Stem 5: leaves 2, 6, 8. Stem 6: leaves 1, 3, 4, 7, 7. Stem 7: leaves 1, 5, 8. Stem 8: leaves 2, 5, 9. Stem 9: leaf 6.</desc>
<rect data-role="background" width="720" height="480" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<line x1="310" y1="90" x2="310" y2="355" stroke="#17324d" stroke-width="4"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="48" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">Fifteen test marks</text>
<text x="285" y="125" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">5</text>
<text x="335" y="125" font-size="25" font-weight="500" text-anchor="start" fill="#17324d" data-chart-mark="row-0" data-chart-kind="stem-leaf-row" data-value="5|2 6 8">2  6  8</text>
<text x="285" y="183" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">6</text>
<text x="335" y="183" font-size="25" font-weight="500" text-anchor="start" fill="#17324d" data-chart-mark="row-1" data-chart-kind="stem-leaf-row" data-value="6|1 3 4 7 7">1  3  4  7  7</text>
<text x="285" y="241" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">7</text>
<text x="335" y="241" font-size="25" font-weight="500" text-anchor="start" fill="#17324d" data-chart-mark="row-2" data-chart-kind="stem-leaf-row" data-value="7|1 5 8">1  5  8</text>
<text x="285" y="299" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">8</text>
<text x="335" y="299" font-size="25" font-weight="500" text-anchor="start" fill="#17324d" data-chart-mark="row-3" data-chart-kind="stem-leaf-row" data-value="8|2 5 9">2  5  9</text>
<text x="285" y="357" font-size="25" font-weight="600" text-anchor="end" fill="#17324d">9</text>
<text x="335" y="357" font-size="25" font-weight="500" text-anchor="start" fill="#17324d" data-chart-mark="row-4" data-chart-kind="stem-leaf-row" data-value="9|6">6</text>
<text x="360" y="420" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">Key: 5 | 2 means 52 marks</text>
</g>
</svg>
