<svg xmlns="http://www.w3.org/2000/svg" width="600" height="548" viewBox="0 0 600 548" role="img" aria-labelledby="title desc" data-renderer="nextscholar-mensuration-svg-v2">
<title id="title">Square-based pyramid</title><desc id="desc">Square-based pyramid with base side a. The perpendicular height h runs from the apex to the centre of the base with the right angle marked, and the slant height l runs down a triangular face to the midpoint of a base edge. Hidden edges are dashed. V = ⅓ × base area × h.</desc>
