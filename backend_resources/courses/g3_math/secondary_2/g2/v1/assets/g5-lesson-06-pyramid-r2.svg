<line data-segment="VP3" x1="300" y1="46" x2="519.96" y2="302.28" stroke="#124e52" stroke-width="5"/>
<line data-segment="VO" x1="300" y1="46" x2="300" y2="346" stroke="#c2620a" stroke-width="4" stroke-dasharray="10 8"/>
