<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Congruent triangles ABC and PQR</title><desc id="desc">Two triangles ABC and PQR, with PQR turned upside down. AB is marked (3x + 1) cm and PQ is marked 16 cm. AB and PQ have one tick, BC and QR have two ticks, and CA and RP have three ticks. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="300" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="A B C" points="50,181.33 246.08,181.33 116.67,48" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="50" y1="181.33" x2="246.08" y2="181.33" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="246.08" y1="181.33" x2="116.67" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="CA" x1="116.67" y1="48" x2="50" y2="181.33" stroke="#124e52" stroke-width="5"/>
<polygon data-shape="figure" data-points="P Q R" points="550,48 353.92,48 483.33,181.33" fill="#fdf3e6" stroke="none"/>
<line data-segment="PQ" x1="550" y1="48" x2="353.92" y2="48" stroke="#124e52" stroke-width="5"/>
<line data-segment="QR" x1="353.92" y1="48" x2="483.33" y2="181.33" stroke="#124e52" stroke-width="5"/>
<line data-segment="RP" x1="483.33" y1="181.33" x2="550" y2="48" stroke="#124e52" stroke-width="5"/>
<path data-tick-mark="AB" data-ticks="1" d="M148.04 191.33 L148.04 171.33" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="PQ" data-ticks="1" d="M451.96 38 L451.96 58" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="BC" data-ticks="2" d="M191.34 110.57 L176.99 124.5 M185.76 104.83 L171.41 118.76" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="QR" data-ticks="2" d="M408.66 118.76 L423.01 104.83 M414.24 124.5 L428.59 110.57" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="CA" data-ticks="3" d="M77.97 103.04 L95.86 111.98 M74.39 110.19 L92.28 119.14 M70.81 117.35 L88.7 126.29" fill="none" stroke="#124e52" stroke-width="3"/>
<path data-tick-mark="RP" data-ticks="3" d="M522.03 126.29 L504.14 117.35 M525.61 119.14 L507.72 110.19 M529.19 111.98 L511.3 103.04" fill="none" stroke="#124e52" stroke-width="3"/>
</g>
