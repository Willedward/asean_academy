<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc" data-renderer="nextscholar-data-chart-svg-v1">
<title id="title">A map square and the real square</title><desc id="desc">At map scale 1 : 50 000, a square with 2 cm sides on the map, area 4 cm², represents a real square with 1 km sides, area 1 km². The side lengths are marked along the bottom edges and the areas inside the squares. Not drawn to scale.</desc>
<rect data-role="background" width="720" height="470" rx="20" fill="#fffdf8"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<rect data-chart-mark="square-0" data-chart-kind="square" data-value="2 cm" x="90" y="220" width="110" height="110" fill="#dcecf6" stroke="#17324d" stroke-width="3"/>
<line x1="90" y1="348" x2="200" y2="348" stroke="#17324d" stroke-width="2"/>
<line x1="90" y1="340" x2="90" y2="356" stroke="#17324d" stroke-width="2"/>
<line x1="200" y1="340" x2="200" y2="356" stroke="#17324d" stroke-width="2"/>
<rect data-chart-mark="square-1" data-chart-kind="square" data-value="1 km" x="380" y="110" width="220" height="220" fill="#dcecf6" stroke="#17324d" stroke-width="3"/>
<line x1="380" y1="348" x2="600" y2="348" stroke="#17324d" stroke-width="2"/>
<line x1="380" y1="340" x2="380" y2="356" stroke="#17324d" stroke-width="2"/>
<line x1="600" y1="340" x2="600" y2="356" stroke="#17324d" stroke-width="2"/>
<path d="M 225 195 L 355 195 M 343 186 L 355 195 L 343 204" fill="none" stroke="#17324d" stroke-width="3"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text x="360" y="42" font-size="28" font-weight="600" text-anchor="middle" fill="#17324d">A map square and the real square</text>
<text x="145" y="382" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">2 cm</text>
<text x="145" y="284" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">4 cm²</text>
<text x="145" y="422" font-size="25" font-weight="600" text-anchor="middle" fill="#52667a">on the map</text>
<text x="490" y="382" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">1 km</text>
<text x="490" y="229" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">1 km²</text>
<text x="490" y="422" font-size="25" font-weight="600" text-anchor="middle" fill="#52667a">in reality</text>
<text x="275" y="175" font-size="25" font-weight="600" text-anchor="middle" fill="#17324d">1 : 50 000</text>
<text x="696" y="452" font-size="25" font-weight="600" text-anchor="end" fill="#52667a">Not drawn to scale</text>
</g>
</svg>
