<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc"><title id="title">Dimensions of a square-based pyramid</title><desc id="desc">A square-based pyramid showing its base side, perpendicular vertical height, and formulas for volume and surface area.</desc><rect width="940" height="500" rx="24" fill="#f7faf9"/><g font-family="system-ui,sans-serif" fill="#113f42"><text x="42" y="52" font-size="28" font-weight="700">Square-based pyramid</text>
    <path d="M245 92 L105 365 L385 365 Z" fill="#e4f1ef" stroke="#124e52" stroke-width="5"/>
    <path d="M245 92 L465 285 L385 365 M105 365 L465 285" fill="none" stroke="#124e52" stroke-width="5"/>
    <path d="M245 92 L245 325" fill="none" stroke="#d17a18" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M245 325 h35 v35" fill="none" stroke="#d17a18" stroke-width="4"/>
    <text x="258" y="220" font-size="22">vertical height h</text><text x="255" y="410" font-size="22">base side a</text>
    <text x="560" y="155" font-size="27" font-weight="700">V = ⅓ × base area × h</text>
    <text x="560" y="220" font-size="23">Surface area</text><text x="560" y="260" font-size="23">= base + four triangles</text>
    <text x="560" y="325" font-size="20" fill="#567478">Use the perpendicular height for volume.</text>
    <text x="560" y="360" font-size="20" fill="#567478">Use each face's slant height for area.</text></g></svg>