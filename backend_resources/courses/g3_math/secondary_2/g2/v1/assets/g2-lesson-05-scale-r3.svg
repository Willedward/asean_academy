<svg xmlns="http://www.w3.org/2000/svg" width="600" height="394" viewBox="0 0 600 394" role="img" aria-labelledby="title desc" data-renderer="nextscholar-similarity-svg-v1">
<title id="title">Shadows of a pole and a tree</title><desc id="desc">Two triangles, each with an upright, its shadow along level ground and a dashed sun ray. The pole is marked 1.8 m and its shadow 2.4 m. The tree is marked h. The second shadow is marked 14 m. A right angle is shown with a corner mark at the foot of the tree. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="394" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="figure" data-points="S1 F1 T1" points="50,270.3 98.98,270.3 98.98,233.56" fill="#e7f2f0" stroke="none"/>
<polygon data-shape="figure" data-points="S2 F2 T2" points="206.74,270.3 492.48,270.3 492.48,56" fill="#fdf3e6" stroke="none"/>
<line data-segment="S1F1" x1="50" y1="270.3" x2="98.98" y2="270.3" stroke="#124e52" stroke-width="5"/>
<line data-segment="F1T1" x1="98.98" y1="270.3" x2="98.98" y2="233.56" stroke="#124e52" stroke-width="5"/>
<line data-segment="S1T1" x1="50" y1="270.3" x2="98.98" y2="233.56" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<line data-segment="S2F2" x1="206.74" y1="270.3" x2="492.48" y2="270.3" stroke="#124e52" stroke-width="5"/>
<line data-segment="F2T2" x1="492.48" y1="270.3" x2="492.48" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="S2T2" x1="206.74" y1="270.3" x2="492.48" y2="56" stroke="#124e52" stroke-width="3" stroke-dasharray="10 8"/>
<path data-right-angle-marker="F2" d="M476.48 270.3 L476.48 254.3 L492.48 254.3" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="374" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="segment:F1T1" x="152.12" y="261.29" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">1.8 m</text>
<text data-label-for="segment:F2T2" x="512.6" y="172.51" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">h</text>
<text data-label-for="segment:S1F1" x="74.49" y="301.08" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">2.4 m</text>
<text data-label-for="segment:S2F2" x="349.61" y="301.08" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">14 m</text>
<text data-label-for="caption:first-name" x="98.98" y="220.04" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">pole</text>
<text data-label-for="caption:second-name" x="492.48" y="44.64" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">tree</text>
</g>
</svg>
