<svg xmlns="http://www.w3.org/2000/svg" width="600" height="466" viewBox="0 0 600 466" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Right-angled triangle</title><desc id="desc">Right-angled triangle with hypotenuse 6 m and a marked acute angle of 70°. The side opposite that angle is labelled h. Not drawn to scale.</desc>
<rect data-role="background" width="600" height="466" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="247.22,346 247.22,56 352.78,346" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="247.22" y1="346" x2="247.22" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="247.22" y1="346" x2="352.78" y2="346" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="247.22" y1="56" x2="352.78" y2="346" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M247.22 324 L269.22 324 L269.22 346" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M306.78 346 A46 46 0 0 1 337.05 302.77" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-role="note" x="578" y="446" font-size="22" font-weight="500" text-anchor="end" fill="#55696d">Not drawn to scale</text>
<text data-label-for="angle:C" x="281.73" y="305.61" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">70°</text>
<text data-label-for="segment:AB" x="227.1" y="210.36" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">h</text>
<text data-label-for="segment:BC" x="338.17" y="196.47" font-size="26" font-weight="700" text-anchor="middle" fill="#153f42">6 m</text>
</g>
</svg>
