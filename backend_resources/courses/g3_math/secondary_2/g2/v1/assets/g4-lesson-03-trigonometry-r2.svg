<svg xmlns="http://www.w3.org/2000/svg" width="600" height="461" viewBox="0 0 600 461" role="img" aria-labelledby="title desc" data-renderer="nextscholar-right-triangle-svg-v2">
<title id="title">Naming sides relative to θ</title><desc id="desc">Right-angled triangle with the acute angle θ marked at the base. The side opposite θ is labelled opposite, the side next to θ is labelled adjacent and the side opposite the right angle is labelled hypotenuse, with sin θ = opposite ÷ hypotenuse, cos θ = adjacent ÷ hypotenuse and tan θ = opposite ÷ adjacent.</desc>
<rect data-role="background" width="600" height="461" rx="20" fill="#f7faf9"/>
<g data-layer="figure" stroke-linecap="round" stroke-linejoin="round">
<polygon data-shape="triangle" data-points="A B C" points="150,281 150,56 450,281" fill="#e7f2f0" stroke="none"/>
<line data-segment="AB" x1="150" y1="281" x2="150" y2="56" stroke="#124e52" stroke-width="5"/>
<line data-segment="AC" x1="150" y1="281" x2="450" y2="281" stroke="#124e52" stroke-width="5"/>
<line data-segment="BC" x1="150" y1="56" x2="450" y2="281" stroke="#124e52" stroke-width="5"/>
<path data-right-angle-marker="A" d="M150 259 L172 259 L172 281" fill="none" stroke="#c2620a" stroke-width="3.5"/>
<path data-angle-marker="angle-C" d="M398 281 A52 52 0 0 1 408.4 249.8" fill="none" stroke="#c2620a" stroke-width="3.5"/>
</g>
<g data-layer="labels" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" stroke="none">
<text data-label-for="angle:C" x="377.7" y="266.26" font-size="26" font-weight="700" text-anchor="middle" fill="#8a4406">θ</text>
<text data-label-for="segment:AB" x="78.54" y="174.98" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">opposite</text>
<text data-label-for="segment:AC" x="300" y="310.22" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">adjacent</text>
<text data-label-for="segment:BC" x="341.85" y="119.18" font-size="24" font-weight="700" text-anchor="middle" fill="#153f42">hypotenuse</text>
<text x="300" y="356.94" font-size="22" font-weight="500" text-anchor="middle" fill="#153f42">sin θ = opposite ÷ hypotenuse</text>
<text x="300" y="392.94" font-size="22" font-weight="500" text-anchor="middle" fill="#153f42">cos θ = adjacent ÷ hypotenuse</text>
<text x="300" y="428.94" font-size="22" font-weight="500" text-anchor="middle" fill="#153f42">tan θ = opposite ÷ adjacent</text>
</g>
</svg>
