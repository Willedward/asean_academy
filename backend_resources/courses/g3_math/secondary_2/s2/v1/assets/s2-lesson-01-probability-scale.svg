<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="title desc">
  <title id="title">Probability scale from impossible to certain</title>
  <desc id="desc">A horizontal probability scale marked zero, one quarter, one half, three quarters and one. Impossible is at zero, an even chance at one half and certain at one.</desc>
  <rect width="940" height="420" rx="28" fill="#f7faf9"/>
  <text x="54" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#123f43">Probability describes how likely an event is</text>
  <line x1="100" y1="210" x2="840" y2="210" stroke="#123f43" stroke-width="8" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif" fill="#172238" text-anchor="middle">
    <g transform="translate(100 210)">
      <line y1="-22" y2="22" stroke="#d07a16" stroke-width="6"/>
      <text y="62" font-size="24" font-weight="700">0</text>
      <text y="96" font-size="20">impossible</text>
    </g>
    <g transform="translate(285 210)">
      <line y1="-16" y2="16" stroke="#527178" stroke-width="5"/>
      <text y="62" font-size="22">1/4</text>
      <text y="96" font-size="18">unlikely</text>
    </g>
    <g transform="translate(470 210)">
      <circle r="18" fill="#d07a16"/>
      <line y1="-28" y2="28" stroke="#123f43" stroke-width="5"/>
      <text y="68" font-size="24" font-weight="700">1/2</text>
      <text y="102" font-size="20">even chance</text>
    </g>
    <g transform="translate(655 210)">
      <line y1="-16" y2="16" stroke="#527178" stroke-width="5"/>
      <text y="62" font-size="22">3/4</text>
      <text y="96" font-size="18">likely</text>
    </g>
    <g transform="translate(840 210)">
      <line y1="-22" y2="22" stroke="#d07a16" stroke-width="6"/>
      <text y="62" font-size="24" font-weight="700">1</text>
      <text y="96" font-size="20">certain</text>
    </g>
  </g>
  <path d="M155 145 C285 92 655 92 785 145" fill="none" stroke="#77a59e" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="470" y="118" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#365b60">increasing likelihood</text>
  <text x="470" y="370" font-family="system-ui, sans-serif" font-size="19" text-anchor="middle" fill="#596579">Every probability lies between 0 and 1 inclusive.</text>
</svg>
