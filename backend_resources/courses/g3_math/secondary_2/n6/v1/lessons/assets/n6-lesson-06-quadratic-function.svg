<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">Table and graph of y equals x squared minus 4</title>
<desc id="desc">A coordinate graph shows the upward-opening parabola y equals x squared minus 4, with vertex at zero negative four and roots at negative two and two. A value table lists matching x and y values.</desc>
<rect width="960" height="460" rx="24" fill="#f7faf9"/>
<text x="44" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#123f42">From a rule to a table and graph</text>
<g transform="translate(44 80)">
  <rect x="0" y="0" width="260" height="310" rx="16" fill="#ffffff" stroke="#cbdad8" stroke-width="2"/>
  <text x="130" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#123f42">y = x² − 4</text>
  <line x1="30" y1="58" x2="230" y2="58" stroke="#89a3a1" stroke-width="2"/>
  <line x1="95" y1="58" x2="95" y2="275" stroke="#89a3a1" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="18" fill="#334155" text-anchor="middle">
    <text x="62" y="88" font-weight="700">x</text><text x="162" y="88" font-weight="700">y</text>
    <text x="62" y="124">−3</text><text x="162" y="124">5</text>
    <text x="62" y="158">−2</text><text x="162" y="158">0</text>
    <text x="62" y="192">−1</text><text x="162" y="192">−3</text>
    <text x="62" y="226">0</text><text x="162" y="226">−4</text>
    <text x="62" y="260">1, 2, 3</text><text x="162" y="260">−3, 0, 5</text>
  </g>
</g>
<g transform="translate(350 80)">
  <rect x="0" y="0" width="560" height="310" rx="16" fill="#ffffff" stroke="#cbdad8" stroke-width="2"/>
  <line x1="50" y1="145" x2="520" y2="145" stroke="#334155" stroke-width="2"/>
  <line x1="285" y1="24" x2="285" y2="286" stroke="#334155" stroke-width="2"/>
  <path d="M75 35 C155 233 220 260 285 260 C350 260 415 233 495 35" fill="none" stroke="#d17b16" stroke-width="5"/>
  <line x1="285" y1="30" x2="285" y2="275" stroke="#0f7774" stroke-width="2" stroke-dasharray="7 7"/>
  <g fill="#123f42" font-family="Arial, sans-serif" font-size="17">
    <circle cx="128" cy="145" r="6"/><text x="104" y="170">(−2, 0)</text>
    <circle cx="442" cy="145" r="6"/><text x="422" y="170">(2, 0)</text>
    <circle cx="285" cy="260" r="6"/><text x="300" y="267">(0, −4)</text>
    <text x="500" y="134">x</text><text x="296" y="36">y</text>
  </g>
</g>
</svg>