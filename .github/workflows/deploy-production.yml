name: Production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asean_academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asean_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asean_academy_test
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asean_academy_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Require the main branch for production
        run: test "$GITHUB_REF" = "refs/heads/main"
      - run: uv sync --project services/learning_api --locked
      - run: uv sync --project question_bank --locked
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/check_migration_safety.py
      - run: bash scripts/validate_migrations.sh
      - run: uv run --project services/learning_api --locked question-bank import-db
      - run: uv run --project services/learning_api --locked question-bank course-import-db
      - run: uv run --project services/learning_api ruff check services/learning_api/src services/learning_api/tests services/learning_api/scripts
      - run: uv run --project services/learning_api pytest services/learning_api/tests
      - run: uv run --project question_bank ruff check question_bank/src question_bank/tests
      - run: uv run --project question_bank pytest question_bank/tests
      - run: pnpm ci:web
      - name: Verify generated contracts and fixtures
        run: git diff --exit-code -- services/learning_api/openapi.json apps/web/src/lib/api/schema.d.ts apps/web/src/fixtures

  release:
    name: Migrate, deploy and smoke production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
      RAILWAY_WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Validate release configuration
        run: |
          : "${RAILWAY_TOKEN:?Configure the production RAILWAY_TOKEN secret.}"
          : "${SUPABASE_ACCESS_TOKEN:?Configure the production SUPABASE_ACCESS_TOKEN secret.}"
          : "${SUPABASE_DB_PASSWORD:?Configure the production SUPABASE_DB_PASSWORD secret.}"
          : "${PRODUCTION_DATABASE_URL:?Configure the production PRODUCTION_DATABASE_URL secret.}"
          : "${SUPABASE_PROJECT_ID:?Configure the SUPABASE_PROJECT_ID repository variable.}"
          : "${RAILWAY_API_SERVICE:?Configure the RAILWAY_API_SERVICE repository variable.}"
          : "${RAILWAY_WEB_SERVICE:?Configure the RAILWAY_WEB_SERVICE repository variable.}"
          : "${PRODUCTION_API_URL:?Configure the PRODUCTION_API_URL repository variable.}"
          : "${PRODUCTION_WEB_URL:?Configure the PRODUCTION_WEB_URL repository variable.}"
      - name: Apply pending Supabase migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes
      - name: Import the immutable question and course revisions
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          uv sync --project services/learning_api --locked --no-dev
          uv run --project services/learning_api --locked question-bank import-db
          uv run --project services/learning_api --locked question-bank course-import-db
      - name: Stamp and deploy the API
        run: |
          npx -y @railway/cli@4 variable set "ASEAN_ACADEMY_RELEASE_SHA=$GITHUB_SHA" --skip-deploys --service "$RAILWAY_API_SERVICE"
          npx -y @railway/cli@4 up --ci --service "$RAILWAY_API_SERVICE"
      - name: Verify the API release and database readiness
        run: |
          python3 scripts/smoke_deployment.py \
            --api-url "$PRODUCTION_API_URL" \
            --expected-release "$GITHUB_SHA" \
            --attempts 36 \
            --interval-seconds 5
      - name: Stamp and deploy the web app
        run: |
          npx -y @railway/cli@4 variable set "ASEAN_ACADEMY_RELEASE_SHA=$GITHUB_SHA" --skip-deploys --service "$RAILWAY_WEB_SERVICE"
          npx -y @railway/cli@4 up --ci --service "$RAILWAY_WEB_SERVICE"
      - name: Verify the complete production application
        run: |
          python3 scripts/smoke_deployment.py \
            --api-url "$PRODUCTION_API_URL" \
            --web-url "$PRODUCTION_WEB_URL" \
            --expected-release "$GITHUB_SHA" \
            --attempts 36 \
            --interval-seconds 5
