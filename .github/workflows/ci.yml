name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web contract, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --project services/learning_api --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  python:
    name: Learning API and question domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --project services/learning_api --locked
      - run: uv run --project services/learning_api ruff check services/learning_api/src services/learning_api/tests services/learning_api/scripts
      - run: uv run --project services/learning_api pytest services/learning_api/tests
      - run: uv sync --project question_bank --locked
      - run: uv run --project question_bank ruff check question_bank/src question_bank/tests
      - run: uv run --project question_bank pytest question_bank/tests

  migrations:
    name: PostgreSQL migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asean_academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asean_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asean_academy_test
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate_migrations.sh
