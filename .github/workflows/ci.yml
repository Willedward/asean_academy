name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web contract, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --project services/learning_api --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Verify committed generated contracts and fixtures
        run: git diff --exit-code -- services/learning_api/openapi.json apps/web/src/lib/api/schema.d.ts apps/web/src/fixtures

  python:
    name: Learning API and question domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --project services/learning_api --locked
      - run: uv run --project services/learning_api ruff check services/learning_api/src services/learning_api/tests services/learning_api/scripts scripts/backup_restore_drill.py scripts/load_test_api.py
      - run: uv run --project services/learning_api pytest services/learning_api/tests
      - run: uv run --project services/learning_api pytest scripts/test_smoke_deployment.py
      - run: uv sync --project question_bank --locked
      - run: uv run --project question_bank ruff check question_bank/src question_bank/tests
      - run: uv run --project question_bank pytest question_bank/tests

  migrations:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asean_academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asean_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asean_academy_test
    steps:
      - uses: actions/checkout@v4
      - name: Reject unreviewed destructive migrations
        run: python3 scripts/check_migration_safety.py
      - run: bash scripts/validate_migrations.sh
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --project services/learning_api --locked
      - run: uv run --project services/learning_api --locked question-bank import-db
      - run: uv run --project services/learning_api --locked question-bank course-import-db
      - name: Run database integration tests (including bootstrap)
        run: uv run --project services/learning_api --locked pytest services/learning_api/tests -m postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asean_academy_test
      - name: Create empty recovery target
        run: psql -X "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database asean_academy_restore"
      - name: Prove PostgreSQL backup and restore integrity
        run: uv run --project services/learning_api --locked python scripts/backup_restore_drill.py
        env:
          SOURCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asean_academy_test
          RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asean_academy_restore

  authenticated-e2e:
    name: Authenticated beta browser journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asean_academy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asean_academy_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/asean_academy_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --project services/learning_api --locked
      - run: pnpm install --frozen-lockfile
      - name: Prepare disposable E2E database
        run: |
          DATABASE_URL="$E2E_DATABASE_URL" bash scripts/validate_migrations.sh
          DATABASE_URL="$E2E_DATABASE_URL" uv run --project services/learning_api --locked question-bank import-db
          DATABASE_URL="$E2E_DATABASE_URL" uv run --project services/learning_api --locked question-bank course-import-db
          uv run --project services/learning_api --locked python services/learning_api/scripts/seed_e2e.py
      - run: pnpm --filter @asean-academy/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
